# Device-lab assignment - copy to lab.yml (local, NEVER committed: it
# holds serials and host addresses) and adjust. Each host runs
#   python3 tools/lab/run.py --config lab.yml --host <name>
# and produces one JSON; --merge combines them.

hosts:
  macbook:            # the default full set
    host_ip: 192.168.2.195    # how iOS devices reach this host's fixture server
    artifacts:                # each artifact on a host that can READ it:
      ios: ../reference-builds/phyphox.ipa   # the .apk needs aapt (SDK),
                                             # so it lives with linuxbox
    devices:
      pixel-9-pro:   {platform: android, serial: "53291FDAP0026B", port: 8184}
      pixel-3:       {platform: android, serial: "8C5X1J8JL", port: 8185}
      nexus-5x:      {platform: android, serial: "025e9f6567c4d0e5", port: 8186}
      galaxy-a3:     {platform: android, serial: "33007f6cd2ab1445", port: 8187}
      iphone-14-pro: {platform: ios, serial: "00008120-001C31520EC0C01E", port: 8181}
      iphone-8:      {platform: ios, serial: "abff2ed0b2ee61af08467e4381063a5e45da4ad0", port: 8182}
      ipad-pro:      {platform: ios, serial: "00008103-0015196202A3001E", port: 8183}
  linuxbox:           # the split: Android (+ boards, phase 6) here,
    artifacts:        # the Android SDK is here, so the apk gate runs here
      # a test build, not a release candidate: the locale comparison is
      # reported but does not fail the run (it legitimately carries the
      # testing-only locales). Drop `release: false` - or point this at a
      # release apk - and the gate has its teeth back.
      android: {path: ../reference-builds/phyphox.apk, release: false}
    devices:          # iOS stays with the MacBook
      pixel-9-pro:   {platform: android, serial: "53291FDAP0026B", port: 8184}
      pixel-3:       {platform: android, serial: "8C5X1J8JL", port: 8185}
      nexus-5x:      {platform: android, serial: "025e9f6567c4d0e5", port: 8186}
      galaxy-a3:     {platform: android, serial: "33007f6cd2ab1445", port: 8187}
