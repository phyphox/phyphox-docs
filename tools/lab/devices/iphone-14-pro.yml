# iPhone 14 Pro - lab sensor truth. Hand-finished 2026-08-26 from the
# recorded skeleton. No light entry: iOS has no ambient light API
# (Android-only row). Rates tightened to the first green run's measured values
# (motion 100 Hz as requested, barometer 1.1 Hz via CMAltimeter).
device: iphone-14-pro
sensors:
  accelerometer:
    experiment: accelerometer.phyphox
    value_buffers: [accX, accY, accZ]
    time_buffer: acc_time
    plausibility: magnitude9.81
    rate: {expect: 100, tol: 0.2}
    seconds: 8
  gyroscope:
    experiment: gyroscope.phyphox
    value_buffers: [gyrX, gyrY, gyrZ]
    time_buffer: gyr_time
    plausibility: near0
    rate: {expect: 100, tol: 0.2}
    seconds: 8
  magnetometer:
    experiment: magnetometer.phyphox
    value_buffers: [magX, magY, magZ]
    time_buffer: mag_time
    plausibility: earthfield
    rate: {expect: 100, tol: 0.2}
    seconds: 8
  pressure:
    experiment: pressure.phyphox
    value_buffers: [pressure]
    time_buffer: p_time
    plausibility: pressure
    rate: {expect: 1.1, tol: 0.5}
    seconds: 10
gps:
  experiment: gps.phyphox
