# Expected behavior per invalid corpus file - checked by tools/hooks.py and
# by the app test suites (test-matrix rows corpus-invalid-reject and
# corpus-tolerated-attributes-load).
#
# Each file is a real experiment configuration carrying a defect: dead draft
# syntax that never shipped, a construct removed from the format, a typo, or
# an attribute applied to the wrong element. Two fields per file:
#
#   findings  substrings that tools/validate_experiments.py must report. The
#             build fails if a file stops producing its documented finding -
#             that would mean the spec (or the validator) silently started
#             accepting it. Every file is validator-invalid.
#
#   parser    what the APPS do with the file, per the unknown-attribute-
#             ignored rule (spec/rules.yml, decided 2026-08-24):
#               rejects - the real loading path refuses the file (structural
#                         defects, invalid enum values, unknown conversion
#                         functions, the graph pairing rules)
#               accepts - the file LOADS: its defects are tolerated for
#                         compatibility - unknown or misapplied attributes
#                         (unknown-attribute-ignored) or duplicated root
#                         metadata (duplicate-metadata-last-wins). The app
#                         suites assert the load succeeds - that tolerance
#                         is itself contract.
#             Classification measured on the Android development branch
#             2026-08-24 (corpus runner); iOS confirms with its own runner
#             and any disagreement is a finding to report, not to paper over.

graph-style-line.phyphox:            # "line" was never a valid graph style
  parser: rejects
  findings:
    - 'style="line"'
network-mode-trigger.phyphox:        # draft network syntax that never shipped
  parser: accepts
  findings:
    - '<connection>: mode="trigger"'
bluetooth-pre-ble.phyphox:           # pre-BLE bluetooth of phyphox 1.0x
  parser: rejects
  findings:
    - '<bluetooth>: protocol='
    - '<bluetooth>: separator='
    - '<bluetooth>: mode'              # required by the BLE syntax it predates
bluetooth-dev-conversion.phyphox:    # 2018 device-specific conversion draft
  parser: rejects                      # (ti_acc_*, removed pre-release in
  findings:                            # phyphox-android 37b3fb69)
    - 'conversion="ti_acc_x"'
camera-threshold.phyphox:            # two dev-era defects: the threshold=
  parser: rejects                      # attribute is tolerated per
  findings:                            # unknown-attribute-ignored, but the
    - '<camera>: threshold='           # component="threshold" output rejects
    - 'component="threshold"'          # per output-component-validation (it
                                       # belonged to a removed, never-
                                       # functional Android-only analyzer;
                                       # iOS dropped its stale entry
                                       # 2026-08-24). Its stray
                                       # version="1.18" XML declaration was
                                       # fixed 2026-08-24.
camera-input-controls.phyphox:       # unknown output components (rejected per
  parser: rejects                      # output-component-validation); ALSO
  findings:                            # carries misapplied camera-gui
    - 'sensor_pixel_height'            # attributes, which are ignored
    - '<camera>: exposure_adjustment_level='
    - '<camera>: show_controls='
camera-gui-locked-empty.phyphox:     # locked belongs to the camera input
  parser: accepts
  findings:
    - '<camera-gui>: locked='
analysis-cycle-typo.phyphox:         # cycle= instead of cycles= - runs every cycle
  parser: accepts
  findings:
    - '<formula>: cycle='
    - '<map>: cycle='
container-site-typo.phyphox:         # site= instead of size=
  parser: accepts
  findings:
    - '<container>: site='
view-misapplied-attributes.phyphox:  # edit attributes on value, value attribute on edit
  parser: accepts
  findings:
    - '<value>: signed='
    - '<value>: decimal='
    - '<edit>: precision='
    - '<config>: offset='
edit-misapplied-attributes.phyphox:  # value attributes on edit
  parser: accepts
  findings:
    - '<edit>: size='
    - '<edit>: scientific='
network-receive-type.phyphox:        # type belongs to send, not receive
  parser: accepts
  findings:
    - '<receive>: type='
graph-value-attributes.phyphox:      # value attributes on graph
  parser: accepts
  findings:
    - '<graph>: size='
    - '<graph>: precision='
    - '<graph>: unit='
value-input-axis.phyphox:            # axis belongs to graph inputs
  parser: accepts
  findings:
    - '<input>: axis='
graph-precisionx.phyphox:            # dev syntax that never shipped
  parser: accepts
  findings:
    - '<graph>: precisionX='
analysis-optimization.phyphox:       # stale attribute no parser ever read
  parser: accepts
  findings:
    - '<analysis>: optimization='
state-title-duplicate.phyphox:       # old Android re-saves appended a fresh
  parser: accepts                     # state-title instead of replacing it;
  findings:                           # parsers tolerate the duplicate, last
    - 'state-title appears 2 times'   # occurrence wins (rule
                                      # duplicate-metadata-last-wins,
                                      # decided 2026-08-24)
graph-unused-x.phyphox:              # x inputs no y input uses (decided 2026-08-20)
  parser: rejects
  findings:
    - '<graph>: x input 2 of 2 is used by no y input'
    - '<graph>: x input 1 of 2 is used by no y input'

# Captured from the phyphox-arduino and phyphox-micropython libraries by the
# BLE lab (tools/lab/ble.py --capture-ble-xml), byte for byte as a board
# served them. They are here rather than in valid/ because the libraries
# emit three attribute names the format does not have - facor for factor,
# setColor for color, linewidth for lineWidth - so the apps drop them
# silently and a sketch asking for a colour or a line width gets neither.
#
# They stay here until long AFTER the current libraries are replaced
# (maintainer, 2026-08-29): boards running this code will be in the field
# for years, the apps have to keep loading what they serve, and these files
# are how we find out if that ever stops being true. Do not re-capture them
# against a fixed library - capture the fixed output as new fixtures in
# valid/ and leave these where they are.

ble-lib-arduino-CreateExperiment.phyphox:
  parser: accepts
  findings:
    - "<views>/<view>/<separator>: setColor=\"404040\""
    - "<views>/<view>/<value>: facor=\"1\""
ble-lib-arduino-connectionParameter.phyphox:
  parser: accepts
  findings:
    - "<views>/<view>/<value>: facor=\"1\""
ble-lib-arduino-getSensorDataFromSmartphone-nano33ble.phyphox:
  parser: accepts
  findings:
    - "<views>/<view>/<value>: facor=\"1\""
ble-lib-arduino-getSensorDataFromSmartphone.phyphox:
  parser: accepts
  findings:
    - "<views>/<view>/<value>: facor=\"1\""
ble-lib-arduino-getSystemAndEventTime.phyphox:
  parser: accepts
  findings:
    - "<views>/<view>/<value>: facor=\"1\""
ble-lib-arduino-multigraph.phyphox:
  parser: accepts
  findings:
    - "<views>/<view>/<graph>/<input>: linewidth=\"2.00\""
    - "<views>/<view>/<graph>/<input>: linewidth=\"1.00\""
ble-lib-arduino-randomNumbers.phyphox:
  parser: accepts
  findings:
    - "<views>/<view>/<value>: facor=\"1\""
ble-lib-micropython-createExperiment.phyphox:
  parser: accepts
  findings:
    - "<views>/<view>/<value>: facor=\"1\""

# Folded in from phyphox-ios phyphoxTests/incorrect-files/ (2026-08-29): fixtures only
# the iOS suite ran, so no rule below was ever asserted on Android. Every one is
# rejected by both parsers; `rejects` is measured, not assumed - the docs session ran
# Android's CorpusInvalidRejectTest over the whole legacy set and iOS's runner covers
# them here. The rest of that set could not follow: see the report with this change.

container-init-empty-entry.phyphox:   # an empty entry in an init list
  parser: rejects
  findings:
    - "<data-containers>/<container> init=\"1,,2\" is not a comma-separated list of numbers"
container-init-inf-entry.phyphox:   # inf is not a number a container can hold
  parser: rejects
  findings:
    - "<data-containers>/<container> init=\"inf\" is not a comma-separated list of numbers"
container-init-invalid-entry.phyphox:   # a word in a numeric init list
  parser: rejects
  findings:
    - "<data-containers>/<container> init=\"1, two, 3\" is not a comma-separated list of numbers"
graph-shadowed-x-input.phyphox:   # two x inputs, one y - the first x is used by nothing
  parser: rejects
  findings:
    - "<views>/<view>/<graph>: x input 1 of 2 is used by no y input (1 y inputs)"
graph-trailing-x-input.phyphox:   # two x inputs, one y - the second x is used by nothing
  parser: rejects
  findings:
    - "<views>/<view>/<graph>: x input 2 of 2 is used by no y input (1 y inputs)"
invalid-boolean-value.phyphox:   # yes is not a boolean
  parser: rejects
  findings:
    - "<input>/<sensor> average=\"yes\""
invalid-enum-value.phyphox:   # a value outside the enumerated set
  parser: rejects
  findings:
    - "<input>/<sensor> rateStrategy=\"bogus\" not in ['auto', 'request', 'generate', 'limit']"
link-missing-label.phyphox:   # <link> without its required label
  parser: rejects
  findings:
    - "<link>: label"
link-translation-attribute-at-root.phyphox:   # translation= belongs on a translated link
  parser: rejects
  findings:
    - "<link>: translation=\"Wiki (de)\""
number-attribute-inf.phyphox:   # inf where a float is required
  parser: rejects
  findings:
    - "<views>/<view>/<value> factor=\"inf\" is not a valid float"
sensor-missing-type.phyphox:   # <sensor> without its type
  parser: rejects
  findings:
    - "<input>/<sensor>: type"
slider-invalid-type.phyphox:   # a value outside the enumerated set
  parser: rejects
  findings:
    - "<views>/<view>/<slider> type=\"bogus\" not in ['normal', 'range']"
translation-missing-locale.phyphox:   # <translation> without its locale
  parser: rejects
  findings:
    - "<translations>/<translation>: locale"
unknown-container-type.phyphox:   # a value outside the enumerated set
  parser: rejects
  findings:
    - "<data-containers>/<container> type=\"bogus\" not in ['buffer']"
unknown-output-component.phyphox:   # a component the sensor does not have
  parser: rejects
  findings:
    - "<sensor>/<output component=\"acc\"> not a component of this input (['abs', 'accuracy', 't', 'x', 'y', 'z'])"
unknown-slot-name.phyphox:   # as= naming a slot the module does not have
  parser: rejects
  findings:
    - "<add>/<input as=\"bogus\"> not a slot of this module (['summand'])"
unnamed-sensor-output.phyphox:   # <output> without the component it writes
  parser: rejects
  findings:
    - "<sensor>/<output> has no component attribute (one of ['abs', 'accuracy', 't', 'x', 'y', 'z'])"

# The rest of the phyphox-ios incorrect-files set (2026-08-29), filable once
# validate_experiments learned the four spec fields the published validators were
# already generated from, plus four checks neither had. The numbered files are one
# family: each carries the defect it was written for AND the template's own <subtract>
# with a single input, which is why several share that finding.

audio-input-negative-rate.phyphox:   # audio input rate=-1
  parser: rejects
  findings:
    - "<subtract> has 1 <input> tag(s), and its slots require 2 between them (['minuend', 'subtrahend'])"
    - "<input>/<audio>: rate=\"-1\" must be greater than 0"
buffer-name-mismatch.phyphox:   # container named buf, everything reads buffer
  parser: rejects
  findings:
    - "<subtract> has 1 <input> tag(s), and its slots require 2 between them (['minuend', 'subtrahend'])"
buffer-referenced-but-not-declared.phyphox:   # <data-containers> empty, buffer referenced
  parser: rejects
  findings:
    - "<subtract> has 1 <input> tag(s), and its slots require 2 between them (['minuend', 'subtrahend'])"
category-missing-for-base-locale.phyphox:   # no <category>, and a negative audio output rate
  parser: rejects
  findings:
    - "<phyphox>: no <category> for the base language (en)"
    - "<subtract> has 1 <input> tag(s), and its slots require 2 between them (['minuend', 'subtrahend'])"
    - "<output>/<audio>: rate=\"-1\" must be greater than 0"
data-containers-missing.phyphox:   # no <data-containers> at all
  parser: rejects
  findings:
    - "<subtract> has 1 <input> tag(s), and its slots require 2 between them (['minuend', 'subtrahend'])"
gausssmooth-zero-sigma.phyphox:   # sigma=0
  parser: rejects
  findings:
    - "<analysis>/<gausssmooth>: sigma=\"0\" must be greater than 0"
invalid-color-value.phyphox:   # a colour that is neither hex nor a named one
  parser: rejects
  findings:
    - "<views>/<view>/<value>: color=\"bogus\" is neither a six-digit hex colour nor a name the spec lists"
link-duplicate-label.phyphox:   # two root links with one label
  parser: rejects
  findings:
    - "<phyphox>/<link>: label=\"Wiki\" appears 2 times among its siblings"
link-empty-url-at-root.phyphox:   # <link> with no URL
  parser: rejects
  findings:
    - "<link>: needs a value, and is empty"
missing-required-slot.phyphox:   # <subtract> given one input where two are required
  parser: rejects
  findings:
    - "<subtract> has 1 <input> tag(s), and its slots require 2 between them (['minuend', 'subtrahend'])"
root-version-missing.phyphox:   # <phyphox> without version
  parser: rejects
  findings:
    - "<phyphox>: no version attribute"
    - "<subtract> has 1 <input> tag(s), and its slots require 2 between them (['minuend', 'subtrahend'])"
subtract-one-input-of-two.phyphox:   # the family's template defect alone - same rule as missing-required-slot, from a fuller file
  parser: rejects
  findings:
    - "<subtract> has 1 <input> tag(s), and its slots require 2 between them (['minuend', 'subtrahend'])"
title-missing-for-base-locale.phyphox:   # no <title> for the base language
  parser: rejects
  findings:
    - "<phyphox>: no <title> for the base language (en)"
    - "<subtract> has 1 <input> tag(s), and its slots require 2 between them (['minuend', 'subtrahend'])"
translated-link-duplicate-label.phyphox:   # two translated links with one label
  parser: rejects
  findings:
    - "<translations>/<translation>/<link>: label=\"Wiki\" appears 2 times among its siblings"
translated-link-unmatched-without-url.phyphox:   # a translated link with no URL naming no root link
  parser: rejects
  findings:
    - "<translation locale=\"de\">/<link label=\"Wkii\">: no URL of its own and no link with that label at the root"
value-not-allowed-for-slot.phyphox:   # type="value" where no slot of the module takes a literal
  parser: rejects
  findings:
    - "<average>/<input type=\"value\"> but no slot of this module allows a literal value"
