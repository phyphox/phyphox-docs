# Golden vectors: round. Pins the tie rule (half away from zero),
# the floor/ceil attributes (floor wins when both are set) and the
# pass-through of non-finite values.
module: round
cases:
  - name: ties-away-from-zero
    description: >-
      Default rounding: ties go away from zero on both platforms
      (2.5 -> 3, -2.5 -> -3, -0.5 -> -1), unlike Java Math.round.
    expected_source: reference
    buffers:
      a: {size: 8, init: [2.5, -2.5, 0.5, -0.5, 1.4, -1.6]}
      out: {size: 8}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: [3, -3, 1, -1, 1, -2]
  - name: floor
    description: >-
      floor attribute: Math.floor semantics (floor(-0.5) = -1).
    expected_source: reference
    attributes: {floor: true}
    buffers:
      a: {size: 8, init: [2.5, -0.5, -2.5, 1.9]}
      out: {size: 8}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: [2, -1, -3, 1]
  - name: ceil
    description: >-
      ceil attribute: Math.ceil semantics.
    expected_source: reference
    attributes: {ceil: true}
    buffers:
      a: {size: 8, init: [2.5, -0.5, -2.5, 1.1]}
      out: {size: 8}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: [3, 0, -2, 2]
  - name: specials
    description: >-
      NaN and infinities pass through unchanged - deliberately unlike
      Java Math.round, which would map them to long values.
    expected_source: reference
    buffers:
      a: {size: 4, init: ["nan", "inf", "-inf"]}
      out: {size: 4}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: ["nan", "inf", "-inf"]
