# Golden vectors: const. length defaults to the output
# buffer's size; the cycle-gating case pins the cycles attribute
# (a module skipped by its cycle filter touches nothing).
module: const
cases:
  - name: explicit-length
    description: >-
      Four copies of the value.
    expected_source: reference
    buffers:
      out: {size: 8}
    inputs:
      - {as: value, value: 2.5}
      - {as: length, value: 4}
    outputs:
      - {buffer: out}
    expect:
      out: [2.5, 2.5, 2.5, 2.5]
  - name: default-length-buffer-size
    description: >-
      Without a length input the output buffer's size (5) is used.
    expected_source: reference
    buffers:
      out: {size: 5}
    inputs:
      - {as: value, value: 7}
    outputs:
      - {buffer: out}
    expect:
      out: [7.0, 7.0, 7.0, 7.0, 7.0]
  - name: cycle-gating
    description: >-
      cycles="0" runs the module only in cycle 0; in cycle 1 it is
      skipped entirely, so the output persists uncleared.
    expected_source: reference
    attributes: {cycles: "0"}
    buffers:
      out: {size: 4}
    inputs:
      - {as: value, value: 1}
      - {as: length, value: 3}
    outputs:
      - {buffer: out}
    cycles: 2
    expect_per_cycle:
      - {out: [1.0, 1.0, 1.0]}
      - {out: [1.0, 1.0, 1.0]}
