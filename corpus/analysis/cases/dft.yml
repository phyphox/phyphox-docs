      outim: [0.0, 7.267824888003179, 2.7911568610884125, 0.7988521603655276, -0.7988521603655272, -2.7911568610884188, -7.267824888003183]
  - name: power-of-two-equals-fft
    description: >-
      N=8 cosine at bin 2: identical to fft/real-cosine.
    expected_source: reference
