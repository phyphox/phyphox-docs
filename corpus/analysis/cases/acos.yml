# Golden vectors: acos. deg=true converts the OUTPUT angle
# to degrees.
module: acos
cases:
  - name: radians
    description: >-
      Result in radians.
    expected_source: reference
    buffers:
      a: {size: 8, init: [0.0, 0.5, -0.5, 1.0, -1.0]}
      out: {size: 8}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: [1.5707963267948966, 1.0471975511965979, 2.0943951023931957, 0.0, 3.141592653589793]
  - name: degrees
    description: >-
      deg=true: result in degrees.
    expected_source: reference
    attributes: {deg: true}
    buffers:
      a: {size: 8, init: [0.0, 0.5, -0.5, 1.0, -1.0]}
      out: {size: 8}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: [90.0, 60.00000000000001, 120.00000000000001, 0.0, 180.0]
  - name: domain
    description: >-
      Inputs outside [-1, 1] give NaN.
    expected_source: reference
    buffers:
      a: {size: 4, init: [1.5, -1.5, "nan"]}
      out: {size: 4}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: ["nan", "nan", "nan"]
