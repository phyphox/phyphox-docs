# Golden vectors: periodicity. Windowed normalized
# autocorrelation with parabolic peak refinement, user min/max range
# (the adaptive scan without a range is not pinned here); the period
# is reported in x units per window.
module: periodicity
cases:
  - name: sine-user-range
    description: >-
      Sine of period 8 samples (1.0 x units), dx=16, min=4, max=12:
      each window refines the peak at lag 8.
    expected_source: reference
    buffers:
      x: {size: 32, init: [0.0, 0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1.0, 1.125, 1.25, 1.375, 1.5, 1.625, 1.75, 1.875, 2.0, 2.125, 2.25, 2.375, 2.5, 2.625, 2.75, 2.875, 3.0, 3.125, 3.25, 3.375, 3.5, 3.625, 3.75, 3.875]}
      y: {size: 32, init: [0.0, 0.7071067811865475, 1.0, 0.7071067811865476, 1.2246467991473532e-16, -0.7071067811865475, -1.0, -0.7071067811865477, -2.4492935982947064e-16, 0.7071067811865474, 1.0, 0.7071067811865483, 3.6739403974420594e-16, -0.7071067811865479, -1.0, -0.7071067811865485, -4.898587196589413e-16, 0.7071067811865478, 1.0, 0.7071067811865486, 6.123233995736766e-16, -0.7071067811865477, -1.0, -0.7071067811865487, -7.347880794884119e-16, 0.7071067811865476, 1.0, 0.7071067811865487, 8.572527594031472e-16, -0.7071067811865476, -1.0, -0.7071067811865488]}
      ot: {size: 8}
      op: {size: 8}
    inputs:
      - {as: x, buffer: x}
      - {as: y, buffer: y}
      - {as: dx, value: 16}
      - {as: min, value: 4}
      - {as: max, value: 12}
    outputs:
      - {as: time, buffer: ot}
      - {as: period, buffer: op}
    tolerance: {rel: 1e-06, abs: 1e-09}
    expect:
      ot: [0.0, 2.0]
      op: [1.019923926916906, 1.0199239269169058]
