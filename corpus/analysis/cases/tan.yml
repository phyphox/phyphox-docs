# Golden vectors: tan. deg=true interprets the INPUT as
# degrees; non-finite inputs give NaN.
module: tan
cases:
  - name: radians
    description: >-
      Plain radians input.
    expected_source: reference
    buffers:
      a: {size: 8, init: [0.0, 0.5, 1.0, -1.5, 3.0]}
      out: {size: 8}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: [0.0, 0.5463024898437905, 1.5574077246549023, -14.101419947171719, -0.1425465430742778]
  - name: degrees
    description: >-
      deg=true: input interpreted as degrees. Note
      tan(90 deg) is computed from the double closest to pi/2,
      never the exact value.
    expected_source: reference
    attributes: {deg: true}
    buffers:
      a: {size: 8, init: [0.0, 30.0, 45.0, 90.0, 180.0, -60.0]}
      out: {size: 8}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: [0.0, 0.5773502691896257, 0.9999999999999999, 1.633123935319537e+16, -1.2246467991473532e-16, -1.7320508075688767]
  - name: specials
    description: >-
      NaN and infinities give NaN.
    expected_source: reference
    buffers:
      a: {size: 4, init: ["nan", "inf", "-inf"]}
      out: {size: 4}
    inputs:
      - {buffer: a}
    outputs:
      - {buffer: out}
    expect:
      out: ["nan", "nan", "nan"]
