# Known inconsistencies between the phyphox implementations.
#
# One entry per divergence. Each entry renders in two places from this single
# source: an inline warning wherever the affected page writes the marker
#
#     {{inconsistency:<id>}}
#
# and a row in the generated "Known inconsistencies" page. See tools/hooks.py.
#
# Fields
#   id         short slug, used in the marker. Required.
#   title      one line, shown as the admonition heading. Required.
#   area       file-format | remote-interface | editor. Required.
#   status     open      - nobody has decided which behavior is correct yet
#              decided   - canonical behavior chosen, implementations not yet fixed
#              There is no "fixed" status: once every implementation agrees,
#              delete the entry (and its markers and spec references) in the
#              same commit as the fix. Readers learn about corrected behavior
#              from the release changelog; a lingering "recently corrected"
#              note only clutters the documentation.
#   canonical  what the correct behavior is. Required once status is decided.
#   affects    map of implementation -> observed behavior. Use the keys
#              android, ios, editor, arduino, micropython, wiki.
#   since      optional: format version or app version the divergence appeared in
#   issue      optional: URL of the tracking issue
#   verified   optional: when and against which builds the divergence was
#              actually observed on hardware, as opposed to read out of the
#              source. Absence means nobody has checked on a device.
#   summary    reader-facing explanation, one short paragraph. Required.
#
# Keep entries factual and cite where the behavior was observed, so the next
# person can re-check it rather than trusting this file.

- id: meta-sensors
  title: Sensor metadata in /meta
  area: remote-interface
  status: decided
  canonical: >-
    Android-only, by platform limitation rather than by choice. iOS offers no API
    for per-sensor information such as model or manufacturer, so the values cannot be
    supplied there. The sensors object is therefore simply absent on iOS rather
    than present and empty.
  affects:
    android: >-
      Adds a "sensors" object with one entry per sensor, each carrying name,
      vendor, range, resolution, minDelay, maxDelay, power and version
      (RemoteServer.java, handleMeta()).
    ios: >-
      Serves only the non-sensor metadata; no "sensors" key
      (ExperimentWebServer.swift, "for metadata in Metadata.allNonSensorCases").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    Android reports per-sensor metadata over /meta and iOS does not, even though
    iOS models the same values (Metadata.sensor) and serves them to network
    connections. A client cannot tell a phone without the data from a phone that
    does not report it.

- id: fft-non-power-of-two-input
  title: FFT output for input lengths that are not a power of two
  area: file-format
  status: decided
  canonical: >-
    The fft module guarantees consistent output across platforms only for a
    power-of-two number of input samples, and this is by design and permanent: fft
    is meant to use the fastest available transform on each platform, which
    constrains the supported lengths. For a power-of-two length both platforms
    compute the same unpadded transform and the results are identical (together with
    the unified real-input handling, which returns the full spectrum on both
    platforms). For any other length the output is
    implementation-defined - the platforms diverge in both length and values - and
    an experiment that needs a portable FFT must feed fft a power-of-two number of
    samples. General-purpose, arbitrary-length transforms are not going to be added
    to fft; instead a separate dft analysis module is planned that computes an exact
    input-length DFT consistently on both platforms at the cost of speed. Until dft
    exists, non-power-of-two input to fft is simply outside the guaranteed contract.
  affects:
    android: >-
      Uses FFTW, which transforms an arbitrary length directly (mixed-radix, and
      Bluestein for primes), so the native path computes a true input-length DFT
      with no padding and outputs that many points (analysis.cpp, fftw3complex ->
      fftwf_plan_dft_1d(n, ...)). The pure-Java fallback instead zero-pads to the
      next power of two for the calculation but then truncates the output back to
      the input length (Analysis.java, fftAM). Either way the output length equals
      the input length.
    ios: >-
      Uses Apple's vDSP_DFT, whose setup only accepts lengths of the form f*2^n with
      f in {1, 3, 5, 15}. A non-power-of-two input is therefore zero-padded up to the
      nearest such length (nextFFTSize) and the transform is computed and returned at
      that padded length, so the output is longer than the input and is a
      zero-padded, interpolated spectrum rather than a true input-length DFT
      (FFTAnalysis.swift). For a power-of-two input no padding happens and the result
      matches Android.
  summary: >-
    The two platforms use different FFT libraries with different length constraints:
    FFTW on Android transforms any length directly, while iOS's vDSP_DFT only
    supports lengths of the form f*2^n and so zero-pads other lengths up to the
    nearest supported size. As a result a non-power-of-two number of input samples
    yields a different output length and different values on the two platforms,
    while a power-of-two number of samples is identical on both. This is the intended
    contract for fft: power-of-two input is portable, the module stays as fast as the
    platform allows, and other lengths are left undefined. A separate general-purpose
    dft module (slower, exact input length, consistent across platforms) is planned
    for callers that need non-power-of-two transforms.


# ---------------------------------------------------------------------------
# Entries below stem from the 2026-08-19 audit of all 54 analysis modules
# (spec + prose vs. Analysis.java/PhyphoxFile.java and Modules/*.swift on the
# development branches). Grouped by the decision each entry needs, not one
# entry per symptom.

- id: average-single-value-stddev
  title: "average: standard deviation for a single input value"
  area: file-format
  status: decided
  canonical: >-
    A single input value yields exactly one stddev value, NaN - iOS's
    behavior; Android's fall-through double append is the bug. Additionally
    (general error-state rule), an empty or all-non-finite input writes NaN
    to each connected output instead of nothing, since average delivers
    single values - a change to both platforms.
  decided: 2026-08-19
  affects:
    android: >-
      With exactly one finite input value the stddev output receives two
      values, NaN twice: the count<2 branch appends NaN but does not return,
      and the general path then appends sqrt(0/0)=NaN again (Analysis.java,
      averageAM.update, missing else). With append="true" the buffer grows by
      two per run and the average/stddev outputs lose their pairing.
    ios: >-
      Appends exactly one NaN (AverageAnalysis.swift, count<2 branch with
      else). Fully conforms to the canonical behaviour including the
      empty/all-non-finite NaN rule on the development branch since
      2026-08-19; only Android remains.
  summary: >-
    For a single-value input, Android writes the standard deviation twice per
    run while iOS writes it once, so the two outputs go out of step on
    Android.

- id: binning-dx-zero
  title: "binning: dx of exactly zero"
  area: file-format
  status: decided
  canonical: >-
    Any invalid dx - zero, negative or non-finite - and a NaN x0 yield empty
    outputs. Neither Android's runaway loop and NaN-to-1 sanitization nor
    iOS's silent dx=1 substitution is correct; both change.
  decided: 2026-08-19
  affects:
    android: >-
      Only NaN is sanitized (binningAM.update). With dx=0 the bin index
      becomes (int)Infinity = Integer.MAX_VALUE and the bin-fill loop tries
      to append ~2^31 empty bins - the app hangs or runs out of memory.
    ios: >-
      Substitutes dx=1 silently (BinningAnalysis.swift, "if dx == 0.0").
      Fully conforms to the canonical behaviour on the development branch
      since 2026-08-19; only Android remains.
  summary: >-
    A dx of 0 effectively kills the Android app and is silently replaced by 1
    on iOS.

- id: analysis-nonfinite-parameter-crashes
  title: Non-finite or negative single-value parameters crash iOS
  area: file-format
  status: decided
  canonical: >-
    Analysis modules never crash. The scheme: an absent optional input falls
    back to its documented default; a present but invalid parameter value
    produces the module's error state - NaN when a single value is expected,
    an empty output when a list is expected. Non-finite values that are
    mathematically meaningful, such as an infinite threshold or bound,
    participate in comparisons normally and are not errors. iOS replaces its
    unguarded Int()/UInt() conversions; Android's blanket NaN-to-0 casts
    change where they fabricate plausible parameters (a NaN movingaverage
    width no longer acts as width 0). Settled residual cases (2026-08-19):
    eventstream's index/skip/last inputs are the module's own state loop, not
    user parameters - they keep their documented start defaults (0/0/NaN)
    when empty, and only the iOS conversion traps are fixed; NaN threshold
    values participate in comparisons (see threshold-nan-handling and
    max-min-degenerate-inputs); a NaN const value is a permitted deliberate
    NaN-fill (see const-ramp-length-handling).
  decided: 2026-08-19
  affects:
    android: >-
      Sanitizes throughout: Double.intValue() turns NaN into 0 and clamps
      infinities (movingaverage width, eventstream distance/index/skip,
      split index/overlap), explicit NaN guards default binning's x0/dx,
      and a negative const/ramp length falls back to the output buffer size
      (Analysis.java, the respective modules).
    ios: >-
      Uses unguarded Int(Double) conversions, which trap: a NaN or infinite
      value reaching Int() crashes the app in BinningAnalysis.swift (bin
      index from NaN x0/dx in the buffer), MovingAverageAnalysis.swift
      (width; a negative width also traps in the reversed range),
      SplitAnalysis.swift (index/overlap), EventStreamAnalysis.swift
      (distance/index/skip) and ConstGeneratorAnalysis.swift (length; a
      negative length traps in Array(repeating:count:), also in
      RampGeneratorAnalysis.swift). The guarded getSingleValueAsInt() exists
      in ExperimentAnalysisDataIO.swift but is not used in these places.
      Fully conforms to the canonical behaviour on the development branch
      since 2026-08-19 (binning, movingaverage, split, eventstream and
      const/ramp all guarded); only Android remains.
  summary: >-
    Where a single-value parameter (width, length, index, distance, ...)
    carries NaN, an infinity or - for lengths - a negative value, Android
    degrades gracefully while iOS crashes with an unguarded integer
    conversion or array construction.

- id: complex-module-operand-order
  title: "subtract/divide/power/atan2: operand order with explicit as attributes"
  area: file-format
  status: decided
  canonical: >-
    Operands follow the as attributes, matched case-insensitively, with
    unnamed inputs filling the remaining slots in declaration order -
    Android's behavior. iOS must consume the validated slot mapping instead
    of document order with an exact-match priority key.
  decided: 2026-08-19
  affects:
    android: >-
      ioBlockParser reorders inputs into slot order, matching "as"
      case-insensitively, and unnamed inputs fill the remaining slots
      (PhyphoxFile.java), so minuend/dividend/base/y is always operand one
      regardless of document order or case.
    ios: >-
      IOMappingValidation accepts the same files (case-folded), but the
      runtime keeps document order and only moves an input whose raw as
      string exactly equals the priority key to the front
      (ExperimentComplexUpdateValueAnalysis.updateAllWithMethod,
      "input.asString == priorityInputKey!"). Naming only the second operand
      ("<input as='subtrahend'>S</input><input>M</input>") or writing the
      priority key with different case ("as='Minuend'") silently swaps the
      operands on iOS.
  summary: >-
    Valid attribute combinations that Android resolves via the slot mapping
    compute swapped results on iOS (S-M instead of M-S, exponent^base
    instead of base^exponent). Latent: no shipped or corpus experiment uses
    such a pattern (scanned 2026-08-19), but hand-written files can.

- id: atan2-unequal-lengths
  title: "atan2: inputs of different lengths"
  area: file-format
  status: decided
  canonical: >-
    atan2 follows add/subtract/multiply/divide: the shorter input repeats
    its last value and the output has the length of the longest input.
    Android's min-length truncation is the bug.
  decided: 2026-08-19
  affects:
    android: >-
      Truncates to the shorter input (atan2AM.update, size = min) - unlike
      Android's own add/subtract/multiply/divide/power/gcd/lcm, which pad
      the shorter input by repeating its last value.
    ios: >-
      Pads to the longer input by repeating the last value, like all other
      multi-input modules (ExperimentComplexUpdateValueAnalysis).
  summary: >-
    With y and x of different lengths, Android outputs min(len) values and
    iOS max(len) values. Android's atan2 is also the odd one out within its
    own codebase.

- id: power-native-empty-input
  title: "power: empty input buffer on Android's native path"
  area: file-format
  status: decided
  canonical: >-
    Any empty input yields an empty output, as documented. Android's native
    path must stop substituting default operands.
  decided: 2026-08-19
  affects:
    android: >-
      The shipping native path (analysis.cpp, nativePower) initializes
      base=0, exponent=1 and loops to max(n,m): an empty base yields
      pow(0, e_i) per exponent value, an empty exponent copies the base
      through. Android's own Java fallback (used only if the .so fails to
      load) outputs nothing, like iOS.
    ios: >-
      Any empty input produces an empty output
      (ExperimentComplexUpdateValueAnalysis, emptyVector).
  summary: >-
    The documented rule that any empty input yields an empty output is
    violated by the Android build everyone actually runs - power emits
    values computed with a default operand instead.

- id: gcd-lcm-domain
  title: "gcd/lcm: inputs outside the positive-integer domain"
  area: file-format
  status: decided
  canonical: >-
    The domain is non-negative integers: fractional values are rounded (C
    rounding, half away from zero, matching the formula-round ruling),
    negative and non-finite inputs yield NaN, overflow yields NaN, and
    lcm(0,x) is 0 by the usual convention, including lcm(0,0) - no crash on
    either platform.
  decided: 2026-08-19
  affects:
    android: >-
      Rounds each value to a signed long (Math.round: 2.7 -> 3, NaN -> 0,
      +-inf -> +-Long.MAX_VALUE) and runs Euclid with a "while (b > 0)"
      loop that mishandles negatives - gcd(-4, 6) returns 6 (Analysis.java,
      gcdAM/lcmAM). lcm(0,0) throws an ArithmeticException (division by
      zero); large products overflow silently.
    ios: >-
      Converts via UInt(Double), which truncates (2.7 -> 2) and crashes the
      app for any negative value; non-finite values are caught and yield NaN
      (GCDAnalysis.swift, LCMAnalysis.swift). lcm(0,0) traps (0/0 in UInt);
      large products trap on overflow. Fully conforms to the canonical
      behaviour on the development branch since 2026-08-19; only Android
      remains.
  summary: >-
    Outside non-negative integers the two implementations disagree on
    everything: rounding vs truncation, wrong values vs crash for negatives,
    garbage vs NaN for non-finite input - and lcm(0,0) crashes both, each in
    its own way.

- id: round-nonfinite
  title: "round: non-finite input in default mode"
  area: file-format
  status: decided
  canonical: >-
    Non-finite values pass through unchanged (NaN stays NaN, infinities stay
    infinite) and ties round half away from zero (C rounding), like the
    formula language's round. Android's long-conversion semantics and half-
    up ties both change.
  decided: 2026-08-19
  affects:
    android: >-
      Math.round returns a long: NaN -> 0, +-infinity and |x| > 2^63 ->
      +-Long.MAX_VALUE = +-9.223e18 (Analysis.java, roundAM default path;
      the floor/ceil paths keep NaN/inf).
    ios: >-
      vvnint keeps NaN as NaN and infinities as infinities
      (RoundAnalysis.swift). Fully conforms to the canonical behaviour on
      the development branch since 2026-08-19 (vvnint, which rounds ties to
      even, was replaced); only Android remains.
  summary: >-
    Rounding a NaN yields 0 on Android and NaN on iOS; infinities become
    +-9.2e18 on Android and stay infinite on iOS. The tie-breaking rule at
    .5 also differed - Java rounds half up, and vvnint was measured
    (2026-08-19, iOS runtime) to round ties to even.

- id: crosscorrelation-normalization
  title: "crosscorrelation: normalization and empty inputs"
  area: file-format
  status: decided
  canonical: >-
    No normalization: raw correlation sums, matching the default of
    numpy.correlate, scipy.signal.correlate and MATLAB xcorr (researched
    2026-08-19). Both current normalizations disappear, which also removes
    the Android-internal native/fallback disagreement. An empty input yields
    an empty output on both. The Android native FFT path must additionally
    be verified against the plain-sum reference on real hardware before this
    entry is closed.
  decided: 2026-08-19
  affects:
    android: >-
      The shipping native path normalizes by 1/(2*(m+n)) in single
      precision: the Java side passes size = 2*(sizeA+sizeB) and appends the
      inverse-FFT result unscaled beyond the 1/n^2 spectral division
      (Analysis.java crosscorrelationAM native branch, analysis.cpp
      fftw3crosscorrelation). The Java fallback divides each sum by
      abs(m-n) in double precision, like iOS. Empty inputs output nothing
      on either Android path.
    ios: >-
      Divides by abs(m-n) in double precision
      (CrosscorrelationAnalysis.swift, vDSP_vsdivD by compRange). With one
      empty input it appends that many zeros instead of nothing (vDSP_convD
      with a zero-length filter).
  summary: >-
    The output scale differs between the Android build users run and iOS
    (factor 2(m+n)/abs(m-n)), Android's two code paths disagree with each
    other, and an empty input yields nothing on Android but zeros on iOS.
    The docs specify no normalization at all.

- id: fft-imaginary-input-length
  title: "fft: imaginary input shorter than the real input"
  area: file-format
  status: decided
  canonical: >-
    A provided im input truncates the transform to the shorter of re and im,
    matching similar multi-input functions; only an absent im input is zero-
    filled to re's length. Android's zero-padding of a shorter im changes.
  decided: 2026-08-19
  affects:
    android: >-
      Takes the length from the real input and zero-pads the imaginary part
      (fftAM, both native and fallback paths).
    ios: >-
      Truncates to the shorter of the two inputs (FFTAnalysis.swift,
      bufferCount = min) - different output length and values.
  summary: >-
    With im shorter than re, Android pads and iOS truncates. Not covered by
    the fft-non-power-of-two-input entry, which is about the length of a
    single input.

- id: value-type-inputs-rejected-by-ios
  title: "interpolate/loess xi and map x/y/z: type=value inputs rejected by iOS"
  area: file-format
  status: decided
  canonical: >-
    Value-type inputs are allowed wherever the slot tables declare them; iOS
    treats them as one-element buffers like Android does.
  decided: 2026-08-19
  affects:
    android: >-
      Runs normally - a value input acts as a one-element buffer
      (DataInput.getArray()).
    ios: >-
      The slot tables declare valueAllowed like Android's, so validation
      passes, but the modules fetch these slots with io.data(), which is nil
      for a value input, and throw at load time ("No input for xi provided",
      InterpolateAnalysis.swift/LoessAnalysis.swift init) or at update
      ("Input x for map module has to be a buffer", MapAnalysis.swift).
  summary: >-
    Files using a literal value for interpolate's or loess's xi, or for
    map's x/y/z, work on Android and are refused (or fail) on iOS, although
    the spec and both parsers' slot tables allow the value type there.

- id: loess-parameter-edges
  title: "loess: non-positive d and multi-value d buffers"
  area: file-format
  status: decided
  canonical: >-
    A non-positive or non-finite d yields empty outputs on both platforms,
    and a multi-value d buffer is read at its last element - the convention
    for single-value inputs everywhere else.
  decided: 2026-08-19
  affects:
    android: >-
      d <= 0 or NaN returns without output (loessAM guard); d is read from
      the first element of its buffer.
    ios: >-
      No guard: d <= 0 makes every window empty and the module appends NaN
      for every xi (det = 0); d is read from the last element
      (LoessAnalysis.swift, getSingleValue).
  summary: >-
    A degenerate window width yields empty outputs on Android and NaN-filled
    outputs on iOS, and the two read opposite ends of a multi-value d
    buffer.

- id: periodicity-parameter-edges
  title: "periodicity: non-positive dx and fractional min/max"
  area: file-format
  status: decided
  canonical: >-
    Invalid parameters yield empty outputs on both platforms; fractional
    min/max are floored/ceiled as on Android (conservative, including the
    boundary).
  decided: 2026-08-19
  affects:
    android: >-
      dx <= 0 - including NaN or an empty buffer, which cast to 0 - produces
      no output (periodicityAM guard); min is floored and max is ceiled to
      integers.
    ios: >-
      The same dx values silently become dx = 1 and the analysis runs
      (PeriodicityAnalysis.swift); min and max are truncated toward zero
      instead of floor/ceil.
  summary: >-
    A missing or invalid step width disables the module on Android but runs
    it at full rate on iOS, and fractional search bounds cover a different
    period range on each platform.

- id: max-min-degenerate-inputs
  title: "max/min: empty y input and x shorter than y"
  area: file-format
  status: decided
  canonical: >-
    An empty or all-invalid y input yields NaN on each connected output with
    multiple=false and empty outputs with multiple=true. An x buffer shorter
    than y truncates processing to the common length; only an omitted x
    input keeps auto-generating indices. In multiple mode a NaN threshold
    value participates like any number - no comparison is ever true, so the
    whole input forms one set - while an absent threshold input or an empty
    threshold buffer selects the documented default of 0 (ruled 2026-08-19;
    Android currently lets an empty buffer's NaN participate instead).
  decided: 2026-08-19
  affects:
    android: >-
      Empty (or all-NaN) y emits nothing (the -infinity position guard);
      an x buffer shorter than y keeps counting x up from the last x value
      (maxAM/minAM).
    ios: >-
      Empty y appends a value anyway (vDSP_maxvD/minvD on zero elements:
      -inf for max, the 0.0/-inf initializers for min, and with a position
      output x = xIn.data[0] traps on an empty x buffer). An x buffer
      shorter than y traps with index-out-of-range in both the single and
      multiple branches (MaxAnalysis.swift:99/126 pattern, the ?? only
      covers a missing x input). The single-value branches followed vDSP,
      which was measured (2026-08-19, iOS runtime) to propagate NaN. Fully
      conforms to the canonical behaviour on the development branch since
      2026-08-19 (comparison loops like Android, truncation, NaN/empty error
      states); only Android remains.
  summary: >-
    Degenerate max/min inputs emit nothing on Android but bogus values or a
    crash on iOS.

- id: map-edge-cases
  title: "map: non-finite points, missing z, degenerate ranges"
  area: file-format
  status: decided
  canonical: >-
    Points with a non-finite x, y or z are skipped; degenerate ranges (such
    as minX equal to maxX) are clamped instead of crashing; and a missing z
    input with zMode sum or average rejects the file at load, since that is
    a permanent configuration error, not an intermediate state.
  decided: 2026-08-19
  affects:
    android: >-
      Non-finite x/y round to bin 0 and a NaN z poisons that bin (mapAM, no
      finite check); a missing z input in sum/average mode returns without
      output; degenerate ranges (minX == maxX) yield clamped bin indices
      rather than a crash.
    ios: >-
      Non-finite points are skipped (MapAnalysis.swift isFinite check); a
      missing z in sum/average mode runs with z = 0 and produces a zero
      grid; a degenerate range makes the bin index NaN/inf and
      Int(round(...)) traps - crash.
  summary: >-
    Three map edge cases diverge: NaN points (binned vs skipped), missing z
    outside count mode (no output vs zero grid), and equal min/max ranges
    (garbage bins vs crash).

- id: rangefilter-row-alignment
  title: "rangefilter: row alignment and non-finite values on iOS"
  area: file-format
  status: decided
  canonical: >-
    Android's behavior is canonical throughout: strictly row-wise filtering
    that keeps outputs aligned, non-finite values compared like any number,
    extra outputs ignored, and a min/max before the first in bound to the
    first group.
  decided: 2026-08-19
  affects:
    android: >-
      Filters strictly row-wise, so outputs stay aligned; +-infinity is
      compared like any number and filtered; extra outputs beyond the input
      count are ignored (rangefilterAM).
    ios: >-
      Removes already-appended elements using the global deletion count
      instead of the count of deletions below the current index
      (RangefilterAnalysis.swift, "i-deleteCount"), so when a later input
      filters a lower row than an earlier input already filtered, the wrong
      element is removed and rows misalign. Non-finite values are exempt
      from filtering (isFinite check), so +-inf always passes. More outputs
      than inputs trap. A min/max given before the first in input is
      discarded (Android binds it to the first group).
  summary: >-
    The documented row-wise filtering guarantee can break on iOS with
    multiple filtered inputs, and infinities pass iOS filters that would
    remove them on Android.

- id: reduce-edge-cases
  title: "reduce: y shorter than x, and the x output requirement"
  area: file-format
  status: decided
  canonical: >-
    Processing truncates to the shortest present buffer; a missing y output
    is skipped; a file without the x output is rejected at load on both
    platforms, as the spec now models (x output min 1).
  decided: 2026-08-19
  affects:
    android: >-
      A y buffer shorter than x substitutes 0 for the missing values
      (reduceAM); a file without an x output loads and then crashes in
      update() (outputs.get(0) on a null-padded list).
    ios: >-
      A y buffer shorter than x traps with index-out-of-range in the
      factor>1 branch (ReduceAnalysis.swift, y![index] unbounded; the
      factor<1 branch does bounds-check); a file without an x output is
      rejected at load with a clear error.
  summary: >-
    Short y inputs give zeros on Android and crash iOS; a missing x output
    is a load error on iOS but a runtime crash on Android. The spec now
    models x as required, matching what both implementations need.

- id: sort-unequal-lengths
  title: "sort: co-buffers of different lengths and NaN ordering"
  area: file-format
  status: decided
  canonical: >-
    All buffers are truncated to the shortest input before sorting -
    Android's behavior - and NaN ordering is deterministic on both
    platforms, sorting NaN as the largest value like Android's
    Double.compareTo.
  decided: 2026-08-19
  affects:
    android: >-
      Truncates all buffers to the shortest input and sorts that prefix of
      the first buffer; NaN sorts deterministically as the largest value
      (Double.compareTo) (sortAM).
    ios: >-
      Sorts the entire first buffer and emits its full length per output,
      substituting NaN where a co-buffer is shorter
      (SortAnalysis.swift); the </> sort closures violate strict weak
      ordering when NaN is present, so NaN placement is unspecified.
  summary: >-
    With unequal input lengths the two platforms return different lengths
    and different data (the prose documents Android's shortest-buffer rule),
    and NaN ordering is deterministic only on Android.

- id: split-negative-index
  title: "split: negative index"
  area: file-format
  status: decided
  canonical: >-
    Negative and out-of-range positive indices are clamped into range on
    both platforms; no exceptions. Android's negative-index crash changes.
  decided: 2026-08-19
  affects:
    android: >-
      Arrays.copyOfRange(data, 0, negative) throws - crash (splitAM).
    ios: >-
      Clamps gracefully: out1 empty, out2 receives everything
      (SplitAnalysis.swift, limit > 0 and max(...,0) guards).
  summary: >-
    A negative split index crashes Android and degrades gracefully on iOS -
    the reverse of the usual pattern. (NaN/infinite index values crashed iOS
    instead - see analysis-nonfinite-parameter-crashes - fixed on the iOS
    development branch since 2026-08-19.)

- id: subrange-nonfinite-parameters
  title: "subrange: NaN or infinite from/to/length"
  area: file-format
  status: decided
  canonical: >-
    Non-finite from/to/length values yield empty outputs on both platforms.
  decided: 2026-08-19
  affects:
    android: >-
      (int) casts turn NaN into 0 - a NaN "to" yields empty outputs
      (subrangeAM).
    ios: >-
      getSingleValueAsInt() returns nil for non-finite values, which falls
      back to the default - a NaN "to" yields the full range
      (SubrangeAnalysis.swift). Fully conforms to the canonical behaviour on
      the development branch since 2026-08-19; only Android remains.
  summary: >-
    Non-finite range parameters produce empty output on Android and the
    full input on iOS. All finite behavior was verified identical.

- id: threshold-nan-handling
  title: "threshold: NaN values around the crossing"
  area: file-format
  status: decided
  canonical: >-
    NaN values are skipped by the triggering logic and the trigger fires on
    the next value on the other side - iOS's sticky-side formulation. A NaN
    threshold value participates like any number: no comparison with it is
    ever true, so no crossing is found and NaN is output - the NaN-to-0
    sanitization is dropped (ruled 2026-08-19). An absent threshold input or
    an empty threshold buffer selects the documented default of 0.
    Additionally (general error-state rule), when no crossing is found the
    module outputs NaN instead of the last sample's x or -1, on both
    platforms; the shipped experiments consuming threshold output
    (audio_scope, frequency_history, pendulum, sonar, spring) must be re-
    checked with this change.
  decided: 2026-08-19
  affects:
    android: >-
      Requires an adjacent valid pair on opposite sides: a NaN suppresses
      the comparison with the next value (thresholdAM, isNaN(last) ||
      isNaN(v) guard).
    ios: >-
      Uses a sticky flag: any value not on the trigger side - including NaN
      - arms the trigger, and the next value on the trigger side fires
      (ThresholdAnalysis.swift, onOppositeSide). Fully conforms to the
      canonical behaviour (NaN-to-0 sanitization dropped, NaN output when no
      crossing is found) on the development branch since 2026-08-19; only
      Android remains.
  summary: >-
    With NaN in the data ([2, NaN, 5], rising, threshold 3) iOS reports a
    crossing where Android reports none. Without NaN the two formulations
    coincide (verified, including that equality never triggers on either).

- id: const-ramp-length-handling
  title: "const/ramp: length 0 and empty parameter buffers"
  area: file-format
  status: decided
  canonical: >-
    An explicit length of 0, an empty length buffer and a non-finite length
    value all yield an empty output; only an absent length input falls back
    to the output buffer's size. Empty value/start/stop buffers yield empty
    outputs as well (neither NaN- nor zero-filled), and a non-finite ramp
    start or stop is an error yielding an empty output. A present NaN value
    for const is allowed and fills the output with NaN, as a deliberate NaN
    initialization (ruled 2026-08-19); an empty value buffer remains an
    error with empty output.
  decided: 2026-08-19
  affects:
    android: >-
      Uses -1 as the "unset" sentinel: an explicit length of 0 writes
      nothing, and an empty length buffer casts NaN to 0 - also nothing. An
      empty value/start/stop buffer reads as NaN and fills NaN values
      (constGeneratorAM/rampGeneratorAM).
    ios: >-
      Uses 0 as the "unset" sentinel: an explicit length of 0 - and an empty
      or NaN length buffer - fills the whole output buffer. Empty
      value/start/stop buffers fall back to the defaults of 0
      (ConstGeneratorAnalysis.swift/RampGeneratorAnalysis.swift). Fully
      conforms to the canonical behaviour on the development branch since
      2026-08-19 (including a single-point ramp emitting its start value);
      only Android remains.
  summary: >-
    A length of 0 writes nothing on Android and fills the entire buffer on
    iOS, and empty parameter buffers generate NaN data on Android but zeros
    on iOS. (Negative lengths additionally crash iOS; see
    analysis-nonfinite-parameter-crashes.)

- id: formula-parse-divergences
  title: "formula: missing attribute, positive exponents, malformed expressions"
  area: file-format
  status: decided
  canonical: >-
    A missing formula attribute rejects the file (as on Android); scientific
    notation with an explicit positive exponent such as 1e+5 is accepted (as
    on iOS); and structurally broken formulas - wrong arity, dangling
    operands - reject the file at load on both platforms, since that is a
    permanent failure state.
  decided: 2026-08-19
  affects:
    android: >-
      A missing formula attribute rejects the file ("Formula module needs a
      formula", PhyphoxFile.java); scientific notation with an explicit
      positive exponent (1e+5) rejects the file (FormulaParser.java treats
      the + as an operator); a structurally broken term (min(5), 5+) loads
      and produces an empty output at runtime (swallowed
      NullPointerException).
    ios: >-
      A missing attribute is accepted and the module silently outputs
      nothing (FormulaAnalysis.swift, ?? ""); 1e+5 parses as 100000
      (FormulaParser.swift checks the preceding character); a broken term
      loads and produces NaN per element (missing operands evaluate to NaN).
  summary: >-
    The two formula parsers disagree on what loads and on what a broken
    expression produces. The function list, precedence, left-associativity
    (including ^), the loose-binding unary minus and the [n]/[n_]
    semantics were verified identical.

- id: formula-round-semantics
  title: "formula: round() tie-breaking and NaN"
  area: file-format
  status: decided
  canonical: >-
    C rounding on both platforms: half away from zero, NaN stays NaN.
    Android's Math.round semantics change.
  decided: 2026-08-19
  affects:
    android: >-
      Java Math.round - half toward positive infinity (round(-2.5) = -2)
      and round(NaN) = 0 (FormulaParser.java).
    ios: >-
      C round - half away from zero (round(-2.5) = -3) and round(NaN) = NaN
      (FormulaParser.swift).
  summary: >-
    The formula language's round() differs at .5 ties for negative values
    and for NaN. (This is the formula function; the round analysis module's
    own divergence is round-nonfinite.)

- id: append-nan-value-input
  title: "append: NaN as a type=value input"
  area: file-format
  status: decided
  canonical: >-
    A literal NaN value input is appended like any other value; Android's
    skip changes.
  decided: 2026-08-19
  affects:
    android: >-
      Skips NaN value inputs (appendAM, isNaN check).
    ios: >-
      Appends the NaN (AppendAnalysis.swift, unconditional).
  summary: >-
    A literal NaN value input is dropped by Android and written by iOS.
    Buffer contents including NaN pass through identically on both.

- id: input-type-empty-case
  title: "input type attribute: case sensitivity of \"empty\""
  area: file-format
  status: decided
  canonical: >-
    Enumerated attribute values are matched case-insensitively, as the
    enum-case-insensitive rule (decided 2026-08-12) already settles.
    type="Empty" must be accepted; Android's exact-match comparison for this
    one value is the bug.
  affects:
    android: >-
      Matches "value" and "buffer" case-insensitively but "empty"
      case-sensitively - type="Empty" is "Unknown input type" and the file
      is rejected (PhyphoxFile.java, ioBlockParser).
    ios: >-
      All three values fold case (DataInputTypeAttribute,
      CaseInsensitiveAttributeDecodable).
  summary: >-
    type="Empty" loads on iOS and rejects the file on Android, contradicting
    the already-decided enum-case-insensitive rule.

- id: analysis-clear-edit-buffers
  title: Buffers bound to edit fields are exempt from clearing on iOS only
  area: file-format
  status: decided
  canonical: >-
    Buffers bound to interactive view elements can be cleared; the element
    then re-initializes both the buffer and the displayed value to its
    default, as Android's edit element does (ExpView.java setValue's NaN
    branch). iOS drops the attachedToTextField guard and gains the same re-
    init mechanism - for every interactive element (edit, toggle, dropdown,
    slider), not only the edit field, since Android's toggle/dropdown/slider
    already re-init and iOS's are currently unprotected against clears
    anyway.
  decided: 2026-08-19
  affects:
    android: >-
      No exemption: an analysis input with the default keep=false clears an
      edit element's buffer after the first read, and the edit element only
      rewrites it on user interaction - the setting is lost for subsequent
      cycles (Analysis.java updateIfNotStatic, ExpView.editElement
      onMayWriteToBuffers/triggered).
    ios: >-
      A buffer with attachedToTextField set (every edit element's buffer)
      is never cleared - not by an analysis input with keep=false, not as a
      non-append analysis output, and not by the experiment-level clear
      (ExperimentAnalysisDataIO.clear, Experiment.swift clearData).
  summary: >-
    An experiment author who forgets keep="true" on an edit-field buffer
    gets away with it on iOS and loses the user's setting on Android. All
    shipped experiments set keep="true" on such inputs, so the divergence is
    latent there.

- id: audio-direct-input-type
  title: "audio output: type attribute on the direct input"
  area: file-format
  status: decided
  canonical: >-
    The direct input of the audio output takes no type attribute - its text
    is always the name of the data container holding the waveform, since a
    literal value never makes sense as a waveform (ruled 2026-08-19). The
    type attribute exists only on the parameter inputs inside tone and
    noise. Android stops reading type on the direct input; a file using
    type="value" there then fails naturally because the text is not a
    defined buffer, as it always has on iOS. No shipped or corpus experiment
    uses the attribute on a direct input (scanned 2026-08-19).
  decided: 2026-08-19
  affects:
    android: >-
      AudioOutputPluginBlockParser parses direct and parameter inputs with
      the same code, so type="value" on the direct input is honored and
      builds a constant-value "waveform" (PhyphoxFile.java, level == 1
      branch).
    ios: >-
      The direct input goes through a plain TextElementHandler that reads no
      attributes; type is silently ignored and the text is treated as a
      buffer name, so type="value" fails with an undefined-buffer error
      (OutputElementHandler.swift, AudioElementHandler).
  summary: >-
    A type="value" direct source is accepted (and meaningless) on Android
    and rejected on iOS; the attribute is removed from the format for the
    direct input.
