# Known inconsistencies between the phyphox implementations.
#
# One entry per divergence. Each entry renders in two places from this single
# source: an inline warning wherever the affected page writes the marker
#
#     {{inconsistency:<id>}}
#
# and a row in the generated "Known inconsistencies" page. See tools/hooks.py.
#
# Fields
#   id         short slug, used in the marker. Required.
#   title      one line, shown as the admonition heading. Required.
#   area       file-format | remote-interface | editor. Required.
#   status     open      - nobody has decided which behaviour is correct yet
#              decided   - canonical behaviour chosen, implementations not yet fixed
#              fixed     - all implementations agree; keep the entry until the
#                          release carrying the fix is out, then delete it
#   canonical  what the correct behaviour is. Required once status is decided.
#   affects    map of implementation -> observed behaviour. Use the keys
#              android, ios, editor, arduino, micropython, wiki.
#   since      optional: format version or app version the divergence appeared in
#   issue      optional: URL of the tracking issue
#   verified   optional: when and against which builds the divergence was
#              actually observed on hardware, as opposed to read out of the
#              source. Absence means nobody has checked on a device.
#   summary    reader-facing explanation, one short paragraph. Required.
#
# Keep entries factual and cite where the behaviour was observed, so the next
# person can re-check it rather than trusting this file.

- id: control-post
  title: POST on every endpoint, with a JSON or form-encoded body
  area: remote-interface
  status: decided
  canonical: >-
    Every endpoint accepts POST as well as GET, taking the same parameters either
    way. There is no reason to restrict them, and a client that finds GET awkward -
    a long list of buffer names in a /get query, for instance - should not have to
    work around it. This is the first real definition of POST for this API (the
    handful of POSTs Android accepted before were accidental and undocumented), so
    the body format is defined here and both platforms implement it from the start:
    a POST body is read as either application/json (a flat object, the natural form
    for a script) or application/x-www-form-urlencoded, chosen by the request's
    Content-Type. Two rules keep it unambiguous, and both platforms must follow
    them: (1) every value is a string - the API is string-valued throughout, so a
    JSON scalar is coerced to its string form before use, making {"value": 42} and
    {"value": "42"} equivalent; a JSON body that is not valid JSON (including a bare
    Infinity/NaN or an unrepresentable number) is a malformed body answered with
    400. (2) Body parameters take precedence over query parameters of the same name.
    Endpoints that take no parameters ignore the body.
  affects:
    android: >-
      On the development branch (2026-08) registers every endpoint for both GET and
      POST, and reads parameters through a helper that merges the query with the
      POST body: a JSON body is parsed and its scalars coerced to strings, a
      form-encoded body is parsed by jlhttp, the body wins over the query, and a
      malformed JSON body is a 400 (RemoteServer.java, requestParams()/
      requestParamsList(), hasJsonBody()). The released app accepts POST on /control
      only and only as form/query, with no JSON support.
    ios: >-
      Registers /control for GET only, and has no POST body handling at all
      (ExperimentWebServer.swift, addHandler(forMethod: "GET", pathRegex: "/control")).
      Needs POST on every endpoint accepting both a JSON and a form-encoded body,
      with the string-coercion and body-precedence rules above.
  verified: >-
    Android side verified on hardware 2026-08-08 (development build, Pixel 9 Pro),
    on accelerometer.phyphox and motion_stopwatch.phyphox: cmd=set via JSON number,
    JSON string and form all store the same value into a persistent buffer; body
    wins over a conflicting query cmd in both directions (start over stop and stop
    over start); a threshold+reference /get returns identical partial data via GET
    query and JSON body; a malformed JSON body and a bare Infinity/NaN both answer
    400; GET is unaffected. iOS not yet implemented.
  summary: >-
    Historically Android accepted POST on /control (by accident) and iOS accepted
    GET only. POST is now defined properly for the whole API, with a JSON or
    form-encoded body: Android implements it on the development branch, iOS still
    has to. The bundled web interface issues GET exclusively, so this does not
    affect normal use - but it is what lets a script drive the API in the REST style
    it expects.

- id: cors-header
  title: Access-Control-Allow-Origin on every response
  area: remote-interface
  status: fixed
  canonical: >-
    Every response from every endpoint carries Access-Control-Allow-Origin, on both
    platforms. Android already does so for responses that reach respond(); iOS sends
    none at all and must add it. Together with cors-error-paths this means the header
    is present without exception, including on error responses - which is where a
    browser client most needs to read the body.
  affects:
    android: >-
      Adds "Access-Control-Allow-Origin: *" to every response; since the
      cors-error-paths fix on the development branch (2026-08) it is set before a
      request is dispatched rather than in respond()
      (RemoteServer.java, CorsHTTPServer.handleTransaction).
    ios: >-
      Fixed on the development branch 2026-08: every handler's completion is
      wrapped to add "Access-Control-Allow-Origin: *", and the static file
      handler was replaced so the web interface files carry it too
      (ExperimentWebServer.swift, cors()). Covered by an integration test
      (WebServerCORSTests) that checks success, error and 404 responses.
      The released app still sends no CORS header at all.
  verified: >-
    Divergence confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build
    1020102, Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS fix is verified by an automated
    test against the running server, not yet by a cross-platform hardware
    comparison.
  summary: >-
    A web page served from anywhere else could read the API of an Android phone
    but not of an iPhone, because only Android sent a CORS header. The iOS
    development branch now sends it on every response, including errors, so the
    platforms agree once that ships. The entry stays until the release carrying
    the fix is out, because the released iOS app still fails browser-based
    clients with an opaque CORS error.

- id: get-no-parameters
  title: /get without any parameters
  area: remote-interface
  status: decided
  canonical: >-
    Allowed and successful. /get with no parameters returns 200 with an empty buffer
    object and a normal status object, which is what Android does. Polling for status
    alone - to notice a session change, for instance - is a reasonable thing for a
    client to do, and there is nothing malformed about the request.
  affects:
    android: >-
      Returns 200 with an empty buffer object and a normal status object
      (RemoteServer.java, getBufferRequests() returns an empty set).
    ios: >-
      Returns 400 with an empty body
      (ExperimentWebServer.swift, "guard let queryString = request.url.query").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    Requesting /get with no buffers - the natural way to poll only the experiment
    status, for instance to watch for a session change - works on Android and
    fails on iOS.

- id: get-nonfinite-single-value
  title: NaN and infinity in a single-value response
  area: remote-interface
  status: decided
  canonical: >-
    null, in every update mode. Android already behaves this way; iOS must stop
    emitting the string "nan" in single-value mode. See the note on non-finite values
    in the API description: JSON has no representation for NaN or infinity, so null
    is what the format offers.
  affects:
    android: >-
      Emits JSON null for a non-finite value in every update mode
      (RemoteServer.java, buildBuffer()).
    ios: >-
      Emits JSON null in full and partial mode, but a JSON *string* ("nan",
      "inf", "-inf") for a non-finite last value in single mode
      (ExperimentWebServer.swift, "dict[\"buffer\"] = [String(v)]").
  summary: >-
    A buffer whose last value is NaN or infinite comes back as [null] from Android
    and as ["nan"] from iOS. A client that parses the array as numbers throws on
    iOS. Both platforms agree on null everywhere else, which is what makes this
    easy to miss - it only shows up in single-value mode, and only once a
    non-finite value occurs.

- id: get-force-full-update
  title: Which requests are upgraded to a full update after a clear
  area: remote-interface
  status: decided
  canonical: >-
    Upgrade every requested buffer, which is the safe option and what Android does.
    After a clear the client's data is stale whatever it asked for, so telling it
    only about buffers whose request used one particular value cannot be right - and
    the value iOS keys on, the literal string "partial", is undocumented and happens
    to be what the bundled interface sends. A threshold-based client, the form the
    documentation teaches, is currently never told about the clear on iOS.
  affects:
    android: >-
      After data is cleared, the next /get upgrades *every* requested buffer to a
      full update, whatever the request asked for
      (RemoteServer.java, parseBufferRequest(), "value.equals(\"full\") || forceFullUpdate").
    ios: >-
      Upgrades only those buffers whose requested value is the literal string
      "partial"
      (ExperimentWebServer.swift, "value == \"full\" || (value == \"partial\" && self.forceFullUpdate)").
  summary: >-
    After the experiment data is cleared the server has to tell clients to discard
    what they hold, which it does by answering the next request with a full
    update. The two apps disagree on which requests get that treatment, and the
    iOS condition only triggers for the undocumented literal value "partial",
    which the bundled interface happens to send. A threshold-based client - the
    form this API documents - is never told about the clear on iOS and keeps
    stale data.

- id: get-invalid-threshold
  title: /get with a threshold that is not a number
  area: remote-interface
  status: decided
  canonical: >-
    Reject the request with 400 (maintainer decision 2026-08-09). A threshold that
    does not parse as a number is a malformed request, consistent with how a
    threshold referencing an unknown buffer is treated; answering data instead
    hides the client's mistake. iOS must stop silently treating an unparseable
    threshold as "no threshold".
  affects:
    android: >-
      Answers 400 with an empty body on the development branch since 2026-08;
      before, the number parse threw and the request failed with a server error
      (RemoteServer.java, handleGet()).
    ios: >-
      Parses the threshold with "Double(...) ?? -infinity", so an unparseable
      value silently requests everything: the whole buffer is returned, labelled
      updateMode "partial" (ExperimentWebServer.swift).
  verified: >-
    Android verified on hardware 2026-08-09 (development build, Pixel 9 Pro):
    "?accX=notanumber" answers 400. iOS not yet changed.
  summary: >-
    A request like /get?buf=abc is rejected with 400 on Android (previously a
    server error) and silently answered with the full buffer on iOS. The 400 is
    canonical; the spec documents it, and iOS has to follow.

- id: get-negative-threshold
  title: /get with a negative threshold degrades instead of filtering
  area: remote-interface
  status: decided
  canonical: >-
    A negative threshold filters like any other (maintainer decision 2026-08-09):
    the 8-digit precision nudge that both implementations apply must derive its
    magnitude from the absolute value of the threshold, keeping its positive
    direction. Both platforms computed log10 of the raw threshold, which is NaN
    for a negative value, so the nudged threshold became NaN and the comparison
    broke - differently on each platform.
  affects:
    android: >-
      Fixed on the development branch 2026-08: the nudge uses
      log10(abs(threshold)/1e7), so a negative threshold returns a partial update
      filtered correctly (RemoteServer.java, parseBufferRequest()). Before, the
      NaN threshold made the request degrade to a single-value response.
    ios: >-
      Still computes pow(10, floor(log10(threshold/1e7))) on the raw value, so a
      negative threshold becomes NaN and the filter "v > NaN" drops everything:
      the response is a "partial" update with an empty buffer
      (ExperimentWebServer.swift). Needs the same abs() fix.
  verified: >-
    Android fix verified on hardware 2026-08-09 (development build, Pixel 9 Pro):
    "?accX=-100" answers a partial update with the full history, "?accX=-0.5"
    filters correctly (only values above -0.5), a positive threshold is
    unaffected. iOS not yet changed.
  summary: >-
    Thresholds are usually positive (a time axis), which is why nobody noticed
    that a negative one breaks: Android answered a single value, iOS an empty
    partial update - both silently, in two different ways. The nudge formula just
    needed an abs(). Android is fixed; iOS needs the same one-liner.

- id: get-unknown-reference-buffer
  title: Threshold referencing a buffer that does not exist
  area: remote-interface
  status: fixed
  canonical: >-
    Reject a bad request cleanly; never let one reach an unhandled exception. A
    malformed or out-of-range request must produce a documented status and body -
    {"result": false} where the endpoint answers that way, an error object where it
    answers that way - and must never fail the request with a server error, terminate
    the app, or report success for something it did not do. Neither platform is
    uniformly right today: Android throws where it should answer, and iOS answers
    true for a trigger it did not perform. This is the same principle as
    enum-invalid-value in the file format, applied to the API.
  affects:
    android: >-
      Fixed on the development branch 2026-08: a threshold referencing a buffer that
      does not exist is rejected with 400 before building the response, matching iOS
      (RemoteServer.java, handleGet()). The released app still throws. (An
      unparseable threshold is likewise a 400, tracked separately as
      get-invalid-threshold since iOS diverges there.)
    ios: >-
      Returns 400
      (ExperimentWebServer.swift, "guard let extraBuffer = self.experiment.buffers[extra]").
  verified: >-
    Divergence confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build
    1020102, Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). Android fix verified on hardware 2026-08-08
    (development build, Pixel 9 Pro): "?intensity=0|nosuchbuffer" and
    "?intensity=notanumber" both answer 400.
  summary: >-
    Asking for "?abc=42|nosuchbuffer" is rejected cleanly on iOS and used to crash
    the request handler on Android; Android now returns 400 as well. Note that an
    unknown buffer in the *requested* position is ignored by both, so only the
    reference position behaves this way. The entry stays until the release carrying
    the fix is out.

- id: control-clear-groups
  title: Clear groups on /control?cmd=clear
  area: remote-interface
  status: fixed
  canonical: >-
    Clear groups are a file format 1.20 feature and belong on both platforms.
    iOS should implement them when it moves to 1.20 - the clearGroup attribute on
    data containers first, then the clearGroups list the web interface needs and
    the clearGroup<n> parameters on /control. Tracked here as well as under
    ios-behind-on-format-1-20 because the remote-interface half is what a client
    author sees.
  affects:
    android: >-
      Implements the feature. Data containers carry a clearGroup attribute
      (PhyphoxFile.java, dataContainersBlockParser) and the remote interface
      reads clearGroup1, clearGroup2, ... to clear only those groups
      (RemoteServer.java, handleControl(), case "clear").
    ios: >-
      Implements the feature on the development branch since 2026-08: the
      clearGroup attribute is parsed into the buffers
      (DataContainersElementHandler, DataBuffer.clearGroup), a user clear spares
      grouped buffers unless selected (Experiment.clear), the clear dialog
      offers the groups, and the remote interface serves the clearGroups list
      and honours the clearGroup<n> parameters on /control
      (WebServerUtilities.swift, ExperimentWebServer.swift).
  summary: >-
    Clear groups let an experiment keep calibration data or settings when the user
    clears measurement data. iOS did not implement them at all - neither the
    clearGroup attribute on data containers nor the clearGroup parameters of
    /control, which it ignored while always clearing everything, destroying
    exactly the data the feature exists to protect. Since 2026-08 the iOS
    development branch implements both halves like Android; the entry stays until
    the release carrying the fix ships.

- id: control-set-infinity
  title: Writing an infinite value with cmd=set
  area: remote-interface
  status: fixed
  canonical: >-
    Reject it. cmd=set accepts only finite values, as iOS already does; Android must
    stop admitting Infinity through Double.valueOf. Note that accepting it produces a
    value the API cannot report back: /get encodes every non-finite value as null,
    so an infinity written into a buffer returns as null and is indistinguishable
    from NaN.
  affects:
    android: >-
      Fixed on the development branch 2026-08: cmd=set rejects any non-finite value
      (NaN and infinity) with {"result": false}
      (RemoteServer.java, handleControl(), case "set", "Double.isNaN(v) ||
      Double.isInfinite(v)"). The released app still writes infinity into the buffer.
    ios: >-
      Rejects anything not finite, so infinity is refused with {"result": false}
      (ExperimentWebServer.swift, "if !value.isFinite").
  verified: >-
    Divergence confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build
    1020102, Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). Android fix verified on hardware 2026-08-08
    (development build, Pixel 9 Pro): value=Infinity and value=NaN both answer
    {"result": false}, value=1.5 answers {"result": true}.
  summary: >-
    Both apps refuse to write NaN, because a buffer holds NaN when empty and
    writing it explicitly is almost always a mistake. They disagreed about
    infinity, which Android accepted into the buffer and iOS rejected; Android now
    rejects it too. The entry stays until the release carrying the fix is out.

- id: control-set-unknown-buffer
  title: cmd=set naming a buffer that does not exist
  area: remote-interface
  status: fixed
  canonical: >-
    Reject a bad request cleanly; never let one reach an unhandled exception. A
    malformed or out-of-range request must produce a documented status and body -
    {"result": false} where the endpoint answers that way, an error object where it
    answers that way - and must never fail the request with a server error, terminate
    the app, or report success for something it did not do. Neither platform is
    uniformly right today: Android throws where it should answer, and iOS answers
    true for a trigger it did not perform. This is the same principle as
    enum-invalid-value in the file format, applied to the API.
  affects:
    android: >-
      Fixed on the development branch 2026-08: cmd=set naming a buffer that does not
      exist answers {"result": false} instead of dereferencing null and throwing
      (RemoteServer.java, handleControl(), case "set", null check on getBuffer). The
      released app still throws.
    ios: >-
      Returns {"result": false}
      (ExperimentWebServer.swift, "guard ... let buffer = self.experiment.buffers[bufferName]").
  verified: >-
    Divergence confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build
    1020102, Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). Android fix verified on hardware 2026-08-08
    (development build, Pixel 9 Pro): cmd=set with buffer=nosuchbuffer answers
    {"result": false}.
  summary: >-
    A typo in the buffer name gets a clean negative result on iOS and used to fail
    the request on Android; Android now answers {"result": false} too. The result
    field exists precisely to report this. The entry stays until the release
    carrying the fix is out.

- id: control-trigger-out-of-range
  title: cmd=trigger with an out-of-range element index
  area: remote-interface
  status: decided
  canonical: >-
    Reject a bad request cleanly; never let one reach an unhandled exception. A
    malformed or out-of-range request must produce a documented status and body -
    {"result": false} where the endpoint answers that way, an error object where it
    answers that way - and must never fail the request with a server error, terminate
    the app, or report success for something it did not do. Neither platform is
    uniformly right today: Android throws where it should answer, and iOS answers
    true for a trigger it did not perform. This is the same principle as
    enum-invalid-value in the file format, applied to the API.
  affects:
    android: >-
      Fixed on the development branch 2026-08: an out-of-range element index answers
      {"result": false} instead of indexing the list unchecked and throwing
      (RemoteServer.java, handleControl(), case "trigger", bounds check). The
      released app still throws. Note Android answers false for a trigger it did not
      perform, where iOS answers true - the canonical asks for false, so iOS is the
      side that still has to change.
    ios: >-
      Bounds-checks the index, does nothing if it is out of range or names a
      non-button element, and answers {"result": true} either way
      (ExperimentWebServer.swift, "if (self.htmlId2ViewElement.count > elementIndex)").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    Neither behaviour is right: Android fails the request, and iOS reports success
    for a trigger it did not perform. A client cannot tell from either response
    whether the element was actually activated.

- id: export-invalid-format
  title: /export with a format index that is out of range
  area: remote-interface
  status: decided
  canonical: >-
    Reject a bad request cleanly; never let one reach an unhandled exception. A
    malformed or out-of-range request must produce a documented status and body -
    {"result": false} where the endpoint answers that way, an error object where it
    answers that way - and must never fail the request with a server error, terminate
    the app, or report success for something it did not do. Neither platform is
    uniformly right today: Android throws where it should answer, and iOS answers
    true for a trigger it did not perform. This is the same principle as
    enum-invalid-value in the file format, applied to the API.
  affects:
    android: >-
      Range-checks the index and answers 200 with {"error": "Format out of
      range."}; since the development branch (2026-08) a missing or non-numeric
      format also answers 200 with {"error": "Invalid format."} instead of throwing
      in Integer.parseInt (RemoteServer.java, handleExport()).
    ios: >-
      Indexes the format list unchecked, so an out-of-range index traps and
      terminates the app; a missing or non-numeric format is treated as index 0
      (Excel)
      (WebServerUtilities.swift, "exportTypes[Int(str) ?? 0].1").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    "/export?format=99" is an error message on Android and a crash of the whole
    app on iOS - reachable by anyone who can reach the phone, since the API has no
    authentication. The two also differ on a missing format parameter, which
    Android fails and iOS silently answers with an Excel file.

- id: config-buffer-order
  title: Order of the buffers array in /config
  area: remote-interface
  status: decided
  canonical: >-
    The order of the buffers array carries no meaning. Neither platform needs to
    change; what is required is that the API description says so, so that no client
    is written to depend on it. Android happens to list buffers in the order the
    experiment declares them and iOS in an unspecified order, and both are valid.
  affects:
    android: >-
      Iterates an ordered list, so buffers appear in the order the experiment
      declares them
      (RemoteServer.java, handleConfig(), "experiment.dataBuffers").
    ios: >-
      Iterates a dictionary, so the order is unspecified and may change between
      runs
      (ExperimentWebServer.swift, "for (name, buffer) in self.experiment.buffers").
  summary: >-
    JSON arrays are ordered, so a client may reasonably read meaning into the
    order of /config buffers. On Android it matches the experiment file; on iOS it
    is arbitrary. Neither is documented, so the safe reading for now is that the
    order means nothing - but the two should agree.

- id: meta-sensors
  title: Sensor metadata in /meta
  area: remote-interface
  status: decided
  canonical: >-
    Android-only, by platform limitation rather than by choice. iOS offers no API
    for per-sensor information such as model or manufacturer, so the values cannot be
    supplied there. Combined with meta-missing-value-representation, this means the
    sensors object is simply absent on iOS rather than present and empty.
  affects:
    android: >-
      Adds a "sensors" object with one entry per sensor, each carrying name,
      vendor, range, resolution, minDelay, maxDelay, power and version
      (RemoteServer.java, handleMeta()).
    ios: >-
      Serves only the non-sensor metadata; no "sensors" key
      (ExperimentWebServer.swift, "for metadata in Metadata.allNonSensorCases").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    Android reports per-sensor metadata over /meta and iOS does not, even though
    iOS models the same values (Metadata.sensor) and serves them to network
    connections. A client cannot tell a phone without the data from a phone that
    does not report it.

- id: res-fallback
  title: Fallback for resources not shipped with the experiment
  area: remote-interface
  status: decided
  canonical: >-
    Android's behaviour, which is a recent fix and is planned for iOS as well: look
    in the experiment's resource folder, then fall back to the images bundled with
    the app, matching what the image view element does. The error message is
    "Unknown file." in both cases; iOS should drop the separate "No file requested."
    wording, since a client cannot act on the distinction and the API description
    tells clients not to match on the text.
  affects:
    android: >-
      Looks in the experiment's resource folder, then falls back to the images
      bundled with the app, matching the fallback of the image view element
      (RemoteServer.java, handleRes()).
    ios: >-
      Implements the fallback on the development branch (2026-08): looks in the
      experiment's resource folder, then falls back to the bundled images
      (ExperimentWebServer.swift, "/res" handler via Experiment.resolveResource).
      Still reports "No file requested." for a missing src parameter, which the
      canonical behaviour asks it to drop.
  verified: >-
    Partly confirmed on hardware 2026-08-02 with the Roller Coaster experiment on
    Android 1.2.1-beta2 and iOS 1.2.0. The differing error messages were
    reproduced exactly. The fallback itself was not: both apps refuse a resource
    the experiment does not reference, so the Android asset lookup is only
    reachable for an experiment that *names* a resource it does not ship, which
    that test could not produce. Note that test's traversal check
    ("../../../etc/hostname") was refused only because the experiment did not
    reference that path, not by a traversal guard: a file that *declares* a
    traversing src passed the resources check and reached the file lookup. Both
    platforms now guard the resource name against "../" path components (iOS
    Experiment.resolveResource; Android Helper.isSafeResourceName on the
    development branch 2026-08). Verified on Android hardware 2026-08-07: a
    declared src of "../../../.../shared_prefs/...xml" is refused with
    "Unknown file." while a bundled "hue.png" is served.
  summary: >-
    iOS distinguishes a missing src parameter ("No file requested.") from an
    unknown one ("Unknown file."), where Android answers "Unknown file." to both -
    so a client cannot tell a malformed request from a wrong file name on
    Android. Separately, Android falls back to images bundled with the app when a
    resource is not in the experiment's own folder and iOS does not, which would
    show up for an experiment naming a resource it does not ship.
- id: meta-missing-value-representation
  title: How /meta reports a value the device cannot supply
  area: remote-interface
  status: decided
  canonical: >-
    Omit the key. Availability differs enormously between devices and platforms, and
    answering with a mass of nulls misrepresents that as data. A client must expect
    fields to be absent. Android already behaves this way; iOS should stop emitting
    null entries.
  affects:
    android: >-
      Omits the key entirely. JSONObject.put() with a null value removes the
      key, so e.g. depthFrontResolution and depthFrontRate are simply absent on a
      device without a depth sensor (RemoteServer.java, handleMeta()).
    ios: >-
      Includes the key with a JSON null, e.g. "deviceBoard": null,
      "depthBackRate": null (ExperimentWebServer.swift, "/meta" handler).
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    A client cannot tell "this device has no such value" from "this app version
    does not report it", because the two platforms express the first case
    differently and neither uses the empty string. Observed on real devices: an
    Android phone omitted depthFrontResolution, depthFrontRate,
    depthBackResolution and depthBackRate; an iPhone sent null for those plus
    deviceBaseOS, deviceBoard, deviceCodename and deviceManufacturer.

- id: cors-error-paths
  title: Android drops the CORS header on requests that throw
  area: remote-interface
  status: fixed
  canonical: >-
    Every response carries the CORS header, whatever produced it. Originally
    expected to follow from the group A decision (no request reaching an unhandled
    exception), but now guaranteed at the server level on Android independent of
    that: the header is set before a request is dispatched, so jlhttp's own error
    pages carry it too, and a handler exception is turned into a plain 500 instead
    of reaching jlhttp's connection handling, which would discard the header.
  affects:
    android: >-
      Fixed on the development branch 2026-08: the header is added for every
      request before dispatch (RemoteServer.java, CorsHTTPServer.handleTransaction)
      and unhandled handler exceptions become jlhttp 500 error responses that keep
      it (withErrorResponse()). Confirmed on a device: success (single header, not
      duplicated), the two throwing requests (/export with no format, /get with an
      unknown reference buffer), 404, 405/501 on unknown methods and OPTIONS all
      carry the header. The released app still drops it on requests that throw.
    ios: >-
      Sends the CORS header on every response including error responses since
      the cors-header fix on the development branch (2026-08); the released
      app sends none anywhere, so the distinction does not arise there.
  verified: >-
    Divergence confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build
    1020102, Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The Android fix verified on hardware
    2026-08-07 (development build, Pixel 9 Pro) against the error paths listed
    above; not yet by a cross-platform comparison.
  summary: >-
    Android's CORS support was inconsistent with itself: successful responses
    carried the header and requests that raise an exception did not. A browser
    client therefore could not read the error, and saw an opaque CORS failure
    instead of the status code - the case where a useful message matters most.
    Distinct from cors-header, which is about iOS having no CORS at all. Both
    development branches now send the header on every response; the entry stays
    until the releases carrying the fixes are out.

- id: res-content-type
  title: Content-Type of a resource served by /res
  area: remote-interface
  status: decided
  canonical: >-
    application/octet-stream. phyphox should not attempt file-type detection: it
    would mean depending on the host system's type database, which differs between
    platforms and would introduce exactly the kind of divergence this list exists to
    remove. The client is expected to determine what it received. Android already
    behaves this way; iOS should stop deriving the type from the file extension.
  verified: >-
    Confirmed on hardware 2026-08-02 with the Roller Coaster experiment
    (crc32 31697a06) on Android 1.2.1-beta2 and iOS 1.2.0: both returned the
    identical 40559-byte PNG (sha256 d180fe9da741...), Android as
    application/octet-stream and iOS as image/png.
  affects:
    android: >-
      Passes a null content type to respond(), so jlhttp falls back to
      application/octet-stream for every resource whatever its type
      (RemoteServer.java, handleRes()).
    ios: >-
      GCDWebServerFileResponse derives the type from the file extension, so a
      PNG is served as image/png
      (ExperimentWebServer.swift, "/res" handler).
  summary: >-
    The same image comes back with a different Content-Type from the two apps.
    The bundled interface is unaffected because browsers sniff images inside an
    <img> tag regardless, but any other client - one saving the file, or
    deciding how to render it from the header - sees a generic binary blob from
    Android and a typed image from iOS.

- id: input-invalid-enum-handling
  title: What happens when an enumerated attribute has an invalid value
  area: file-format
  status: decided
  canonical: >-
    Reject the file. An enumerated attribute carrying a value outside its allowed set
    is an error, and the experiment must not load. Android already behaves this way;
    iOS must stop substituting the default. Note that CameraFeature's init?(rawValue:)
    on iOS returns .PHOTOMETRIC for anything unrecognised and so can never report
    failure - it has to change shape, not just its fallback. See spec/rules.yml,
    rule enum-invalid-value.
  affects:
    android: >-
      Refuses the file. sensor/rateStrategy throws "Invalid rate strategy.",
      camera/aeStrategy throws "Unknown aeStrategy: ..." and camera/feature
      throws "Unknown feature name: ..." (PhyphoxFile.java, inputBlockParser).
    ios: >-
      Silently substitutes the default. rateStrategy uses "try?" and falls
      through to the version-dependent default, aeStrategy uses
      "(try? ...) ?? .mean", and CameraFeature's own init returns .PHOTOMETRIC
      for anything it does not recognise (InputElementHandler.swift).
  summary: >-
    A typo in an enumerated attribute stops the experiment loading on Android and
    is ignored on iOS, where the experiment then runs with different settings
    than its author wrote. The silent path is the more dangerous one: an author
    testing only on iOS cannot tell that the attribute had no effect, and the
    file will not load at all for their Android users. This is one decision, not
    three - whatever is chosen should apply to every enumerated attribute in the
    format.

- id: input-enum-case-sensitivity
  title: Case sensitivity of enumerated attribute values
  area: file-format
  status: decided
  canonical: >-
    Enumerated values are matched case-insensitively, so mode="Closest" and
    mode="closest" are the same, and this holds for EVERY enumerated value in the
    format - not just a chosen few. The rule covers: the enumerated attribute values
    across all blocks (input/output type; sensor type and rateStrategy; camera
    feature, aeStrategy and show_controls; depth mode; graph style and scale modes;
    image dark/lightFilter; audio waveform; audio and flashlight parameter names;
    bluetooth mode and extra; network discovery, service and conversion; analysis
    map zMode, interpolate method and eventstream mode), the output component and
    input "as"/"axis" mapping names (t, luma, shutterSpeed, pixelPosition, ...), and
    the bluetooth conversion-function names (int16LittleEndian, hexadecimal,
    byteArray, ...). It holds only as long as no allowed set contains two values
    differing only in case; none does today across any of these vocabularies, and
    none may be introduced (new enumerations should be all-lowercase). Case folding
    happens before the rejection required by input-invalid-enum-handling, or the very
    files this rule protects would be refused. See spec/rules.yml, rule
    enum-case-insensitive.
  affects:
    android: >-
      Folds case for every enumerated value as of the development branch (2026-08).
      Previously only depth/mode and camera/feature were folded; the sweep extended
      it to all the vocabularies listed in the canonical, via a case-insensitive
      helper for enum-valued attributes, lowercased switches, equalsIgnoreCase for
      the component/as mapping names, and a rewritten bluetooth conversion lookup
      that resolves the function by name case-insensitively (PhyphoxFile.java,
      SensorInput.java, GraphView.java, AudioOutput.java, Helper.enumFromStringIgnoreCase,
      and Conversions{Input,Output,Config}.getConversion, which also replaced the old
      reflection lookup). The released app folds only depth/mode and camera/feature.
    ios: >-
      Matches the raw string everywhere, so mode="Closest" fails to parse - throwing
      for depth/mode, silently falling back to photometric for camera/feature
      (InputElementHandler.swift). iOS still has to fold every enumerated value,
      including the component/as mapping names and the bluetooth conversion-function
      names - the same full extent Android now covers.
  verified: >-
    Android folding verified on hardware 2026-08-08 (development build, Pixel 9 Pro):
    an experiment mixing rateStrategy="Limit", sensor type="ACCELEROMETER",
    graph style="DOTS", scaleMinX="AUTO" and component="X"/"T" loads; a bluetooth
    experiment with conversion="Int16LittleEndian"/"Float32BigEndian"/"HEXADECIMAL"/
    "BYTEARRAY" loads; a bogus conversion is still rejected; and every bundled
    bluetooth experiment (covering all conversion functions) still loads. iOS not
    yet changed.
  summary: >-
    The same file is accepted by one app and not the other purely because of
    capitalisation. Android now folds case for the whole format - every enumerated
    attribute value, the output component/input as mapping names, and the bluetooth
    conversion-function names - while iOS still matches the raw string everywhere.
    The gap between the platforms is therefore wider than the original entry
    suggested, and closing it on iOS is a format-wide change, not a per-attribute one.
- id: input-output-component-validation
  title: Validation of the component attribute on input outputs
  area: file-format
  status: decided
  canonical: >-
    Validate and reject. A parser checks each output's component attribute against
    the list allowed for its element, enforces the minimum and maximum counts, and
    refuses the file when either fails; an unrecognised component is an error rather
    than something to drop. Android already conforms. iOS must implement it, which
    can stop a file loading that loads there today - the exposure is limited to
    experiments written and tested on iOS alone, which are already misbehaving, but
    the bundled collection is worth a pass with the stricter parser before the
    release that carries it. See spec/rules.yml, rule output-component-validation.
  affects:
    android: >-
      Checks the component name against the list allowed for that input and
      refuses the file if it does not match, enforces minimum and maximum counts
      per component, and requires the attribute where the mapping is ambiguous
      (PhyphoxFile.java, ioBlockParser with an ioMapping table per input).
    ios: >-
      Accepts any component name and any number of outputs; the handler stores
      whatever it finds and defaults a missing component attribute to the string
      "output", which matches no input's component list. Unrecognised components
      are dropped later without an error (InputElementHandler.swift,
      SensorOutputElementHandler).
  summary: >-
    A misspelled component - "acc" for "abs", say - is a load error on Android
    and silently produces an experiment with an empty buffer on iOS. The same
    applies to a missing required output: Android insists that an audio input has
    an "out" component and a depth input a "z", iOS does not. This is the single
    largest structural difference found while modelling the input block, and it
    affects every input, output and view element in the format rather than one
    attribute.
- id: views-map-color-limit
  title: How many stops a map graph's colour scale may have
  area: file-format
  status: decided
  canonical: >-
    No limit. A colour scale may have as many stops as the file gives, ending at
    the first gap in the numbering - which is what Android already does and what
    the documentation describes generically as mapColor[n]. The cap of nine is to
    be removed from iOS. The related question of what a parser should do with an
    unparseable colour, where iOS truncates the scale and Android substitutes its
    default and carries on, is a separate matter and is not settled by this.
  affects:
    android: >-
      Unbounded. Reads mapColor1, mapColor2, ... in a while loop that stops at
      the first attribute that is absent, so a scale may have any number of
      stops (PhyphoxFile.java, viewBlockParser, around the mapColor loop).
    ios: >-
      Capped at nine. Iterates a fixed list mapColor1...mapColor9 and breaks at
      the first one missing, so a tenth stop is silently ignored
      (GraphViewElementHandler.swift).
  summary: >-
    Both apps read an explicit colour scale for map graphs the same way - stops
    numbered from 1, ending at the first gap - so scales of up to nine stops
    behave identically. Beyond that they part: Android keeps reading, iOS stops
    at nine and drops the rest without an error, so a finely graded scale is
    rendered coarser on iOS with nothing to say why. A related detail worth
    settling at the same time: an unparseable colour truncates the scale on iOS,
    where it is treated as absent, while Android substitutes its default colour
    and carries on.

- id: graph-output-data-picker
  title: The output element of a graph means different things on the two apps
  area: file-format
  status: fixed
  canonical: >-
    The data picker. A graph's output tags configure the data picker introduced
    in file format 1.20: each carries axis (x, xcal, y, ycal, z, zcal) and a
    label, and writes a coordinate of the point the user picks into a data
    container, with the cal variants prompting for a value to assign. graph's
    pickLabel renames the button. The calibrationMode and calibrationParameter
    attributes were a draft for the spectroscopy feature, are replaced by this,
    and are to be removed from iOS rather than implemented on Android.
  affects:
    android: >-
      Implements the data picker. The graph's ioBlockParser accepts outputs
      mapped by axis to x, xcal, y, ycal, z and zcal, each repeatable and each
      carrying a label; DataOutput has a label field for exactly this
      (PhyphoxFile.java, viewBlockParser; ExpView.graphElement.setPickConfig).
    ios: >-
      Implements the data picker on the development branch since 2026-08: the
      graph output handler reads axis and label, pickLabel renames the pick
      tool, and the calibrationMode/calibrationParameter draft has been removed
      (GraphViewElementHandler.swift, GraphOutputElementHandler,
      ExperimentGraphView.swift).
  summary: >-
    Both apps accepted an output tag inside a graph and neither could read the
    other's. Android used it for the data picker; iOS used it for a superseded
    calibration draft whose calibrationParameter attribute was mandatory, so a
    data-picker graph did not merely lose the feature on iOS - it stopped the
    file loading. iOS now implements the data picker and the calibration draft
    is gone; this entry stays until the release carrying the fix has shipped.

- id: ble-address-ios-must-reject
  title: The BLE address attribute is Android-only, and iOS should say so
  area: file-format
  status: decided
  canonical: >-
    address is an Android-only scan criterion, because iOS gives no access to a
    BLE device's hardware address and the criterion therefore cannot be honoured
    there. That is a platform limitation and stands. What must change is the
    failure mode: iOS should reject an experiment using the attribute with a
    clear error rather than accepting the file and connecting to whatever device
    happens to match the remaining criteria. The documentation must state plainly
    that using address makes an experiment Android-only.
  affects:
    android: >-
      Reads address and uses it as a scan criterion
      (PhyphoxFile.java, inputBlockParser, case "bluetooth").
    ios: >-
      Does not declare the attribute at all, so it is silently dropped and the
      device is chosen by the remaining criteria
      (InputElementHandler.swift, BluetoothElementHandler).
  summary: >-
    An experiment that pins a Bluetooth connection to one hardware address works
    as intended on Android and silently connects to a different device on iOS,
    which is worse than not working: the experiment appears to run and produces
    data from the wrong source. Unlike most entries here the fix is not to bring
    the platforms into line - the capability genuinely does not exist on iOS -
    but to make the incompatibility explicit, in the parser and in the
    documentation.

- id: android-unofficial-attributes
  title: Attributes in the Android parser that are not part of the format
  area: file-format
  status: fixed
  canonical: >-
    Neither is part of the phyphox file format, and both should be removed from
    the Android parser rather than specified or ported. camera/threshold belongs
    to a planned but untested feature that was carried into the app with the rest
    of its implementation; edit/editable makes little sense for an element whose
    purpose is user input and is not believed to be used by any experiment. Both
    are absent from the specification for that reason.
  affects:
    android: >-
      Removed on the development branch (2026-08). For camera/threshold the whole
      untested threshold analyser was removed, not just the attribute: the camera
      no longer offers a threshold output component either, so Android now has
      nothing where iOS has nothing (ThresholdAnalyzer deleted; the threshold
      output slot dropped from the camera output mapping and the CameraInput buffer
      indices renumbered; PhyphoxFile.java, CameraInput.kt,
      AnalyzingOpenGLRenderer.java). edit/editable is no longer read, so the edit
      element is always editable, its former default (PhyphoxFile.java,
      viewBlockParser). The released app still has both. An unknown attribute is
      silently ignored, so a file setting editable still loads; a file that named
      the camera threshold *output* would now fail to load, but none does.
    ios: >-
      Has neither: no threshold analyser or output, and no editable attribute.
  verified: >-
    Android removal verified on hardware 2026-08-08 (development build, Pixel 9
    Pro): camera-luminance loads and its exposure outputs, which shifted index when
    the threshold slot was removed, still carry correct data (shutterSpeed 0.067 s,
    iso 6400, aperture f/1.68); spectroscopy (pixelPosition, the last output) loads;
    an edit element with editable="false" loads with the attribute ignored. No
    bundled experiment uses the camera threshold output or the editable attribute.
  summary: >-
    Two attributes exist only because implementation reached the parser ahead of
    a decision to ship the feature. They are documented nowhere, unlikely to be
    used by any experiment, and are being removed. Recorded rather than quietly
    dropped so that the removal is traceable and so that anyone finding them in
    the Android source knows they are not part of the format. Worth a search of
    the experiment collection before the removal lands.

- id: ios-behind-on-format-1-20
  title: File format 1.20 features not yet implemented on iOS
  area: file-format
  status: fixed
  canonical: >-
    These are ordinary features of file format 1.20 and belong on both platforms.
    iOS should implement them when it moves to 1.20; nothing about the format
    itself is in question. Listed together because they share one cause and one
    fix, rather than as separate divergences.
  affects:
    android: >-
      Declares file format 1.20 (PhyphoxFile.phyphoxFileVersion) and implements
      camera/aeFPSTarget, graph/interpolateMapColors, the clearGroup attribute on
      data containers, the visibility attribute on every view element, the whole
      flashlight output element, and the analysis modules butterworth and
      imagedecode.
    ios: >-
      The released app declares 1.19 (latestSupportedFileVersion in
      PhyphoxElementHandler.swift); the development branch declares 1.20 and,
      as of 2026-08, implements the complete list. The last item was triggerId
      on the input elements of a bluetooth output block, now parsed
      (BluetoothInputElementHandler in OutputElementHandler.swift) and wired
      from the button press to the send pass (ExperimentBluetoothOutput), with
      the same semantics as Android: a characteristic input carrying a
      triggerId is skipped in the per-analysis send unless a button carrying
      the matching trigger id has been pressed since the last pass.
  summary: >-
    The iOS development branch completed file format 1.20 in 2026-08; this
    entry stays until the release carrying it ships, since the released iOS
    app still declares 1.19 and refuses a 1.20 file with the normal "update
    the app" message. The last item was triggerId on the inputs of a bluetooth
    output, which restricts sending a characteristic to presses of a button
    carrying the matching trigger id; it was not on the original list of this
    entry and surfaced only through the spec work - a reminder that the list
    here is not the authority, the spec's divergence markers are. It was
    implemented on the iOS development branch in 2026-08, closing the list. camera/aeFPSTarget, the target frame rate for the
    prioritizeFramerate exposure strategy, and graph/interpolateMapColors,
    which turns off the color interpolation of a map graph to show each data
    point as a flat pixel, were on this list until the iOS development branch
    implemented both in 2026-08. The analysis modules
    butterworth and imagedecode were the sharpest form of this - an experiment
    using one does not degrade, it fails to load - until the iOS development
    branch implemented both in 2026-08.

    Conditional visibility was a partial case on this list - iOS implemented the
    attribute for most view elements but not for separator and image - until the
    iOS development branch completed it for every element in 2026-08, together
    with applying the initial buffer state at load. The remote-interface half
    followed in the same push: iOS now embeds the same visibilityInput key in the
    web interface's element configuration as Android and ships the current
    phyphox-webinterface revision, which implements the hiding centrally.

    Several items of the original list have been resolved on the iOS development
    branch in 2026-08: the whole flashlight output element including the
    photosensitivity warning and the thermal safeguard, the pan parameter on
    audio tone and noise inputs (the divergence that surfaced around the direct
    input while porting it is tracked as audio-direct-input-stereo), and
    clearGroup, the attribute that exempts calibration data from the trash
    button, now implemented in the app, its clear dialog and over the remote
    interface (its API half was tracked as control-clear-groups, now fixed). The
    data picker was tracked separately as graph-output-data-picker, because it
    failed even on a file declaring an older version; it has since been
    implemented on the iOS development branch and that entry is now marked
    fixed.

- id: ios-hyperbolic-modules-compute-trig
  title: sinh, cosh and tanh compute sin, cos and tan on iOS
  area: file-format
  status: decided
  canonical: >-
    Android is correct: sinh, cosh and tanh compute the hyperbolic functions, as
    documented. The iOS classMap entries are a bug and must point at
    SinhAnalysis, CoshAnalysis and TanhAnalysis, which already exist and are
    correct. On the iOS to-do list as of 2026-08-03.
  affects:
    android: >-
      Correct. analysisBlockParser maps sinh, cosh and tanh to their own
      implementations (PhyphoxFile.java).
    ios: >-
      Wrong. ExperimentAnalysisFactory.classMap contains
      "sinh": SinAnalysis.self, "cosh": CosAnalysis.self and
      "tanh": TanAnalysis.self, so each hyperbolic module runs the ordinary
      trigonometric one. SinhAnalysis, CoshAnalysis and TanhAnalysis exist and
      correctly call vvsinh, vvcosh and vvtanh, but are referenced nowhere
      outside their own files.
  summary: >-
    An experiment using sinh, cosh or tanh produces silently wrong numbers on
    iOS: it computes the ordinary trigonometric function instead. There is no
    error, nothing in the interface to indicate it, and the result is plausible
    enough to be mistaken for data. Because the substituted modules also honour
    the deg attribute, sinh with deg="true" additionally converts the input from
    degrees to radians before taking its sine, which the hyperbolic function
    would never do.

    This is not a disagreement about the format - all three modules are
    documented and Android implements them correctly.

    No bundled experiment uses these modules, so the exposure is limited to
    user-written and community experiments, which cannot be surveyed from here.
    The fix is three lines in classMap and the correct classes already exist.

- id: analysis-slot-constraints-unenforced
  title: Per-slot constraints on analysis module inputs and outputs
  area: file-format
  status: decided
  canonical: >-
    Validate and reject, by the rule already decided as output-component-validation,
    whose scope is the mapping mechanism wherever it appears in the format. A parser
    checks each analysis input and output against the module's slot table: whether
    the as attribute is required for that slot, how many tags may fill it, and
    whether a literal value or the empty type is permitted - and refuses the file
    when any of them fails, rather than assigning positionally. Android already
    conforms; iOS has no equivalent of the table and must gain one.
  affects:
    android: >-
      Every module carries an ioMapping table stating, per slot, whether the `as`
      attribute is required, how many tags may fill it, whether type="value" is
      accepted and whether type="empty" is. All four are enforced, and a file
      breaking any of them is refused with a specific message - "The non-mapped
      input could not be matched", "A maximum of n inputs was expected for X",
      "Value-type not allowed for input X" (PhyphoxFile.java, ioBlockParser).
    ios: >-
      Matches the `as` names each module knows about, falls back to document
      order for anything unnamed, and applies no per-slot restriction. There is
      no equivalent of the mapping table; each module checks only what its own
      code happens to need, typically that its two or three essential inputs are
      present (Analysis/Modules/*.swift).
  summary: >-
    Android states four constraints per input and output slot of every analysis
    module and enforces all of them; iOS enforces none. Of the 194 slots across
    54 modules, 104 require the `as` attribute, 37 refuse a literal value, three
    accept the empty type and 25 belong to a repeating group. A file that omits a
    required `as`, gives a slot more tags than it allows, or passes a literal
    where a data container is expected is refused by Android with a precise
    error, and accepted by iOS - which then assigns inputs positionally and
    produces an experiment that runs but computes something other than what its
    author wrote. This is the same shape as
    input-output-component-validation, one level down, and would be settled by
    the same decision.

- id: analysis-outputs-assigned-by-position
  title: iOS assigns some analysis outputs by position, ignoring the as attribute
  area: file-format
  status: decided
  canonical: >-
    Settled by the same rule: an output whose as attribute names no slot of the
    module is an error, not something to place by position. Two further points are
    implementation detail rather than open questions. iOS must recognise the
    documented name stddev on the average module - it currently looks for std, which
    appears in neither Android nor the documentation - and loess must map its outputs
    by name rather than reading outputs[0..2] in order. Neither is a question about
    the format.
  affects:
    android: >-
      Maps every output to its slot by the as attribute, which the mapping table
      marks required for average/stddev and for loess/yi1 and loess/yi2
      (PhyphoxFile.java, ioBlockParser).
    ios: >-
      average looks for as="std" - not the documented "stddev" - and otherwise
      takes the first output as the average and any later one as the standard
      deviation ("if output.asString == \"std\" || avg != nil").
      loess never looks at output names at all, reading outputs[0], outputs[1]
      and outputs[2] as yi0, yi1 and yi2
      (AverageAnalysis.swift, LoessAnalysis.swift).
  summary: >-
    Two analysis modules assign their outputs by document order on iOS rather
    than by the as attribute, and one of them does not even recognise the
    documented name. Writing average's outputs in the order stddev-then-average -
    which Android accepts and maps correctly, and which the documentation
    permits since both carry as - silently swaps the two values on iOS. The
    experiment runs, the graph is plotted, and the standard deviation is shown as
    the mean. loess behaves the same way for its three interpolation outputs.

    Found by confirming each of the 52 iOS analysis modules against Android's
    mapping table. These two were the only name-level mismatches; the other 48
    agree.

- id: android-info-batterylevel-as-optional
  title: The info module's batteryLevel output does not require as on Android
  area: file-format
  status: fixed
  canonical: >-
    The as attribute is required, as the documentation states and as every other
    output of the module already demands. Android's mapping table has
    asRequired = false for this one slot and must be corrected, so that an
    unnamed output is not silently taken to be the battery level.
  affects:
    android: >-
      Fixed on the development branch (2026-08): asRequired = true for
      batteryLevel like every other info output, so an output without an as
      attribute is rejected rather than assigned to the battery level
      (PhyphoxFile.java, analysisBlockParser, case "info"). The released app
      still assigns an unnamed output to batteryLevel.
    ios: >-
      Matches batteryLevel by name only; an unnamed output is not assigned to it
      (InfoAnalysis.swift).
  verified: >-
    Android fix verified on hardware 2026-08-08 (development build, Pixel 9 Pro):
    an info module with an unnamed output is refused ("The non-mapped output could
    not be matched."), while an output with as="batteryLevel" loads.
  summary: >-
    batteryLevel is the only output of the info module that Android will accept
    without an as attribute, which the documentation does not permit and iOS does
    not do. An unnamed output in an info module is therefore silently treated as
    a request for the battery level on Android and ignored on iOS. The
    inconsistency is small, but it is in the parser rather than the format: the
    documented behaviour is what both should do.

- id: network-mqtts-unofficial
  title: MQTT services, reimplemented dependency-free and to be brought to parity
  area: file-format
  status: decided
  canonical: >-
    The MQTT services are kept and finished rather than removed (maintainer
    decision 2026-08). Both platforms provide all four - mqtt/csv, mqtt/json,
    mqtts/csv, mqtts/json - backed by a from-scratch MQTT 3.1.1 client with no
    external dependency (Android previously used the Eclipse Paho / hannesa2
    "paho.mqtt.android" fork, which wrapped the archived Paho Android Service and
    is in maintenance mode; iOS lacked the TLS variants entirely). Three settled
    changes to what the services do: (1) delivery is QoS 0, or QoS 1 when the
    persistence attribute is set - the former QoS 2 "persistence" mode with offline
    buffering is dropped, since phyphox does not need exactly-once and QoS 1 with
    the app's own buffering covers the reliability case; (2) the mqtts custom CA is a
    PEM or DER certificate (.pem/.crt/.cer/.der) named by an optional certificate
    attribute and delivered as an ordinary experiment resource in the res directory -
    so it is copied along with the experiment when saved to the collection, and
    multiple experiments can carry different certificates. It is used as a trust
    anchor for the broker's certificate chain with NO host-name verification. If the
    attribute is omitted the system trust store is used; if it names a file that
    cannot be loaded, the connection is refused rather than silently falling back.
    The mqtts services default to port 8883 (plain mqtt to 1883). This replaces the
    Android-only BKS truststore, which could never have worked on iOS. (3) The
    services stay MQTT 3.1.1 - MQTT 5 buys nothing for this publish/subscribe use and
    would break older brokers. The services, the username/password, persistence and
    certificate attributes, and this certificate mechanism are now documented
    (docs/file-format/network-connections.md, spec/network.yml); the documentation
    stands but marks the feature Android-only until iOS conforms.
  affects:
    android: >-
      Reimplemented on the development branch (2026-08) with a from-scratch client
      (NetworkConnection/Mqtt/MqttClient.java: CONNECT, PUBLISH, SUBSCRIBE, PINGREQ,
      DISCONNECT; QoS 0 and 1; TLS via the platform SSL socket). The Paho/hannesa2
      dependency was removed. persistence now selects QoS 1; the TLS certificate is
      named by the certificate attribute and resolved as an experiment resource from
      the res directory, the same way image resources are (so it survives saving to
      the collection - MqttHelper.buildSslSocketFactory, PhyphoxFile adds it to
      experiment.resources). Accepts the username,
      password and persistence attributes; username and password are also accepted
      as optional on the plain mqtt services, since brokers commonly require
      authentication without TLS - previously they were silently ignored there
      (PhyphoxFile.java, networkBlockParser).
    ios: >-
      Accepts http/get, http/post, mqtt/csv and mqtt/json only, and throws
      "Unkown network service" for anything else. It does not declare username,
      password or persistence at all (NetworkElementHandler.swift). Needs the same
      from-scratch MQTT 3.1.1 client: the mqtts services, username/password auth,
      persistence as QoS 1, and a bundled PEM certificate for the custom CA.
  verified: >-
    Android verified on hardware 2026-08-09 (development build, Pixel 9 Pro)
    against a local broker, cross-checked with the mosquitto client tools:
    mqtt/json publishes JSON (QoS 0 and, with persistence, QoS 1) and receives
    into a buffer; mqtts/json connects over TLS with a bundled self-signed PEM and
    username/password, and both publishes and receives over TLS. Connection-error
    reporting and exponential-backoff reconnect were observed against an
    unreachable public broker. iOS not yet implemented.
  summary: >-
    Historically mqtts/csv and mqtts/json (plus username, password and persistence)
    were an Android-only, barely-tested user contribution on top of the Paho fork,
    and its TLS certificate was not even being delivered. The maintainer decision is
    to finish the feature rather than remove it: a from-scratch, dependency-free
    MQTT 3.1.1 client, QoS 1 instead of QoS 2, PEM instead of BKS. Android is done;
    iOS has to implement the same before the services can be documented as part of
    the format.

- id: container-type-unvalidated
  title: The type attribute of a data container is validated only on Android
  area: file-format
  status: decided
  canonical: >-
    iOS should check the attribute and reject any value other than "buffer", as
    Android already does. The attribute exists so that further container types
    can be added later; a parser that ignores it would silently treat a future
    type as an ordinary buffer, which is the failure the check exists to
    prevent.
  affects:
    android: >-
      Reads type and throws "Unknown container type" unless it is "buffer",
      which is the only value defined; the attribute exists for future container
      types (PhyphoxFile.java, dataContainersBlockParser).
    ios: >-
      Does not declare the attribute, so any value is accepted and ignored
      (DataContainersElementHandler.swift).
  summary: >-
    A data container declared with a type other than "buffer" is refused by
    Android and silently accepted by iOS. The practical exposure today is nil,
    since no other type exists, but the attribute is reserved precisely so that
    one can be added later - at which point a file using a new container type
    would load on iOS and behave as though it were an ordinary buffer. Same
    family as input-invalid-enum-handling, which is decided, and would be settled
    by applying that rule here.

- id: gausssmooth-nonpositive-sigma
  title: A gausssmooth module with sigma of zero or less
  area: file-format
  status: decided
  canonical: >-
    A sigma of zero or less is not a valid width, and both apps should refuse
    to load the file, naming the attribute. Neither current behaviour is
    right: substituting the default hides the mistake behind a plausible
    result, and using the value produces NaN for every output. Note that this
    is about a value that is *present* and invalid - omitting the attribute
    keeps the documented default of 3, which both apps already do.
  affects:
    android: >-
      Fixed on the development branch (2026-08): a present sigma of zero or less
      is rejected, naming the attribute; an absent attribute still keeps the
      module's default of 3 (PhyphoxFile.java, case "gausssmooth"). The released
      app instead treats sigma="0"/"-1" as "not set" and smooths with sigma 3.
    ios: >-
      Takes the attribute verbatim, defaulting to 3 only when it is absent
      (GaussSmoothAnalysis.swift). sigma="0" makes the kernel's normalisation
      divide by zero, so the module writes NaN for every value; a negative
      sigma gives a zero-width kernel. iOS still has to reject a non-positive
      sigma.
  verified: >-
    Android rejection verified on hardware 2026-08-08 (development build, Pixel 9
    Pro): sigma="-1" refuses the file naming the attribute ("Attribute \"sigma\"
    of gausssmooth must be greater than zero."), while sigma="2.5" and an omitted
    sigma both load. iOS not yet changed (Mac task #30).
  summary: >-
    Both apps default the smoothing width to 3 when the attribute is omitted,
    which is what the documentation says. They differ on a value that is
    present but not positive: Android treats it as "not set" and smooths with
    sigma 3, while iOS uses it and produces NaN for every output value at
    sigma="0". A file written this way is almost certainly a mistake, but it
    fails in two different ways and one of them is silent - the graph simply
    has no data.

- id: audio-direct-input-stereo
  title: Pan and stereo handling of the direct audio input
  area: file-format
  status: fixed
  canonical: >-
    The direct input plays its mono waveform duplicated at full amplitude to
    both stereo channels, in the looped and the one-shot case alike - the
    backwards-compatible reading of every file written before the stereo
    conversion. It takes no parameter inputs: the undocumented pan support via
    an input element nested inside the direct input element is to be removed
    from Android, and its broken loop path fixed to write both interleaved
    channels. iOS already behaves canonically.
  affects:
    android: >-
      Behaves canonically on the development branch since 2026-08: the direct
      input's plugin no longer accepts any parameter, so a nested input element
      inside the direct input fails the file with a parse error, and both the
      looped and the one-shot path write the mono sample to both interleaved
      stereo channels (AudioOutput.java, AudioOutputPluginDirect).
    ios: >-
      The direct input takes no parameters - the parser reads only the buffer
      name (AudioElementHandler, TextElementHandler) - and the engine plays the
      waveform centred on both stereo channels in both the looped and the
      one-shot case (AudioEngine.appendBufferToPlayback).
  summary: >-
    Both platforms play tone and noise generators in stereo with the pan
    parameter since file format 1.20. The direct buffer input diverged: Android
    additionally supported a pan parameter on it, expressed as an input element
    nested inside the direct input element, which the file-format documentation
    does not mention; iOS plays the direct source centred and accepts no
    parameters on it. Independent of pan, Android's looped direct playback had
    been broken since the stereo conversion, writing mono samples into the
    interleaved stereo buffer. The decision keeps the direct input mono and
    parameterless: it plays duplicated to both channels, as every file written
    before the stereo conversion expects, and the undocumented pan path is
    closed rather than documented. Android now implements this; the entry stays
    until the release carrying the fix has shipped.
