# Known inconsistencies between the phyphox implementations.
#
# One entry per divergence. Each entry renders in two places from this single
# source: an inline warning wherever the affected page writes the marker
#
#     {{inconsistency:<id>}}
#
# and a row in the generated "Known inconsistencies" page. See tools/hooks.py.
#
# Fields
#   id         short slug, used in the marker. Required.
#   title      one line, shown as the admonition heading. Required.
#   area       file-format | remote-interface | editor. Required.
#   status     open      - nobody has decided which behavior is correct yet
#              decided   - canonical behavior chosen, implementations not yet fixed
#              There is no "fixed" status: once every implementation agrees,
#              delete the entry (and its markers and spec references) in the
#              same commit as the fix. Readers learn about corrected behavior
#              from the release changelog; a lingering "recently corrected"
#              note only clutters the documentation.
#   canonical  what the correct behavior is. Required once status is decided.
#   affects    map of implementation -> observed behavior. Use the keys
#              android, ios, editor, arduino, micropython, wiki.
#   since      optional: format version or app version the divergence appeared in
#   issue      optional: URL of the tracking issue
#   verified   optional: when and against which builds the divergence was
#              actually observed on hardware, as opposed to read out of the
#              source. Absence means nobody has checked on a device.
#   summary    reader-facing explanation, one short paragraph. Required.
#
# Keep entries factual and cite where the behavior was observed, so the next
# person can re-check it rather than trusting this file.

- id: meta-sensors
  title: Sensor metadata in /meta
  area: remote-interface
  status: decided
  permanent: true
  canonical: >-
    Android-only, by platform limitation rather than by choice. iOS offers no API
    for per-sensor information such as model or manufacturer, so the values cannot be
    supplied there. The sensors object is therefore simply absent on iOS rather
    than present and empty.
  affects:
    android: >-
      Adds a "sensors" object with one entry per sensor, each carrying name,
      vendor, range, resolution, minDelay, maxDelay, power and version
      (RemoteServer.java, handleMeta()).
    ios: >-
      Serves only the non-sensor metadata; no "sensors" key
      (ExperimentWebServer.swift, "for metadata in Metadata.allNonSensorCases").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    Android reports per-sensor metadata over /meta and iOS does not, even though
    iOS models the same values (Metadata.sensor) and serves them to network
    connections. A client cannot tell a phone without the data from a phone that
    does not report it.

- id: fft-non-power-of-two-input
  title: FFT output for input lengths that are not a power of two
  area: file-format
  status: decided
  permanent: true
  canonical: >-
    fft uses the fastest transform each platform offers, so only a
    power-of-two number of input samples is guaranteed to give identical
    results on both platforms - an experiment that needs a portable FFT must
    provide that. Any other length is
    implementation-defined. For exact transforms of arbitrary length a
    separate, slower dft module is planned; until it exists, non-power-of-two
    input is simply outside the guaranteed contract.
  affects:
    android: >-
      FFTW transforms the input length directly, and the Java fallback
      zero-pads internally but truncates back, so the output length always
      equals the input length (analysis.cpp fftw3complex, Analysis.java
      fftAM).
    ios: >-
      vDSP_DFT only accepts lengths of the form f*2^n with f in {1, 3, 5,
      15}, so other inputs are zero-padded to the next supported length and
      the padded, longer spectrum is returned (FFTAnalysis.swift,
      nextFFTSize).
  summary: >-
    A non-power-of-two number of input samples yields a different output
    length and different values on the two platforms; a power-of-two input
    gives identical results on both.

- id: atan2-scalar-input
  title: atan2 with one fixed-value operand
  area: file-format
  status: decided
  canonical: >-
    Element-wise, like every other multi-input module (decided
    2026-08-24): a fixed value behaves exactly as a buffer holding a
    single element would - its value repeats for every element of the
    longer input, and the output has the length of the longest input.
    Android conforms; iOS's scalar shortcut is the bug.
  affects:
    android: >-
      Element-wise like every other multi-input module: the output has the
      length of the longest input, a fixed value repeats for every element,
      so atan2 of a 5-element buffer and a value yields 5 results
      (Analysis.java, atan2AM).
    ios: >-
      When exactly one operand is a fixed value (type="value") and the
      other a buffer with more than one element, the scalar code path
      computes a SINGLE value from the buffer's first element -
      atan2(y[0], x) or atan2(y, x[0]) - instead of the element-wise
      result (Atan2Analysis.swift, the scalar branches). Buffer-with-
      buffer and value-with-value agree with Android.
  summary: >-
    Mixing a fixed value with a multi-element buffer in atan2 yields the
    full element-wise result on Android but a single value computed from
    the buffer's first element on iOS. The documentation describes the
    Android behavior. Found 2026-08-24 while pinning the module semantics
    for the analysis golden vectors; the vectors pin only the agreeing
    input shapes until this is ruled.

- id: static-buffer-lifecycle
  title: Static buffers and the modules that write them
  area: file-format
  status: decided
  canonical: >-
    Decided 2026-08-24: a module whose outputs are all static executes a
    single time and is skipped afterwards - that saving is the point of
    the attribute - and the user's clear-data action resets static
    buffers to their init values and re-arms the module; static data
    does not survive a user clear. Consequence of the skip, accepted and
    documented at the static attribute: from the second cycle on the
    skipped module no longer clears its keep=false input buffers; both
    platforms must behave identically here. Android conforms on both
    points; iOS changes (run-every-cycle, and written static buffers
    surviving user clear).
  affects:
    android: >-
      A module whose outputs are all static is SKIPPED entirely from its
      second execution on (AnalysisModule.isStatic / the executed flag,
      Analysis.java), so it also stops clearing its keep=false input
      buffers. Static outputs are locked by markSet() after the module
      runs, even if it wrote nothing. The user's "clear data" resets
      static buffers to their init values and re-arms the skipped
      modules.
    ios: >-
      The module runs every cycle - the static buffers simply drop the
      writes - so its keep=false inputs keep being cleared each cycle.
      A static buffer locks on its first actual write (the written flag,
      DataBuffer.swift), and once written, every clear including the
      user's "clear data" is a no-op: static data survives a user clear
      on iOS only.
  summary: >-
    Three related differences in how static data containers behave over
    an experiment's life: whether the writing module keeps executing (and
    consuming its inputs), whether an empty write locks the buffer, and
    whether the user's clear-data action resets static buffers. Invisible
    in a single analysis pass; visible in input-buffer state from the
    second cycle on and after a user clear. Found 2026-08-24 in the
    execution-model comparison for the analysis golden vectors, which
    avoid static buffers until this is ruled.

- id: requirefill-first-run
  title: requireFill on the first analysis run
  area: file-format
  status: decided
  canonical: >-
    The first run after opening or starting is exempt from the
    requireFill gate (decided 2026-08-24): the initialization pass must
    run while the required container is still empty, or most setups
    using requireFill would never initialize. Android conforms; iOS
    changes.
  affects:
    android: >-
      The requireFill gate is only applied when a previous run has
      happened (lastAnalysis != 0, PhyphoxExperiment.java,
      processAnalysis) - the first run after opening or starting always
      executes, so cycle 0 can initialize buffers even though the
      required container is still empty.
    ios: >-
      requireFill is checked on every run including cycle 0
      (ExperimentAnalysis.swift, update()), so an experiment whose
      initialization depends on the pre-start run never runs it until
      the required container fills.
  summary: >-
    An analysis block with requireFill runs its first cycle
    unconditionally on Android but not on iOS. An experiment that relies
    on the cycle-0 pre-run to seed buffers while waiting for sensor data
    behaves differently until the required container fills. Found
    2026-08-24 in the execution-model comparison for the analysis golden
    vectors (which do not use requireFill).
