# Known inconsistencies between the phyphox implementations.
#
# One entry per divergence. Each entry renders in two places from this single
# source: an inline warning wherever the affected page writes the marker
#
#     {{inconsistency:<id>}}
#
# and a row in the generated "Known inconsistencies" page. See tools/hooks.py.
#
# Fields
#   id         short slug, used in the marker. Required.
#   title      one line, shown as the admonition heading. Required.
#   area       file-format | remote-interface | editor. Required.
#   status     open      - nobody has decided which behaviour is correct yet
#              decided   - canonical behaviour chosen, implementations not yet fixed
#              There is no "fixed" status: once every implementation agrees,
#              delete the entry (and its markers and spec references) in the
#              same commit as the fix. Readers learn about corrected behaviour
#              from the release changelog; a lingering "recently corrected"
#              note only clutters the documentation.
#   canonical  what the correct behaviour is. Required once status is decided.
#   affects    map of implementation -> observed behaviour. Use the keys
#              android, ios, editor, arduino, micropython, wiki.
#   since      optional: format version or app version the divergence appeared in
#   issue      optional: URL of the tracking issue
#   verified   optional: when and against which builds the divergence was
#              actually observed on hardware, as opposed to read out of the
#              source. Absence means nobody has checked on a device.
#   summary    reader-facing explanation, one short paragraph. Required.
#
# Keep entries factual and cite where the behaviour was observed, so the next
# person can re-check it rather than trusting this file.

- id: meta-sensors
  title: Sensor metadata in /meta
  area: remote-interface
  status: decided
  canonical: >-
    Android-only, by platform limitation rather than by choice. iOS offers no API
    for per-sensor information such as model or manufacturer, so the values cannot be
    supplied there. The sensors object is therefore simply absent on iOS rather
    than present and empty.
  affects:
    android: >-
      Adds a "sensors" object with one entry per sensor, each carrying name,
      vendor, range, resolution, minDelay, maxDelay, power and version
      (RemoteServer.java, handleMeta()).
    ios: >-
      Serves only the non-sensor metadata; no "sensors" key
      (ExperimentWebServer.swift, "for metadata in Metadata.allNonSensorCases").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    Android reports per-sensor metadata over /meta and iOS does not, even though
    iOS models the same values (Metadata.sensor) and serves them to network
    connections. A client cannot tell a phone without the data from a phone that
    does not report it.

- id: fft-non-power-of-two-input
  title: FFT output for input lengths that are not a power of two
  area: file-format
  status: decided
  canonical: >-
    The fft module guarantees consistent output across platforms only for a
    power-of-two number of input samples, and this is by design and permanent: fft
    is meant to use the fastest available transform on each platform, which
    constrains the supported lengths. For a power-of-two length both platforms
    compute the same unpadded transform and the results are identical (together with
    the unified real-input handling, which returns the full spectrum on both
    platforms). For any other length the output is
    implementation-defined - the platforms diverge in both length and values - and
    an experiment that needs a portable FFT must feed fft a power-of-two number of
    samples. General-purpose, arbitrary-length transforms are not going to be added
    to fft; instead a separate dft analysis module is planned that computes an exact
    input-length DFT consistently on both platforms at the cost of speed. Until dft
    exists, non-power-of-two input to fft is simply outside the guaranteed contract.
  affects:
    android: >-
      Uses FFTW, which transforms an arbitrary length directly (mixed-radix, and
      Bluestein for primes), so the native path computes a true input-length DFT
      with no padding and outputs that many points (analysis.cpp, fftw3complex ->
      fftwf_plan_dft_1d(n, ...)). The pure-Java fallback instead zero-pads to the
      next power of two for the calculation but then truncates the output back to
      the input length (Analysis.java, fftAM). Either way the output length equals
      the input length.
    ios: >-
      Uses Apple's vDSP_DFT, whose setup only accepts lengths of the form f*2^n with
      f in {1, 3, 5, 15}. A non-power-of-two input is therefore zero-padded up to the
      nearest such length (nextFFTSize) and the transform is computed and returned at
      that padded length, so the output is longer than the input and is a
      zero-padded, interpolated spectrum rather than a true input-length DFT
      (FFTAnalysis.swift). For a power-of-two input no padding happens and the result
      matches Android.
  summary: >-
    The two platforms use different FFT libraries with different length constraints:
    FFTW on Android transforms any length directly, while iOS's vDSP_DFT only
    supports lengths of the form f*2^n and so zero-pads other lengths up to the
    nearest supported size. As a result a non-power-of-two number of input samples
    yields a different output length and different values on the two platforms,
    while a power-of-two number of samples is identical on both. This is the intended
    contract for fft: power-of-two input is portable, the module stays as fast as the
    platform allows, and other lengths are left undefined. A separate general-purpose
    dft module (slower, exact input length, consistent across platforms) is planned
    for callers that need non-power-of-two transforms.

- id: translation-link-matching
  title: How translated links map onto the base links
  area: file-format
  status: decided
  canonical: >-
    Decided 2026-08-17, applying retroactively within file format 1.20 (still
    in beta) - no version branching. The label attribute is required on every
    link and acts as a key: matching is an exact, case-sensitive string
    comparison without trimming, and duplicate labels - among the links at the
    root, or within one translation block - are an error that prevents
    loading. A link element inside the applied translation block replaces the
    base link carrying the same label, in its original position; a link whose
    label matches no base link is an additional link, appended after the base
    links in declaration order (a translation that wants a different order
    removes all base links and declares its own). The new optional attribute
    "translation" holds the localised button text: the displayed text is the
    translation attribute if present, otherwise the label as written - link
    labels are never passed through the string-translation mechanism, which
    also removes the [[...]] common-string expansion iOS currently applies to
    them. The URL is the element's text content; empty after trimming counts
    as omitted. An omitted URL on a matched link keeps the base link's URL; an
    omitted URL on an unmatched label is an error that prevents loading (which
    also catches label typos in removals). A translated link that carries no
    attribute other than label and has an omitted URL removes the matched base
    link. highlight is observed wherever explicitly set; when absent, a
    replacement inherits the base link's highlight state and an added link is
    not highlighted. At the root, the translation attribute is not allowed and
    the URL must not be empty; both are errors that prevent loading.
  affects:
    android: >-
      Base links and translated links land in the same label-to-URL map
      (PhyphoxFile.java, phyphoxBlockParser and translationBlockParser, both
      "experiment.links.put(label, link)"), so a translated link whose label
      matches no base link is added as an additional button - as decided -
      but labels are displayed raw (Experiment.java, "btn.setText(label)" and
      "link.setTitle((String)entry.getKey())") with no way to localise the
      button text, the translation attribute is not implemented, an omitted
      URL produces a dead button instead of inheriting or removing, label is
      not required, duplicates are silently collapsed (last wins), and
      highlight on a translated link updates a separate map, so a translated
      link that does not repeat highlight="true" leaves the menu entry of a
      highlighted base link pointing at the untranslated URL.
    ios: >-
      Only the base links are ever displayed. The localised list is built by
      mapping over the base links (Experiment.swift, localizedLinks): a
      translated link whose label matches no base link is silently dropped,
      the button text is localised by passing the base label through the
      string-translation mechanism (localizeString) including the [[...]]
      common-string expansion - both removed by the decision - the
      translation attribute is not implemented, an omitted URL does not
      remove a link, label is not required, duplicates within a translation
      block are collapsed (first wins, TranslationsElementHandler), and
      highlight on a translated link is ignored entirely.
  summary: >-
    Both platforms agree on the core: a link element inside the applied
    translation block replaces the URL of the base link that carries exactly
    the same label, so a translation only has to declare the links it
    changes. Everything around that core diverges today - an unmatched label
    becomes an extra button on Android and disappears on iOS, the button text
    is localised through the string mechanism on iOS but is not localisable
    at all on Android, and the highlight attribute on a translated link is
    honoured (with a stale-URL quirk for the menu entry) on Android and
    ignored on iOS. The decided behaviour makes the label a required, unique
    key, adds a translation attribute for the localised button text, lets an
    omitted URL inherit the base link's URL, and defines a label-only link as
    removing the base link.

- id: translation-block-selection
  title: Which translation blocks apply
  area: file-format
  status: decided
  canonical: >-
    Exactly one translation block applies: the one whose locale best matches
    the user's locale, with the base strings of the file used where no block
    matches better. Translation blocks are never combined - the entries of a
    non-selected block have no effect whatsoever.
  affects:
    android: >-
      Applies every translation block that rates strictly better than the
      blocks applied before it, cumulatively in document order
      (PhyphoxFile.java, static languageRating initialised from the root
      locale attribute, translationsBlockParser, "thisLaguageRating >
      languageRating"). On a German device a file declaring locale="en"
      before locale="de" gets both blocks applied: strings and links from
      the en block that the de block does not override remain active.
    ios: >-
      Scores all blocks and selects a single best match
      (ExperimentTranslationCollection.init, selectedTranslation); only that
      block's entries are consulted.
  summary: >-
    Android merges translation blocks - each block that matches the user's
    locale better than the blocks before it is applied on top of them -
    while iOS applies exactly one, the best match. A file whose translation
    blocks are not disjoint can therefore show a mixture of languages on
    Android that iOS never shows, depending on the order of the blocks in
    the file.
