# Known inconsistencies between the phyphox implementations.
#
# One entry per divergence. Each entry renders in two places from this single
# source: an inline warning wherever the affected page writes the marker
#
#     {{inconsistency:<id>}}
#
# and a row in the generated "Known inconsistencies" page. See tools/hooks.py.
#
# Fields
#   id         short slug, used in the marker. Required.
#   title      one line, shown as the admonition heading. Required.
#   area       file-format | remote-interface | editor. Required.
#   status     open      - nobody has decided which behavior is correct yet
#              decided   - canonical behavior chosen, implementations not yet fixed
#              There is no "fixed" status: once every implementation agrees,
#              delete the entry (and its markers and spec references) in the
#              same commit as the fix. Readers learn about corrected behavior
#              from the release changelog; a lingering "recently corrected"
#              note only clutters the documentation.
#   canonical  what the correct behavior is. Required once status is decided.
#   affects    map of implementation -> observed behavior. Use the keys
#              android, ios, editor, arduino, micropython, wiki.
#   since      optional: format version or app version the divergence appeared in
#   issue      optional: URL of the tracking issue
#   verified   optional: when and against which builds the divergence was
#              actually observed on hardware, as opposed to read out of the
#              source. Absence means nobody has checked on a device.
#   summary    reader-facing explanation, one short paragraph. Required.
#
# Keep entries factual and cite where the behavior was observed, so the next
# person can re-check it rather than trusting this file.

- id: meta-sensors
  title: Sensor metadata in /meta
  area: remote-interface
  status: decided
  canonical: >-
    Android-only, by platform limitation rather than by choice. iOS offers no API
    for per-sensor information such as model or manufacturer, so the values cannot be
    supplied there. The sensors object is therefore simply absent on iOS rather
    than present and empty.
  affects:
    android: >-
      Adds a "sensors" object with one entry per sensor, each carrying name,
      vendor, range, resolution, minDelay, maxDelay, power and version
      (RemoteServer.java, handleMeta()).
    ios: >-
      Serves only the non-sensor metadata; no "sensors" key
      (ExperimentWebServer.swift, "for metadata in Metadata.allNonSensorCases").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    Android reports per-sensor metadata over /meta and iOS does not, even though
    iOS models the same values (Metadata.sensor) and serves them to network
    connections. A client cannot tell a phone without the data from a phone that
    does not report it.

- id: fft-non-power-of-two-input
  title: FFT output for input lengths that are not a power of two
  area: file-format
  status: decided
  canonical: >-
    The fft module guarantees consistent output across platforms only for a
    power-of-two number of input samples, and this is by design and permanent: fft
    is meant to use the fastest available transform on each platform, which
    constrains the supported lengths. For a power-of-two length both platforms
    compute the same unpadded transform and the results are identical (together with
    the unified real-input handling, which returns the full spectrum on both
    platforms). For any other length the output is
    implementation-defined - the platforms diverge in both length and values - and
    an experiment that needs a portable FFT must feed fft a power-of-two number of
    samples. General-purpose, arbitrary-length transforms are not going to be added
    to fft; instead a separate dft analysis module is planned that computes an exact
    input-length DFT consistently on both platforms at the cost of speed. Until dft
    exists, non-power-of-two input to fft is simply outside the guaranteed contract.
  affects:
    android: >-
      Uses FFTW, which transforms an arbitrary length directly (mixed-radix, and
      Bluestein for primes), so the native path computes a true input-length DFT
      with no padding and outputs that many points (analysis.cpp, fftw3complex ->
      fftwf_plan_dft_1d(n, ...)). The pure-Java fallback instead zero-pads to the
      next power of two for the calculation but then truncates the output back to
      the input length (Analysis.java, fftAM). Either way the output length equals
      the input length.
    ios: >-
      Uses Apple's vDSP_DFT, whose setup only accepts lengths of the form f*2^n with
      f in {1, 3, 5, 15}. A non-power-of-two input is therefore zero-padded up to the
      nearest such length (nextFFTSize) and the transform is computed and returned at
      that padded length, so the output is longer than the input and is a
      zero-padded, interpolated spectrum rather than a true input-length DFT
      (FFTAnalysis.swift). For a power-of-two input no padding happens and the result
      matches Android.
  summary: >-
    The two platforms use different FFT libraries with different length constraints:
    FFTW on Android transforms any length directly, while iOS's vDSP_DFT only
    supports lengths of the form f*2^n and so zero-pads other lengths up to the
    nearest supported size. As a result a non-power-of-two number of input samples
    yields a different output length and different values on the two platforms,
    while a power-of-two number of samples is identical on both. This is the intended
    contract for fft: power-of-two input is portable, the module stays as fast as the
    platform allows, and other lengths are left undefined. A separate general-purpose
    dft module (slower, exact input length, consistent across platforms) is planned
    for callers that need non-power-of-two transforms.


# ---------------------------------------------------------------------------
# Entries below stem from the 2026-08-19 audit of all 54 analysis modules
# (spec + prose vs. Analysis.java/PhyphoxFile.java and Modules/*.swift on the
# development branches). Grouped by the decision each entry needs, not one
# entry per symptom.

- id: analysis-nonfinite-parameter-crashes
  title: Non-finite or negative single-value parameters crash iOS
  area: file-format
  status: decided
  canonical: >-
    Analysis modules never crash. The scheme: an absent optional input falls
    back to its documented default; a present but invalid parameter value
    produces the module's error state - NaN when a single value is expected,
    an empty output when a list is expected. Non-finite values that are
    mathematically meaningful, such as an infinite threshold or bound,
    participate in comparisons normally and are not errors. iOS replaces its
    unguarded Int()/UInt() conversions; Android's blanket NaN-to-0 casts
    change where they fabricate plausible parameters (a NaN movingaverage
    width no longer acts as width 0). Settled residual cases (2026-08-19):
    eventstream's index/skip/last inputs are the module's own state loop, not
    user parameters - they keep their documented start defaults (0/0/NaN)
    when empty, and only the iOS conversion traps are fixed; NaN threshold
    values participate in comparisons (see threshold-nan-handling and
    max-min-degenerate-inputs); a NaN const value is a permitted deliberate
    NaN-fill (see const-ramp-length-handling).
  decided: 2026-08-19
  affects:
    android: >-
      Sanitizes throughout: Double.intValue() turns NaN into 0 and clamps
      infinities (movingaverage width, eventstream distance/index/skip,
      split index/overlap), explicit NaN guards default binning's x0/dx,
      and a negative const/ramp length falls back to the output buffer size
      (Analysis.java, the respective modules).
    ios: >-
      Uses unguarded Int(Double) conversions, which trap: a NaN or infinite
      value reaching Int() crashes the app in BinningAnalysis.swift (bin
      index from NaN x0/dx in the buffer), MovingAverageAnalysis.swift
      (width; a negative width also traps in the reversed range),
      SplitAnalysis.swift (index/overlap), EventStreamAnalysis.swift
      (distance/index/skip) and ConstGeneratorAnalysis.swift (length; a
      negative length traps in Array(repeating:count:), also in
      RampGeneratorAnalysis.swift). The guarded getSingleValueAsInt() exists
      in ExperimentAnalysisDataIO.swift but is not used in these places.
      Fully conforms to the canonical behaviour on the development branch
      since 2026-08-19 (binning, movingaverage, split, eventstream and
      const/ramp all guarded); only Android remains.
  summary: >-
    Where a single-value parameter (width, length, index, distance, ...)
    carries NaN, an infinity or - for lengths - a negative value, Android
    degrades gracefully while iOS crashes with an unguarded integer
    conversion or array construction.

- id: power-native-empty-input
  title: "power: empty input buffer on Android's native path"
  area: file-format
  status: decided
  canonical: >-
    Any empty input yields an empty output, as documented. Android's native
    path must stop substituting default operands.
  decided: 2026-08-19
  affects:
    android: >-
      The shipping native path (analysis.cpp, nativePower) initializes
      base=0, exponent=1 and loops to max(n,m): an empty base yields
      pow(0, e_i) per exponent value, an empty exponent copies the base
      through. Android's own Java fallback (used only if the .so fails to
      load) outputs nothing, like iOS.
    ios: >-
      Any empty input produces an empty output
      (ExperimentComplexUpdateValueAnalysis, emptyVector).
  summary: >-
    The documented rule that any empty input yields an empty output is
    violated by the Android build everyone actually runs - power emits
    values computed with a default operand instead.

- id: crosscorrelation-normalization
  title: "crosscorrelation: normalization and empty inputs"
  area: file-format
  status: decided
  canonical: >-
    No normalization: raw correlation sums, matching the default of
    numpy.correlate, scipy.signal.correlate and MATLAB xcorr (researched
    2026-08-19). Both current normalizations disappear, which also removes
    the Android-internal native/fallback disagreement. An empty input yields
    an empty output on both. The Android native FFT path must additionally
    be verified against the plain-sum reference on real hardware before this
    entry is closed.
  decided: 2026-08-19
  affects:
    android: >-
      The shipping native path normalizes by 1/(2*(m+n)) in single
      precision: the Java side passes size = 2*(sizeA+sizeB) and appends the
      inverse-FFT result unscaled beyond the 1/n^2 spectral division
      (Analysis.java crosscorrelationAM native branch, analysis.cpp
      fftw3crosscorrelation). The Java fallback divides each sum by
      abs(m-n) in double precision, like iOS. Empty inputs output nothing
      on either Android path.
    ios: >-
      Divides by abs(m-n) in double precision
      (CrosscorrelationAnalysis.swift, vDSP_vsdivD by compRange). With one
      empty input it appends that many zeros instead of nothing (vDSP_convD
      with a zero-length filter). Fully conforms to the canonical behaviour
      on the development branch since 2026-08-19, with the vDSP result
      verified elementwise against a plain-sum reference in the unit tests;
      only Android remains.
  summary: >-
    The output scale differs between the Android build users run and iOS
    (factor 2(m+n)/abs(m-n)), Android's two code paths disagree with each
    other, and an empty input yields nothing on Android but zeros on iOS.
    The docs specify no normalization at all.

- id: fft-imaginary-input-length
  title: "fft: imaginary input shorter than the real input"
  area: file-format
  status: decided
  canonical: >-
    A provided im input truncates the transform to the shorter of re and im,
    matching similar multi-input functions; only an absent im input is zero-
    filled to re's length. Android's zero-padding of a shorter im changes.
  decided: 2026-08-19
  affects:
    android: >-
      Takes the length from the real input and zero-pads the imaginary part
      (fftAM, both native and fallback paths).
    ios: >-
      Truncates to the shorter of the two inputs (FFTAnalysis.swift,
      bufferCount = min) - different output length and values.
  summary: >-
    With im shorter than re, Android pads and iOS truncates. Not covered by
    the fft-non-power-of-two-input entry, which is about the length of a
    single input.

- id: formula-parse-divergences
  title: "formula: missing attribute, positive exponents, malformed expressions"
  area: file-format
  status: decided
  canonical: >-
    A missing formula attribute rejects the file (as on Android); scientific
    notation with an explicit positive exponent such as 1e+5 is accepted (as
    on iOS); and structurally broken formulas - wrong arity, dangling
    operands - reject the file at load on both platforms, since that is a
    permanent failure state.
  decided: 2026-08-19
  affects:
    android: >-
      A missing formula attribute rejects the file ("Formula module needs a
      formula", PhyphoxFile.java); scientific notation with an explicit
      positive exponent (1e+5) rejects the file (FormulaParser.java treats
      the + as an operator); a structurally broken term (min(5), 5+) loads
      and produces an empty output at runtime (swallowed
      NullPointerException).
    ios: >-
      A missing attribute is accepted and the module silently outputs
      nothing (FormulaAnalysis.swift, ?? ""); 1e+5 parses as 100000
      (FormulaParser.swift checks the preceding character); a broken term
      loads and produces NaN per element (missing operands evaluate to NaN).
      Fully conforms to the canonical behaviour on the development branch
      since 2026-08-20 (missing/empty formula and broken terms reject at
      load); only Android remains.
  summary: >-
    The two formula parsers disagree on what loads and on what a broken
    expression produces. The function list, precedence, left-associativity
    (including ^), the loose-binding unary minus and the [n]/[n_]
    semantics were verified identical.

- id: formula-round-semantics
  title: "formula: round() tie-breaking and NaN"
  area: file-format
  status: decided
  canonical: >-
    C rounding on both platforms: half away from zero, NaN stays NaN.
    Android's Math.round semantics change.
  decided: 2026-08-19
  affects:
    android: >-
      Java Math.round - half toward positive infinity (round(-2.5) = -2)
      and round(NaN) = 0 (FormulaParser.java).
    ios: >-
      C round - half away from zero (round(-2.5) = -3) and round(NaN) = NaN
      (FormulaParser.swift).
  summary: >-
    The formula language's round() differs at .5 ties for negative values
    and for NaN. (This is the formula function; the round analysis module's
    own divergence is round-nonfinite.)

