# Known inconsistencies between the phyphox implementations.
#
# One entry per divergence. Each entry renders in two places from this single
# source: an inline warning wherever the affected page writes the marker
#
#     {{inconsistency:<id>}}
#
# and a row in the generated "Known inconsistencies" page. See tools/hooks.py.
#
# Fields
#   id         short slug, used in the marker. Required.
#   title      one line, shown as the admonition heading. Required.
#   area       file-format | remote-interface | editor. Required.
#   status     open      - nobody has decided which behavior is correct yet
#              decided   - canonical behavior chosen, implementations not yet fixed
#              There is no "fixed" status: once every implementation agrees,
#              delete the entry (and its markers and spec references) in the
#              same commit as the fix. Readers learn about corrected behavior
#              from the release changelog; a lingering "recently corrected"
#              note only clutters the documentation.
#   canonical  what the correct behavior is. Required once status is decided.
#   affects    map of implementation -> observed behavior. Use the keys
#              android, ios, editor, arduino, micropython, wiki.
#   since      optional: format version or app version the divergence appeared in
#   issue      optional: URL of the tracking issue
#   verified   optional: when and against which builds the divergence was
#              actually observed on hardware, as opposed to read out of the
#              source. Absence means nobody has checked on a device.
#   summary    reader-facing explanation, one short paragraph. Required.
#
# Keep entries factual and cite where the behavior was observed, so the next
# person can re-check it rather than trusting this file.

- id: meta-sensors
  title: Sensor metadata in /meta
  area: remote-interface
  status: decided
  permanent: true
  canonical: >-
    Android-only, by platform limitation rather than by choice. iOS offers no API
    for per-sensor information such as model or manufacturer, so the values cannot be
    supplied there. The sensors object is therefore simply absent on iOS rather
    than present and empty.
  affects:
    android: >-
      Adds a "sensors" object with one entry per sensor, each carrying name,
      vendor, range, resolution, minDelay, maxDelay, power and version
      (RemoteServer.java, handleMeta()).
    ios: >-
      Serves only the non-sensor metadata; no "sensors" key
      (ExperimentWebServer.swift, "for metadata in Metadata.allNonSensorCases").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    Android reports per-sensor metadata over /meta and iOS does not, even though
    iOS models the same values (Metadata.sensor) and serves them to network
    connections. A client cannot tell a phone without the data from a phone that
    does not report it.

- id: fft-non-power-of-two-input
  title: FFT output for input lengths that are not a power of two
  area: file-format
  status: decided
  permanent: true
  canonical: >-
    fft uses the fastest transform each platform offers, so only a
    power-of-two number of input samples is guaranteed to give identical
    results on both platforms - an experiment that needs a portable FFT must
    provide that. Any other length is
    implementation-defined. For exact transforms of arbitrary length a
    separate, slower dft module is planned; until it exists, non-power-of-two
    input is simply outside the guaranteed contract.
  affects:
    android: >-
      FFTW transforms the input length directly, and the Java fallback
      zero-pads internally but truncates back, so the output length always
      equals the input length (analysis.cpp fftw3complex, Analysis.java
      fftAM).
    ios: >-
      vDSP_DFT only accepts lengths of the form f*2^n with f in {1, 3, 5,
      15}, so other inputs are zero-padded to the next supported length and
      the padded, longer spectrum is returned (FFTAnalysis.swift,
      nextFFTSize).
  summary: >-
    A non-power-of-two number of input samples yields a different output
    length and different values on the two platforms; a power-of-two input
    gives identical results on both.

# ---------------------------------------------------------------------------
# Entries below stem from the 2026-08-19 audit of all 54 analysis modules
# (spec + prose vs. Analysis.java/PhyphoxFile.java and Modules/*.swift on the
# development branches). Grouped by the decision each entry needs, not one
# entry per symptom.


- id: network-privacy-missing-url
  title: "network connection: missing privacy attribute and the policy dialog"
  area: file-format
  status: decided
  canonical: >-
    privacy stays optional at parse time - a connection without it loads and
    runs. The data-policy dialog offers the "visit privacy policy" button
    only when a URL is actually present; with the attribute absent the
    button is simply not shown, and nothing crashes (ruled 2026-08-20).
    Providing a policy URL remains strongly recommended whenever personal
    or sensor data leaves the device.
  decided: 2026-08-20
  affects:
    android: >-
      The privacy attribute is optional at parse time (PhyphoxFile.java,
      getStringAttribute). The data-policy dialog always shows the "visit
      privacy policy" button; with the attribute absent, tapping it calls
      Uri.parse(null) and crashes the app
      (NetworkConnection.java, getDataPolicyDialog).
    ios: >-
      Also optional at parse time (NetworkElementHandler.swift,
      optionalString). The dialog equally always shows the button; tapping it
      with no URL is a silent no-op (NetworkConnection.swift,
      "URL(string: self.privacyURL ?? \"\")" is nil).
  summary: >-
    privacy is optional and neither parser enforces it - a connection
    without it loads and runs on both platforms. The always-present "visit
    privacy policy" button then crashes Android and does nothing on iOS;
    both change to showing the button only when a URL is present.

# Entries below stem from the 2026-08-20 deep-dive into multi-dataset graphs
# (several inputs with the same axis in one graph element), maintainer-
# requested: the pairing logic had never been audited.

- id: graph-input-axis-required
  title: "graph: input without an axis attribute"
  area: file-format
  status: decided
  canonical: >-
    The axis attribute is required on every graph input - anything else
    leads to chaos in this complicated setup (ruled 2026-08-20). Android
    adds the requirement; iOS already conforms.
  decided: 2026-08-20
  affects:
    android: >-
      The axis attribute is optional and an unnamed input becomes a y
      dataset (PhyphoxFile.java, graph inputMapping: slot y has asRequired =
      false).
    ios: >-
      The axis attribute is required; an input without it rejects the file
      (GraphViewElementHandler.swift, "try attributes.value(for: .axis)").
  summary: >-
    A graph input without axis loads as a y dataset on Android and rejects
    the file on iOS. The spec used to state required: true, which was only
    iOS's view.

- id: graph-multiset-omitted-x
  title: "graph: a later dataset without its own x input"
  area: file-format
  status: decided
  canonical: >-
    A dataset without its own x input inherits the most recent preceding x
    input, as on iOS - so several datasets share one x by naming it once. If
    no x input has preceded the dataset at all, it is plotted against its
    element index, as on Android (ruled 2026-08-20). Each platform adopts
    the other's half.
  decided: 2026-08-20
  affects:
    android: >-
      A dataset group without an x input plots its y values against the
      element index - no inheritance from other datasets (ExpView.java
      graphElement, null dataX; the parser leaves the group's x slot empty).
    ios: >-
      A new dataset starts by inheriting the previous dataset's x buffer
      (GraphViewElementHandler.swift,
      "xInputBufferNames.append(xInputBufferNames[inputCount-1])"), so one
      x input followed by several y inputs plots every y against that x.
  summary: >-
    The natural way to plot several curves over one shared axis - a single
    x input followed by several y inputs - yields different graphs: y
    against the shared x on iOS, y against the sample index on Android.

- id: graph-multiset-input-order
  title: "graph: dataset pairing for input orders other than x,y per set"
  area: file-format
  status: decided
  canonical: >-
    Every y input is one dataset. If the number of x inputs equals the
    number of y inputs (z inputs do not count), the x and y inputs are
    matched 1-on-1 in order of appearance, regardless of interleaving -
    this covers the y-then-x pattern used by several shipped Bluetooth
    experiments. Otherwise each y is plotted against the most recent
    preceding x input, or against its element index if none preceded it,
    and any x input that no y input uses - trailing, or shadowed by a later
    x before any y consumed it - is an error (ruled 2026-08-20, amended
    2026-08-20 with the equal-count case). The two branches never conflict:
    an equal-count file is either the strict x-then-y interleave, where the
    sequential rule pairs identically, or a file the sequential rule would
    reject - so the special case only turns errors into defined pairings.
    Both platforms implement this model; the shipped-experiment validation
    checks it.
  decided: 2026-08-20
  affects:
    android: >-
      Slot-group machinery: each y opens a group and an x attaches to the
      LAST group with a free x slot (ioBlockParser repeatable groups). The
      y,x per-set order works; several y inputs followed by several x
      inputs mispairs - the first x lands in the last y group and the
      remaining x inputs form y-less groups.
    ios: >-
      Sequential state machine: with more than two inputs, every x input
      starts a new dataset, and a dataset left without a y rejects the file
      (GraphViewElementHandler.swift, "missingChildElement(input[axis=y])").
      The y,x per-set order therefore rejects the file once there is more
      than one dataset, as does y inputs followed by x inputs.
  summary: >-
    Only the interleaved order - x input directly before its y input, per
    dataset - is paired identically on both platforms. Other orders load
    with different pairings on Android and often reject the file on iOS.

- id: graph-input-mapwidth
  title: "graph: per-dataset mapWidth on input tags"
  area: file-format
  status: decided
  canonical: >-
    mapWidth is a graph-level attribute only and is not read from input
    tags: map plots cannot be combined with other graph types and multiple
    map plots make no sense, so a per-dataset row length has no use (ruled
    2026-08-20). Android drops the per-input reading; the attribute is
    removed from the input tag's documented surface.
  decided: 2026-08-20
  affects:
    android: >-
      Reads mapWidth from individual input tags, overriding the graph-level
      attribute per dataset (PhyphoxFile.java, the AdditionalTag loop,
      "mapwidth").
    ios: >-
      Only the graph-level mapWidth attribute exists; on an input tag the
      attribute is silently ignored like any unknown attribute
      (GraphViewElementHandler.swift, input Attribute enum: axis, color,
      lineWidth, style).
  summary: >-
    A per-dataset mapWidth is honored on Android and silently ignored on
    iOS.

- id: graph-input-attribute-case
  title: "graph: attribute-name case on input tags"
  area: file-format
  status: decided
  canonical: >-
    Attribute names are matched exactly, on input tags like everywhere else
    in the format (ruled 2026-08-20) - Android's lowercasing of the
    per-input attribute names was the single case-insensitive exception in
    either codebase and is dropped. A lowercase linewidth on an input tag
    then joins the silently-ignored unknown attributes, as it always has on
    iOS and as it does on the graph element itself on both platforms.
  decided: 2026-08-20
  affects:
    android: >-
      The per-input attributes are collected with lowercased names
      (ioBlockParser, AdditionalTag), so lineWidth, linewidth or LINEWIDTH
      all work on an input tag.
    ios: >-
      Attribute names are matched exactly; only lineWidth works, and
      linewidth is silently ignored (GraphViewElementHandler.swift).
  summary: >-
    Attribute names on graph input tags are matched case-insensitively on
    Android and case-sensitively on iOS. Only lineWidth is affected in
    practice - the other per-input attributes are single lowercase words.
