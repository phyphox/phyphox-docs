# Known inconsistencies between the phyphox implementations.
#
# One entry per divergence. Each entry renders in two places from this single
# source: an inline warning wherever the affected page writes the marker
#
#     {{inconsistency:<id>}}
#
# and a row in the generated "Known inconsistencies" page. See tools/hooks.py.
#
# Fields
#   id         short slug, used in the marker. Required.
#   title      one line, shown as the admonition heading. Required.
#   area       file-format | remote-interface | editor. Required.
#   status     open      - nobody has decided which behavior is correct yet
#              decided   - canonical behavior chosen, implementations not yet fixed
#              There is no "fixed" status: once every implementation agrees,
#              delete the entry (and its markers and spec references) in the
#              same commit as the fix. Readers learn about corrected behavior
#              from the release changelog; a lingering "recently corrected"
#              note only clutters the documentation.
#   canonical  what the correct behavior is. Required once status is decided.
#   affects    map of implementation -> observed behavior. Use the keys
#              android, ios, editor, arduino, micropython, wiki.
#   since      optional: format version or app version the divergence appeared in
#   issue      optional: URL of the tracking issue
#   verified   optional: when and against which builds the divergence was
#              actually observed on hardware, as opposed to read out of the
#              source. Absence means nobody has checked on a device.
#   summary    reader-facing explanation, one short paragraph. Required.
#
# Keep entries factual and cite where the behavior was observed, so the next
# person can re-check it rather than trusting this file.

- id: meta-sensors
  title: Sensor metadata in /meta
  area: remote-interface
  status: decided
  permanent: true
  canonical: >-
    Android-only, by platform limitation rather than by choice. iOS offers no API
    for per-sensor information such as model or manufacturer, so the values cannot be
    supplied there. The sensors object is therefore simply absent on iOS rather
    than present and empty.
  affects:
    android: >-
      Adds a "sensors" object with one entry per sensor, each carrying name,
      vendor, range, resolution, minDelay, maxDelay, power and version
      (RemoteServer.java, handleMeta()).
    ios: >-
      Serves only the non-sensor metadata; no "sensors" key
      (ExperimentWebServer.swift, "for metadata in Metadata.allNonSensorCases").
  verified: >-
    Confirmed on hardware 2026-08-02: Android 1.2.1-beta2 (build 1020102,
    Pixel 9 Pro, from development) against iOS 1.2.0 (build 17272,
    iPhone15,2, App Store build). The iOS WebServer sources are identical
    on master and development, so the store build behaves as the
    development branch here.
  summary: >-
    Android reports per-sensor metadata over /meta and iOS does not, even though
    iOS models the same values (Metadata.sensor) and serves them to network
    connections. A client cannot tell a phone without the data from a phone that
    does not report it.

- id: fft-non-power-of-two-input
  title: FFT output for input lengths that are not a power of two
  area: file-format
  status: decided
  permanent: true
  canonical: >-
    fft uses the fastest transform each platform offers, so only a
    power-of-two number of input samples is guaranteed to give identical
    results on both platforms - an experiment that needs a portable FFT must
    provide that. Any other length is
    implementation-defined. For exact transforms of arbitrary length a
    separate, slower dft module is planned; until it exists, non-power-of-two
    input is simply outside the guaranteed contract.
  affects:
    android: >-
      FFTW transforms the input length directly, and the Java fallback
      zero-pads internally but truncates back, so the output length always
      equals the input length (analysis.cpp fftw3complex, Analysis.java
      fftAM).
    ios: >-
      vDSP_DFT only accepts lengths of the form f*2^n with f in {1, 3, 5,
      15}, so other inputs are zero-padded to the next supported length and
      the padded, longer spectrum is returned (FFTAnalysis.swift,
      nextFFTSize).
  summary: >-
    A non-power-of-two number of input samples yields a different output
    length and different values on the two platforms; a power-of-two input
    gives identical results on both.

- id: input-defaults-on-hidden-view
  title: Input element defaults on a view that is not displayed
  area: file-format
  status: decided
  canonical: >-
    Android's. An input element writes its default into its buffer when the
    experiment loads, whichever view is on screen. What an experiment computes,
    outputs or sends to a device must not depend on the layout or on which view
    the user happens to be looking at (maintainer, 2026-08-29).
  affects:
    android: >-
      Writes the default into the element's buffer whichever view is on screen.
      In ExpView.java the edit's setValue() sees a buffer holding NaN - nothing
      entered yet - and substitutes defaultValue, and that path runs for the
      experiment's views rather than only the visible one.
    ios: >-
      Writes it only while the element's own view is the one being displayed.
      ExperimentEditView.update() puts the default back when the buffer is
      empty, but it runs from a display link that is only running while the
      module is active, and ExperimentPageViewController marks exactly one view
      collection active at a time. ExperimentDropdownView,
      ExperimentSwitchView and ExperimentSliderView seed their buffers from the
      same gated update(), so this is not specific to edit. Whether the slider
      should seed at all is a separate divergence - see
      slider-default-never-reaches-buffer.
  verified: >-
    2026-08-29, on the BLE bench: micropython/createExperiment, whose graphs are
    on the first view and whose edit is on the second. Buffer CB1 held one value
    (0.0) throughout a ten-second measurement on a Pixel 9 Pro running 1.2.0,
    and was empty on an iPhone 14 Pro on the development build. Found because
    the suite compared the two.
  summary: >-
    An input element writes its default value into its buffer so that analysis and
    outputs have something to work with before the user touches it. On iOS
    that only happens while the edit's own view is on screen, so an experiment
    whose edit sits on a second view starts with an empty buffer there and a
    filled one on Android. It matters wherever something reads that buffer
    without waiting for the user: an analysis input sees NaN instead of the
    default, and in the experiment this was found with, the value feeds a
    bluetooth output that configures the connected device - so the device is
    told nothing until somebody opens the second view. The iOS code intends the
    Android behaviour (its comment says as much); what differs is when it runs.

- id: slider-default-never-reaches-buffer
  title: A slider's default value never reaches its buffer on Android
  area: file-format
  status: open
  affects:
    android: >-
      Never writes it. In ExpView.java the slider's onMayReadFromBuffers
      substitutes defaultValue - minValue for the lower end of a range slider -
      when the buffer holds NaN, but only to position the widget;
      onMayWriteToBuffers returns immediately unless `triggered`, which is set
      only by the slider's own user-interaction listeners. The buffer therefore
      stays empty until somebody moves the slider.
    ios: >-
      Writes it. ExperimentSliderView.update() puts defaultValue into an empty
      buffer, and for a range slider minValue and maxValue into the lower and
      upper buffers. (It does so only while the slider's view is displayed,
      which is the separate divergence input-defaults-on-hidden-view.)
  verified: >-
    2026-08-29, read from both sources rather than measured on a device. Found
    while checking whether the slider shared the edit element's behaviour after
    the maintainer decided input-defaults-on-hidden-view; it does not, and it
    diverges the other way round.
  summary: >-
    Every other input element writes its default into its buffer so that
    analysis has something to work with before the user touches anything. The
    slider does that on iOS and not on Android, where the default only positions
    the widget and the buffer stays empty until the slider is moved. An
    experiment whose analysis reads a slider therefore starts from the default on
    iOS and from NaN on Android. Which is right is a decision about the format
    rather than about either app: an edit seeds, a slider on one platform does
    not, and the two ought to agree.
