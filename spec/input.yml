# The <input> block, modeled completely.
#
# Sources compared for every entry below:
#   Android  PhyphoxFile.java, inputBlockParser        (phyphox-android b4564695)
#   iOS      InputElementHandler.swift                 (phyphox-ios     a0643729)
#   editor   src/blocks/input/*.ts                     (where a block exists)
#   docs     docs/file-format/input.md
#
# `agreement:` records what that comparison found. See README.md. Where an entry
# has since been decided, `rules:` names the rule in rules.yml that settles it -
# so this file states the agreed behavior of the format, not just the fact that
# two apps disagree today.

block: input
since: "1.0"
summary: >-
  Hardware the experiment reads: sensors, the microphone, GPS, the camera and
  Bluetooth devices. Each child element maps components of one source onto
  data containers.

elements:

  # ------------------------------------------------------------------ input --
  - name: input
    parent: phyphox
    since: "1.0"
    summary: Container for all hardware inputs.
    attributes: []
    children: [sensor, audio, location, depth, camera, bluetooth]

  # ----------------------------------------------------------------- sensor --
  - name: sensor
    parent: input
    since: "1.0"
    summary: A sensor built into the device.
    children: [output]
    attributes:
      - name: type
        description: >-
          Defines the sensor type to be used. Note that the somewhat
          cumbersome names for "acceleration with g" and
          "acceleration (without g)" have been chosen to aid
          students in understanding the data given by these sensors,
          while internally the names commonly used on Android are
          kept.
        value_notes:
          accelerometer: >-
            The accelerometer in m/s². This gives the earth's
            acceleration when the device is resting. (Usually
            named "acceleration with g" in phyphox)
          linear_acceleration: >-
            A virtual sensor giving the actual acceleration of the
            device. Should report zero when the device is resting.
            (Usually named "acceleration (without g)" in phyphox)
          gravity: >-
            A virtual sensor giving the gravitational acceleration
            in the frame of reference of the device. This removes
            the device motion from the accelerometer readings and
            should therefore be approximately the difference of
            accelerometer and linear_acceleration. (Depending on
            the implementation on each device.) Available since
            file format 1.15.
          magnetic_field: >-
            Readings from the magnetometer in µT.
          gyroscope: >-
            Readings from the gyroscope in rad/s.
          pressure: >-
            The air pressure from the barometer in hPa.
          light: >-
            The illuminance from the light sensor in lx.
          proximity: >-
            Distance from the proximity sensor in cm (most devices
            only output 0 cm or 5 cm).
          temperature: >-
            Temperature. This is supposed to be ambient
            temperature, but there is some fallback logic to find
            any temperature reading from the device. This usually
            represents the device temperature and cannot be used
            for external temperature measurement. In °C. Available
            since file format 1.7.
          humidity: >-
            Relative humidity in %. Available since file format
            1.7.
          attitude: >-
            The orientation (absolute rotation) of the device as
            calculated by the device's own algorithms. This uses
            TYPE_ROTATION_VECTOR on Android and CMAttitude from
            Core Motion on iOS, which (depending on the device)
            fuses data from the accelerometer, gyroscope and
            magnetometer to calculate the attitude of the device.
            The result is given as a quaternion in a reference
            system with y pointing towards magnetic North and z
            pointing upwards (the Android coordinate system, iOS
            attitude is converted to this system). The x, y and z
            channels correspond to the last three components of
            the quaternion (w, x, y, z) and w can be retrieved
            through the abs channel. Available since file format
            1.9.
          custom: >-
            Use typeFilter and/or nameFilter to use a sensor that
            is not directly supported by phyphox. You can check
            the device info (i menu on the main screen) to see
            which sensors are available on your phone. Phyphox
            will pick the first sensor with a type that matches
            the typeFilter (if set) and a name that contains the
            value of nameFilter (not case-sensitive, only if set).
            Note that not all sensors will work properly with
            phyphox, especially if they do not generate values but
            events or states. Available since file format 1.19.
        type: enum
        required: true
        values: [accelerometer, linear_acceleration, gravity, gyroscope,
                 magnetic_field, pressure, light, proximity, temperature,
                 humidity, attitude, custom]
        summary: Which sensor to read.
        agreement: agreed

      - name: rate
        description: >-
          The rate at which sensor data will be provided in Hz. A
          value of 0.0 means "as fast as possible". Note that the
          maximum rate of a sensor is device-specific and will limit
          the rate that can be achieved.
        type: float
        default: 0.0
        unit: Hz
        summary: >-
          Requested acquisition rate. 0 means as fast as the device delivers.
        agreement: agreed
        note: >-
          Internal detail, not reader-facing: both apps store the reciprocal
          (the acquisition period) rather than the rate, with 0 special-cased
          to stay 0 instead of becoming an infinite period - Android in
          SensorInput.java (period in ns), iOS in InputElementHandler.swift
          (1.0/frequency in s, and its runtime variable is confusingly named
          "rate" although it holds the period). Only relevant when comparing
          spec and source. Verified 2026-08-19.

      - name: rateStrategy
        value_notes:
          auto: >-
            Requests the target sensor rate directly from the
            system like the strategy request. If the actual rate
            provided by the system is more than 10% faster than
            the requested rate, the strategy automatically
            switches to generate, delivering the data points
            exactly at the desired rate. This strategy prevents
            duplicate data points as neither strategy can be
            faster than what the sensor provides, and it picks the
            ideal method to get close to the target rate. However,
            in cases when it has to switch to generate it is
            susceptible to strong sampling effects when the target
            rate is close to the actual sensor rate.
          request: >-
            The target rate set by rate is directly requested from
            the system and the provided sensor data will be
            provided as is. It depends on the system whether the
            provided rate is close to the requested one; the
            system might not be able to provide sensor data at
            given rates or it might decide to provide a different
            rate if the sensor data is shared with other apps.
            This strategy is most likely to yield a rate that
            strongly differs from the expected one, but as it will
            not group or discard data points, it will not
            introduce additional sampling or aliasing effects. For
            the same reason, the average attribute has no effect.
          generate: >-
            The target rate is generated internally by phyphox
            while requesting the highest possible rate from the
            system. It is guaranteed to give data points at the
            rate set by rate and can even exceed the sensor rate
            (be careful not to waste performance with this). While
            the resulting data points seem very easy to interpret
            afterwards and while it makes it easy to synchronize
            different sensors, this strategy can severely degrade
            the recorded sensor data as data points might be
            duplicated or discarded in unforeseen patterns. If the
            target rate is close to the actual internal sensor
            rate, this will very likely introduce additional
            sampling effects like aliasing between the sensor's
            sample rate and this target rate. Therefore, this
            strategy is recommended for educational purposes to
            simplify data analysis, but if you know how to analyze
            data and want the best possible data quality, it is
            highly recommended to use the request strategy
            instead, as you can emulate the generate strategy in
            your data analysis later but you could not go back to
            the quality of request from generate data.
          limit: >-
            The maximum sensor rate is requested from the system
            and the setting of rate is used as a limiter. More
            precisely, phyphox generates a new data point whenever
            the time interval from the last data point to the
            latest sensor event exceeds 1/rate. The resulting rate
            will always be close to but lower than the requested
            rate and the actual rate strongly depends on the
            actual sensor rate. This strategy is a compromise to
            get close to a target rate without the strong
            degradation introduced by the generate strategy, as it
            usually leads to a similar number of sensor events per
            actually generated data point. The downside is that
            the data point rate may be quite different on
            different devices if the target rate is in the range
            of typical sensor rates. Note that this was the only
            rate strategy before file format 1.14, and that this
            is the default behavior if your phyphox file targets
            a file format before 1.14.
        description: >-
          Defines the strategy to achieve the rate set with the
          attribute rate.
        since: "1.14"
        type: enum
        values: [auto, request, generate, limit]
        default:
          - since: "1.14"
            value: auto
          - value: limit
        summary: How to reconcile the requested rate with what the device offers.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

      - name: average
        description: >-
          If set to true, instead of just giving the latest reading
          at the defined rate, the sensor data will be averaged over
          a period of the rate. This only makes sense if a rate is
          set which is lower than the maximum rate the device can
          achieve.
        type: boolean
        default: false
        summary: Average readings between outputs instead of picking one.
        agreement: agreed

      - name: stride
        description: >-
          If stride is set to N, only every Nth data point generated
          by the rateStrategy is used. Other data points are simply
          discarded. A stride of 1 will use every data point, a
          stride of 2 only every second, a stride of 3 only every
          third and so on. This is mostly useful to achieve a very
          specific data rate on a specific device that is an integer
          fraction of the actual sensor rate, in order to avoid
          additional aliasing effects from non-fractional rates.
        since: "1.14"
        type: integer
        default: 1
        summary: Use only every n-th reading.
        agreement: agreed

      - name: ignoreUnavailable
        description: >-
          Allow the user to open and start the experiment even if
          the sensor is not available. You will not receive any data
          for that sensor if it is not available, and your
          experiment should still work and make sense for the user
          if this is the case. Without it, an experiment using a
          sensor the device does not have notifies the user and
          refuses to work.
        since: "1.8"
        type: boolean
        default: false
        summary: >-
          Load the experiment even if the device has no such sensor, instead of
          refusing the file.
        agreement: agreed

      - name: nameFilter
        description: >-
          Selects a specific sensor by name where a device exposes
          several of the same type, used with type="custom". Phyphox
          picks the first sensor whose name contains this value,
          which is not matched case-sensitively.
        since: "1.19"
        type: string
        summary: >-
          Select a specific sensor by name where a device exposes several of the
          same type.
        agreement: platform
        platforms: [android]
        remark: >-
          The attribute has no effect on iOS: CoreMotion offers no equivalent
          choice, so it is ignored there. The file still loads.
        note: >-
          iOS declares the attribute in its handler enum with a comment that it
          is "only part of the file format for Android sensors"
          (InputElementHandler.swift), but the declaration is
          documentation-in-code, not what keeps the file loading: verified
          2026-08-19 that the iOS parser never rejects unknown attributes -
          KeyedAttributeContainer reads known keys and has no completeness
          check; the only unexpectedAttribute throw in the codebase is the
          explicit translation check on root links. Android likewise reads
          attributes by name and cannot reject unknowns. So "accepted and
          ignored" is observable behaviour everywhere, and an earlier version
          of this note wrongly implied the file would otherwise fail to load.
          That both parsers silently ignore unknown attributes (typos
          included) is not recorded as a rule in rules.yml - surfaced to the
          maintainer 2026-08-19.

      - name: typeFilter
        description: >-
          Selects a sensor by Android sensor type constant, used
          with type="custom". Phyphox picks the first sensor whose
          type matches.
        since: "1.19"
        type: integer
        summary: Select a sensor by Android sensor type constant.
        agreement: platform
        platforms: [android]
        note: Same as nameFilter; the value is an Android platform constant.

    outputs:
      attribute: component
      required_component: true
      components:
        - name: x
          summary: >-
            First component.
          description: >-
            First component of the sensor reading. Many sensors
            (accelerometer, magnetometer, gyroscope) are 3D sensors writing
            to x, y and z; 1D sensors such as the barometer and the light
            sensor only fill x. You do not need to attach a data container
            to every output.
        - name: y
          summary: >-
            Second component.
          description: >-
            Second component of a 3D sensor reading.
        - name: z
          summary: >-
            Third component.
          description: >-
            Third component of a 3D sensor reading.
        - name: t
          summary: >-
            Timestamp, seconds since the measurement started.
          description: >-
            Experiment time of the reading, in seconds since the measurement
            started.
        - name: abs
          since: "1.4"
          summary: >-
            Magnitude of the vector.
          description: >-
            The absolute value sqrt(x*x + y*y + z*z) of 3D sensor data. For
            the attitude sensor this is the w component of the quaternion
            instead.
        - name: accuracy
          since: "1.5"
          summary: >-
            Device-reported accuracy, where available.
          description: >-
            Information about the current accuracy. Typically -1 means that
            the sensor is uncalibrated (which might be an error state), 0
            means that uncalibrated raw data is presented (but this is
            expected) and positive values represent accuracy in a way
            specific to the sensor. This is currently only used by the
            magnetometer, which encodes its accuracy as 1 low, 2 medium and
            3 high.
      agreement: agreed
      rules: [output-component-validation]

  # ------------------------------------------------------------------ audio --
  - name: audio
    parent: input
    since: "1.0"
    summary: The microphone.
    children: [output]
    attributes:
      - name: rate
        description: >-
          The recording rate in Hz. This attribute exists for specific
          needs on a specific device: supported recording rates are
          very device specific, so do not change the default of 48 kHz
          in an experiment that targets a wide audience. The platforms
          also enforce a changed rate differently. Android uses the
          requested rate exactly and refuses to load or start the
          experiment if the device does not support it. iOS only
          requests it as a preference and silently records at whatever
          rate the hardware chooses - read the actual rate from the
          rate output and use that for any calculation with a time
          base. On iOS, if the experiment also contains an audio
          output, the output's rate takes precedence and this
          attribute is ignored.
        note: >-
          Verified 2026-08-19. Android: PhyphoxFile.java case "audio"
          (getIntAttribute("rate", 48000), getMinBufferSize failure is
          a load error) and PhyphoxExperiment.java startAllIO (new
          AudioRecord(..., micRate, ...), uninitialized recorder
          throws). iOS: InputElementHandler.swift AudioElementHandler
          (UInt, so a malformed value is a load error where Android
          silently falls back to the default - the family-wide
          lenient/strict pattern, not audio-specific) and
          AudioEngine.swift startEngine (setPreferredSampleRate with
          playbackOut?.sampleRate ?? recordIn?.sampleRate, tap
          installed with the input node's actual hardware format, no
          resampling). Maintainer ruling 2026-08-19: not a divergence -
          the attribute is for device-specific use, the prose just has
          to be clear about the platform behavior.
        type: integer
        default: 48000
        unit: Hz
        summary: Sampling rate.
        agreement: agreed
      - name: append
        description: >-
          Append data to the output data container instead of only
          offering new data since the last analysis cycle.
        since: "1.16"
        type: boolean
        default: false
        summary: Append to the buffer instead of replacing its contents.
        agreement: agreed
    outputs:
      attribute: component
      required_component: false
      components:
        - name: out
          required: true
          summary: >-
            The recorded samples.
          description: >-
            The recorded audio samples. This is the component a tag without
            a component attribute fills.
        - name: rate
          since: "1.6"
          summary: >-
            The rate actually achieved.
          description: >-
            The rate the device actually recorded at. On iOS this is not
            guaranteed to be the rate you requested, since the requested
            rate is only a preference to the system; on Android it always
            matches the request, because an unsupported rate is an error.
            Use this value for any calculation with a time base. It is
            written independently of the recording output - mostly when the
            rate changes, which normally only happens if the audio setup
            changes - so do not clear this data container while reading it.
      agreement: agreed
      rules: [output-component-validation]

  # --------------------------------------------------------------- location --
  - name: location
    parent: input
    since: "1.0"
    summary: GPS.
    description: >-
      Location from satellite navigation (GPS/GNSS). On Android, phyphox
      prefers satellite-based fixes: while a recent GNSS fix is available,
      locations from other providers (Wi-Fi, cell towers) are ignored. iOS
      delivers a single fused location and does not tell apps which source
      produced it, so this filtering is not possible there and Wi-Fi- or
      cell-based locations cannot be separated from GNSS-based ones.
    note: >-
      Android's provider filtering is in GpsInput.onLocationChanged: non-GNSS
      providers are ignored for 10 s after a satellite-based fix. On the iOS
      side re-checked 2026-08-19: Core Location still exposes no per-source
      information beyond CLLocationSourceInformation (iOS 15), which only
      flags simulated and accessory-produced locations - nothing distinguishes
      GNSS from Wi-Fi or cellular, and there is no raw-GNSS or satellite-count
      API either.
    children: [output]
    attributes: []
    outputs:
      attribute: component
      required_component: true
      components:
        - name: lat
          summary: >-
            Latitude.
          description: >-
            Latitude in degrees.
        - name: lon
          summary: >-
            Longitude.
          description: >-
            Longitude in degrees.
        - name: z
          summary: >-
            Altitude above mean sea level.
          description: >-
            Altitude in meters above mean sea level, using the EGM84 geoid
            as reference. Note that the altitude provided by satellite
            navigation is generally rather imprecise.
        - name: zwgs84
          summary: >-
            Altitude above the WGS84 ellipsoid.
          description: >-
            Same as z but taking the WGS84 ellipsoid as reference, that is
            the coordinate system used by GPS (this quantity is also known
            as the ellipsoidal height). Note that the Android API provides
            the altitude above the WGS84 ellipsoid while the iOS API
            provides the altitude above the EGM84 geoid. Phyphox calculates
            the difference using a port of GeographicLib's algorithm with a
            30' resolution EGM84 dataset.
        - name: v
          summary: >-
            Speed over ground.
          description: >-
            Speed in m/s, provided by the system based on consecutive GPS
            fixes.
        - name: dir
          summary: >-
            Direction of travel.
          description: >-
            Direction in degrees, counted from north towards east,
            determined by the system along with the speed.
        - name: t
          summary: >-
            Timestamp.
          description: >-
            Experiment time in seconds since the start of the experiment for
            this location, as set by the operating system.
        - name: accuracy
          summary: >-
            Horizontal accuracy.
          description: >-
            An estimate by the system of the horizontal accuracy in meters.
        - name: zAccuracy
          summary: >-
            Vertical accuracy.
          description: >-
            An estimate by the system of the vertical accuracy in meters.
            Android provides this since Android 8; on older devices phyphox
            writes 0, which is also what Android reports when no estimate is
            available. On iOS a negative value means that the altitude is
            invalid.
          note: >-
            The old claim "Not available on Android" was wrong - verified
            2026-08-19: GpsInput.java appends
            Location.getVerticalAccuracyMeters() from API 26 (Android 8) and
            0 below; iOS appends CLLocation.verticalAccuracy unfiltered,
            which Apple documents as negative when the altitude is invalid.
        - name: status
          summary: >-
            Fix status.
          description: >-
            -1 means that GPS is unavailable (usually deactivated by the
            user), 0 means that it is searching for a signal, 1 means that
            it is active. Note that this value is updated independently
            from the other outputs.
          note: >-
            The docs used to describe a status 2 - active, but with the
            altitude above the WGS84 ellipsoid instead of the geoid because
            the device did not provide the difference. Removed 2026-08-19:
            neither app can emit it. Android's onStatusUpdate writes only
            -1/0/1 (GpsInput.java) and iOS derives only -1/0/1 from
            horizontalAccuracy (ExperimentGPSInput.swift). The state died
            with app version 1.1.3, which introduced the bundled EGM84
            dataset so the geoid offset is always known.
        - name: satellites
          summary: >-
            Number of satellites in view.
          description: >-
            Number of satellites used for this measurement. iOS does not
            make this information available to apps, so on iOS this output
            is always -1.
          note: >-
            Verified 2026-08-19. iOS accepts the component and hard-codes
            -1 for every fix (ExperimentGPSInput.swift) - Core Location has
            no satellite-count API, re-checked against current
            documentation. Android reads the "satellites" integer from the
            location extras (GpsInput.java), defaulting to 0 when the extra
            is missing and -1 when there are no extras at all. That extra
            is documented behaviour of the GPS provider
            (LocationManager.GPS_PROVIDER docs) and current AOSP still
            populates it with the number of satellites used for the fix
            (maintainer-confirmed on a Pixel 9 Pro on latest Android,
            2026-08-19) - an earlier version of this note wrongly called it
            legacy. It is only absent on locations from other providers.
            The richer modern API is GnssStatus
            (registerGnssStatusCallback, API 24+): per-satellite
            constellation, C/N0, azimuth/elevation and usedInFix,
            independent of location fixes. Switching to it would be an
            enhancement, not a correction.
      agreement: agreed
      rules: [output-component-validation]

  # ------------------------------------------------------------------ depth --
  - name: depth
    parent: input
    since: "1.14"
    summary: Depth camera (LiDAR or time-of-flight).
    children: [output]
    attributes:
      - name: mode
        value_notes:
          closest: >-
            The data point with the smallest distance to the
            camera.
          weighted: >-
            The weighted average, using the confidence data
            provided by each API.
          average: >-
            The plain average of all data points in the area.
        description: >-
          Defines how all data points within the selected area are
          aggregated into one depth value per frame. Note that
          phyphox automatically drops the lowest confidence value,
          and that lower confidences typically only appear at edges
          and represent a small portion of most scenes; the
          difference between average and weighted should therefore
          be negligible in most situations.
        type: enum
        values: [closest, weighted, average]
        default: closest
        summary: How to reduce the depth values in the selected region to one number.
        agreement: agreed
        rules: [enum-case-insensitive, enum-invalid-value]

      - name: x1
        description: >-
          Left edge of the initial acquisition area, which the user
          can still modify. The value is a floating point number
          from 0.0 to 1.0, with 0.0 referring to the left/top edge
          of the image and 1.0 to the right/bottom edge.
        type: float
        default: 0.4
        summary: Left edge of the region of interest, as a fraction of the frame.
        agreement: agreed
        note: >-
          Internal detail, not reader-facing: both apps rotate the four
          edges from this documented user frame (the portrait preview, origin
          top left) into the camera sensor's landscape frame at parse time -
          x1 = 1 - y1user and so on (x -> -y, y -> -x). So the values stored
          in the runtime objects are not the attribute values, which is only
          relevant when comparing spec and source. The transformation is
          byte-identical in all four places: Android depth and camera in
          PhyphoxFile.java, iOS depth and camera in InputElementHandler.swift.
          Verified 2026-08-19.
      - name: x2
        description: >-
          Right edge of the initial acquisition area, which the user
          can still modify. The value is a floating point number
          from 0.0 to 1.0, with 0.0 referring to the left/top edge
          of the image and 1.0 to the right/bottom edge.
        type: float
        default: 0.6
        summary: Right edge of the region of interest.
        agreement: agreed
      - name: y1
        description: >-
          Top edge of the initial acquisition area, which the user
          can still modify. The value is a floating point number
          from 0.0 to 1.0, with 0.0 referring to the left/top edge
          of the image and 1.0 to the right/bottom edge.
        type: float
        default: 0.4
        summary: Top edge of the region of interest.
        agreement: agreed
      - name: y2
        description: >-
          Bottom edge of the initial acquisition area, which the
          user can still modify. The value is a floating point
          number from 0.0 to 1.0, with 0.0 referring to the left/top
          edge of the image and 1.0 to the right/bottom edge.
        type: float
        default: 0.6
        summary: Bottom edge of the region of interest.
        agreement: agreed

      - name: smooth
        type: boolean
        default: true
        summary: >-
          Applies only to LiDAR on iOS. Chooses ARKit's smoothedSceneDepth over
          sceneDepth, that is, whether ARKit's own smoothing is used.
        agreement: platform
        platforms: [ios]
        remark: >-
          The setting chooses between two ARKit frame properties, so there is
          nothing for Android to apply it to; it is accepted and ignored there.
        note: >-
          Android has no equivalent: the setting selects between two ARKit frame
          properties, so there is nothing for it to read. Documented as
          iOS-specific on the input page.

    outputs:
      attribute: component
      required_component: false
      components:
        - name: z
          required: true
          summary: >-
            Depth.
          description: >-
            The depth value aggregated over the selected area, one per
            frame.
        - name: t
          summary: >-
            Timestamp.
          description: >-
            Timestamp of the frame the depth value came from.
      agreement: agreed
      rules: [output-component-validation]

  # ----------------------------------------------------------------- camera --
  - name: camera
    parent: input
    since: "1.19"
    summary: The camera, used photometrically or for spectroscopy.
    children: [output]
    attributes:
      - name: x1
        description: >-
          Left edge of the initial acquisition area, which the user
          can still modify. The value is a floating point number
          from 0.0 to 1.0, with 0.0 referring to the left/top edge
          of the image and 1.0 to the right/bottom edge.
        type: float
        default: 0.4
        summary: Left edge of the region of interest, as a fraction of the frame.
        agreement: agreed
        note: >-
          Both apps rotate the four edges into the camera sensor's frame at
          parse time; see the note on depth's x1, which covers all four
          places including this element.
      - name: x2
        description: >-
          Right edge of the initial acquisition area, which the user
          can still modify. The value is a floating point number
          from 0.0 to 1.0, with 0.0 referring to the left/top edge
          of the image and 1.0 to the right/bottom edge.
        type: float
        default: 0.6
        summary: Right edge of the region of interest.
        agreement: agreed
      - name: y1
        description: >-
          Top edge of the initial acquisition area, which the user
          can still modify. The value is a floating point number
          from 0.0 to 1.0, with 0.0 referring to the left/top edge
          of the image and 1.0 to the right/bottom edge.
        type: float
        default: 0.4
        summary: Top edge of the region of interest.
        agreement: agreed
      - name: y2
        description: >-
          Bottom edge of the initial acquisition area, which the
          user can still modify. The value is a floating point
          number from 0.0 to 1.0, with 0.0 referring to the left/top
          edge of the image and 1.0 to the right/bottom edge.
        type: float
        default: 0.6
        summary: Bottom edge of the region of interest.
        agreement: agreed

      - name: auto_exposure
        description: >-
          Determines whether auto exposure is enabled after loading
          the experiment. This is not the phone's internal auto
          exposure but an implementation within phyphox, which
          follows the strategy set by aeStrategy.
        type: boolean
        default: true
        summary: Enable phyphox's own auto exposure, rather than the camera's.
        agreement: agreed
        note: >-
          docs/file-format/input.md called this autoExposure, which no
          implementation accepts. Android, iOS and the editor all read
          auto_exposure. The page has been corrected.

      - name: aeStrategy
        type: enum
        values: [mean, avoidOverexposure, avoidUnderexposure, prioritizeFramerate]
        default: mean
        summary: What phyphox's auto exposure should optimize for.
        value_notes:
          mean: >-
            Aims for a mean luma of 0.5 over the selected area. Exposure times
            shorter than the frame duration are preferred, so ISO is raised
            first, but in a dark scene the exposure can go to 1/15 s, which
            limits the frame rate considerably.
          avoidUnderexposure: >-
            Like mean, but brightens the image when individual pixels are
            particularly dark, even if the mean luma then exceeds 0.5.
          avoidOverexposure: >-
            Like avoidUnderexposure, but darkens the image when bright pixels
            approach overexposure.
          prioritizeFramerate: >-
            Like mean, but never exposes for longer than the frame duration at
            the highest frame rate the camera supports, accepting
            underexposure to keep that rate. See aeFPSTarget.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

      - name: aeFPSTarget
        description: >-
          Sets a target framerate when using aeStrategy
          prioritizeFramerate. If this is not set,
          prioritizeFramerate defaults to the shortest supported
          frame duration (the inverse of the maximum framerate). If
          it is set, the target FPS acts as a maximum exposure time
          to at least achieve the set FPS. It does not prevent the
          camera from going above the target FPS.
        type: float
        default: 0.0
        since: "1.20"
        summary: >-
          Target frame rate for the prioritizeFramerate strategy, acting as a
          maximum exposure time. Unset, that strategy uses the shortest supported
          frame duration. It does not stop the camera exceeding the target.
        agreement: agreed

      - name: locked
        description: >-
          A comma-separated list of camera settings to hold fixed,
          which also blocks them in the camera-gui interface so the
          user cannot change them. Each can also be set to a
          specific value with an equals sign followed by a floating
          point value, and fractions may be used: locked="iso"
          prevents the user from changing the ISO value,
          locked="iso=1600" also sets it, and
          locked="iso=100,shutter_speed=1/240" locks the camera to
          ISO 100 with an exposure time of 1/240 s. The available
          locks are shutter_speed, iso, exposure, aperture and,
          since file format 1.20, focus_distance. Be aware that the
          same settings have very different results on different
          phone models. Aperture is not supported on iOS, as no
          iPhone has an adjustable aperture, and it is untested on
          Android where it is also rare. exposure is the exposure
          value used by the simplified exposure control of the
          camera-gui element. focus_distance disables auto focus and
          fixes the focus distance, given in meters, with zero
          meaning focus at infinity.
        type: string
        default: ""
        summary: >-
          Comma-separated camera settings to hold fixed, each optionally with a
          value (`shutter_speed=1/500,iso=100`).
        agreement: agreed
        note: >-
          Both accept the same syntax including the shutter-speed fraction form,
          but they parse it in different places - iOS in the handler, Android
          further downstream. Worth a conformance test rather than trust.

      - name: feature
        description: >-
          Determines the kind of camera analysis this input
          performs.
        type: enum
        values: [photometric, spectroscopy]
        default: photometric
        summary: Which analysis the camera input performs.
        value_notes:
          photometric: >-
            One value per frame - luma, luminance, hue, saturation or value -
            averaged over the selected area.
          spectroscopy: >-
            A spectrum per frame, taken across the selected area. Only the
            luminance output receives the spectrum, paired with the
            pixelPosition output; no other component carries spectral data.
        agreement: agreed
        rules: [enum-case-insensitive, enum-invalid-value]
        note: >-
          Verified 2026-08-19 in Android's AnalyzingOpenGLRenderer constructor
          and iOS's AnalyzingRenderer.initializeCameraBuffer: with
          feature=spectroscopy the luminance buffer is handed to the
          SpectroscopyAnalyzer together with pixelPosition, and the photometric
          LuminanceAnalyzer is not registered. The luma, hue, saturation and
          value analyzers are registered regardless of the feature on both
          platforms, so those outputs keep delivering their per-frame
          photometric averages even in spectroscopy mode - the docs do not
          promise that, it is just what both implementations happen to do.

    outputs:
      attribute: component
      required_component: true
      components:
        - name: t
          summary: >-
            Timestamp.
          description: >-
            Timestamp of the frame.
        - name: luma
          summary: >-
            Luma of the region.
          description: >-
            Luma - non-linear brightness relative to the image's color
            range - of the selected area, in the range from 0 to 1.
        - name: luminance
          summary: >-
            Luminance of the region.
          description: >-
            Relative luminance in arbitrary units. This is linearized (gamma
            corrected) and adjusted for the exposure parameters such that
            the value 1 represents a white image when the camera is set to
            ISO 100, a shutter speed of 1/60 s and an aperture of f/1.
        - name: hue
          summary: >-
            Hue.
          description: >-
            Hue according to the HSV color model, ranging from 0 to 360
            degrees. Note that this is a cyclic average of the pixels in the
            selected area.
        - name: saturation
          summary: >-
            Saturation.
          description: >-
            Saturation according to the HSV color model, ranging from 0 to
            1.
        - name: value
          summary: >-
            Value, in the HSV sense.
          description: >-
            Value according to the HSV color model, ranging from 0 to 1.
        - name: threshold
          summary: >-
            Fraction of pixels above the threshold.
          description: >-
            Fraction of the pixels in the selected area above the threshold.
        - name: shutterSpeed
          summary: >-
            Shutter speed in use.
          description: >-
            Shutter speed used to take this frame. Note that a change to
            shutter speed, aperture or ISO does not necessarily take effect
            immediately - the phone may ramp the setting smoothly or execute
            it with a delay of a few frames. On individual frames around such
            a change, this output can therefore mismatch the shutter speed
            the frame was actually captured with.
        - name: iso
          summary: >-
            ISO in use.
          description: >-
            ISO value used to take this frame. Like shutterSpeed, this can
            mismatch on individual frames around a setting change, because
            the phone may ramp the setting smoothly or execute it with a
            delay of a few frames.
        - name: aperture
          summary: >-
            Aperture in use.
          description: >-
            Aperture used to take this frame. Like shutterSpeed, this can
            mismatch on individual frames around a setting change, because
            the phone may ramp the setting smoothly or execute it with a
            delay of a few frames.
        - name: pixelPosition
          summary: >-
            Position within the spectrum.
          description: >-
            Position within the spectrum, for the spectroscopy feature. This
            output holds exactly as many values as the matching luminance
            output - the two are written together, so the i-th luminance
            value belongs to the i-th position. The positions are absolute
            pixel indices along the dispersion axis of the camera image, so
            a calibration stays valid when the user moves the selected area.
        # A "wavelength" component existed here as part of a superseded
        # calibration draft. It never shipped in any release or beta - the
        # data picker replaced it - and was removed from the format on
        # 2026-08-19. Android never accepted it; iOS still accepts (and never
        # fills) the buffer, which is recorded as an iOS-TODO item.
      agreement: agreed
      rules: [output-component-validation]

  # -------------------------------------------------------------- bluetooth --
  - name: bluetooth
    parent: input
    since: "1.7"
    summary: A Bluetooth Low Energy device.
    children: [output, config]
    attributes:
      - name: name
        group: matching
        description: >-
          If this name is contained in the name of a device found
          while scanning, the device matches the criterion.
        type: string
        summary: Connect only to a device advertising this name.
        agreement: agreed
      - name: uuid
        group: matching
        description: >-
          The UUID of a service advertised by the device. Note that
          even if the device advertises a short 16-bit UUID
          according to the Bluetooth specification - 0x1812 for a
          Human Interface Device service, say - you need to specify
          the 128-bit version, here
          00001812-0000-1000-8000-00805f9b34fb, using the base UUID
          0000xxxx-0000-1000-8000-00805f9b34fb.
        type: string
        summary: Connect only to a device advertising this service UUID.
        agreement: agreed
      - name: mode
        value_notes:
          poll: >-
            phyphox requests new values at the rate given by the
            rate attribute.
          notification: >-
            New values arrive when the device notifies that there
            is one. The characteristic has to support
            notifications. For most devices this mode gives the
            best results.
          indication: >-
            New values arrive when the device indicates that there
            is one. The characteristic has to support indication,
            which is very uncommon for simple values. This setting
            stopped mattering with phyphox 1.1.7, which
            auto-detects notification or indication regardless of
            what is chosen here.
        type: enum
        required: true
        values: [notification, indication, poll]
        summary: How data is obtained from the characteristic.
        agreement: agreed
      - name: rate
        description: >-
          Only used when the mode is poll; the rate in Hz at which
          new values are requested.
        type: float
        summary: Polling rate. Required, finite and positive when mode is poll.
        agreement: agreed
      - name: subscribeOnStart
        description: >-
          Usually phyphox subscribes to notifications as soon as the
          connection is established, which minimizes latency when
          the measurement starts. Some devices, however, react to a
          subscription by sending buffered data or triggering
          something in the experiment; set this to true to have
          phyphox subscribe only when the measurement starts.
        type: boolean
        default: false
        summary: Subscribe when the measurement starts rather than on connect.
        agreement: agreed
      - name: autoConnect
        group: matching
        description: >-
          If set to true, phyphox shows no scan dialog and connects
          to the first device matching the other criteria. Only use
          this when you can be sure a single matching device will be
          present, typically for a device you built yourself.
        type: boolean
        default: false
        summary: Connect without asking the user to pick a device.
        agreement: agreed
      - name: address
        group: matching
        type: string
        summary: >-
          Connect only to the device with this hardware address. **Using this
          attribute makes the experiment Android-only**: iOS gives no access to
          BLE hardware addresses, so the criterion cannot be honored there.
        agreement: platform
        platforms: [android]
      - name: id
        group: matching
        description: >-
          Combines two functions for managing several BLE devices in
          one experiment. It is shown to the user to identify what a
          device is for during scanning - two sensor boxes could be
          labeled "wheel" and "distance" - and for that purpose it
          is translatable. It also groups entries: phyphox treats
          devices with the same id as one device, so several
          bluetooth elements, across input and output blocks alike,
          can refer to it without asking the user to pick it twice.
        type: string
        translatable: true
        summary: >-
          Names the device for the user during scanning, and groups entries:
          bluetooth elements sharing an id refer to one device, so the user is
          asked to pick it only once even across input and output blocks.
        agreement: agreed
      - name: mtu
        group: matching
        description: >-
          Requests a specific MTU size. Note that this always fails
          on Android devices before Android 5.0.
        type: integer
        default: 0
        since: "1.9"
        summary: Requests a specific MTU. Fails on Android before 5.0.
        agreement: platform
        platforms: [android]
        remark: >-
          iOS gives no control over the MTU and always requests the maximum, so
          the attribute is accepted and ignored there.
        note: >-
          iOS has no way to control the MTU and always requests the maximum, so
          the attribute is accepted and ignored there. Documented as such on the
          Bluetooth page, so this is a deliberate platform difference rather than
          an omission.

  - name: output
    parent: bluetooth
    since: "1.7"
    summary: Maps a characteristic, or a value derived from one, onto a buffer.
    text: Name of the data container receiving the converted values.
    attributes:
      - name: char
        description: >-
          UUID of the characteristic this tag reads from.
        type: string
        required: true
        summary: UUID of the characteristic to read.
        agreement: agreed
      - name: extra
        type: enum
        values: [time, none]
        default: none
        summary: >-
          Write something other than characteristic data - currently only the
          time at which data arrived. No conversion applies when set.
        agreement: agreed
      - name: conversion
        type: string
        summary: >-
          Name of the conversion turning raw bytes into numbers. Required unless
          extra is set.
        note: >-
          The vocabulary is the input list of the conversions section at the
          end of output.yml, shared by all three conversion attributes.
        agreement: agreed
      - name: offset
        type: integer
        default: 0
        summary: Bytes to skip before converting.
        agreement: agreed
      - name: repeating
        type: integer
        default: 0
        summary: Stride at which the conversion repeats over the data.
        agreement: agreed
      - name: length
        type: integer
        summary: Bytes to convert. Unset means to the end.
        agreement: agreed
      - name: decimalPoint
        type: string
        summary: Decimal separator, for the string conversion.
        agreement: agreed
      - name: separator
        type: string
        summary: Field separator, for the formattedString conversion.
        agreement: agreed
      - name: label
        type: string
        summary: Field label to select, for the formattedString conversion.
        agreement: agreed
      - name: index
        type: integer
        default: 0
        summary: Field index to select, for the formattedString conversion.
        agreement: agreed

  - name: config
    parent: bluetooth
    since: "1.7"
    summary: Value written to a characteristic once on connecting.
    text: The value to write, interpreted by the conversion.
    attributes:
      - name: char
        description: >-
          UUID of the characteristic this tag writes to.
        type: string
        required: true
        summary: UUID of the characteristic to write.
        agreement: agreed
      - name: conversion
        type: string
        required: true
        summary: Conversion turning the element's text into bytes.
        note: >-
          The vocabulary is the config list of the conversions section at the
          end of output.yml.
        agreement: agreed
