# The <analysis> block and its modules, modeled completely.
#
# Sources compared for every entry below:
#   Android  PhyphoxFile.java, analysisBlockParser                 (b4564695)
#   iOS      Serialization/Handlers/AnalysisElementHandler.swift,
#            ExperimentAnalysisFactory.swift and Analysis/Modules/*  (a0643729)
#   docs     docs/file-format/analysis/*.md
#
# Each slot below records, from Android's ioMapping table:
#
#   as_required   whether the `as` attribute must name this slot. Android's
#                 default is true; an unnamed tag is only ever matched to a slot
#                 with as_required false. 104 of the 194 slots require it.
#   min / max     how many tags may fill the slot. max: unlimited is Android's
#                 maxCount = 0.
#   allows_value  whether type="value" is accepted for this input slot.
#   allows_empty  whether type="empty" is accepted. Only three slots do.
#   repeat_offset present when the slot is part of a repeating cycle, so several
#                 groups of inputs can be given in order.
#
# Both parsers enforce these. iOS historically did not - it matched the `as`
# names it knew and fell back to document order with no per-slot restriction -
# but gained its own slot tables in the 2026-08 divergence cleanup
# (ExperimentAnalysisModule.ioMapping on the development branch).
#
# How the two sides express a module's inputs and outputs differs, and only
# Android states it declaratively. Android gives every module an ioMapping
# table naming each slot, whether the `as` attribute is required for it, how
# many may appear and whether a literal value is allowed. iOS resolves the same
# names implicitly - `priorityInputKey` in the complex-update modules, position
# elsewhere. The slot names below are therefore taken from Android's tables,
# which are the only explicit statement of them anywhere, including the docs.

block: analysis
since: "1.0"
summary: >-
  The mathematics of the experiment. Modules run in order, each reading data
  containers and writing results to others, and the whole block repeats in a
  loop while the experiment runs.

# Accepted by every module, and checked once rather than repeated 54 times.
common:
  module_attributes:
    - name: cycles
      type: string
      since: "1.10"
      summary: >-
        Which analysis cycles this module runs in, as a space-separated list of
        numbers and dash-ranges with open ends allowed, e.g. "0 3 5-7 10-".
        Cycle 0 runs once when the experiment is opened, before the user presses
        start. Unset, the module runs in every cycle.
      agreement: agreed
  input_attributes:
    - name: as
      type: string
      summary: >-
        Which slot of the module this input feeds.
      agreement: agreed
    - name: type
      type: enum
      values: [buffer, value, empty]
      default: buffer
      summary: >-
        Whether the text names a data container, is a literal value, or
        stands for a constant empty buffer.
      agreement: agreed
      rules: [enum-invalid-value, enum-case-insensitive]
    - name: keep
      type: boolean
      default: false
      summary: >-
        Whether the data container keeps its contents after being read.
        False clears it, so each dataset is processed once.
      agreement: agreed
    - name: clear
      type: boolean
      default: true
      summary: >-
        Deprecated in file format 1.17 in favor of keep, which is the more
        intuitive spelling. clear=true corresponds to keep=false.
      deprecated: true
      superseded_by: keep
      agreement: agreed
  output_attributes:
    - name: as
      type: string
      summary: >-
        Which slot of the module this output receives.
      agreement: agreed
    - name: append
      type: boolean
      default: false
      summary: >-
        Whether new data is appended to the container rather than replacing
        its contents.
      agreement: agreed
    - name: clear
      type: boolean
      default: true
      summary: >-
        Deprecated in file format 1.17 in favor of append. clear=true
        corresponds to append=false.
      deprecated: true
      superseded_by: append
      agreement: agreed

elements:

  # Every module below inherits the slot constraints described in the header.
  # They are recorded once here rather than on each of the 54 modules.
  - name: analysis
    parent: phyphox
    since: "1.0"
    slot_constraints:
      agreement: agreed
      rules: [output-component-validation]
    summary: Container for the analysis modules, executed in document order.
    children: [abs, acos, add, append, asin, atan, atan2, autocorrelation, average, binning, butterworth, const, cos, cosh, count, crosscorrelation, differentiate, divide, eventstream, fft, first, formula, gausssmooth, gcd, if, imagedecode, info, integrate, interpolate, lcm, loess, log, map, match, max, min, movingaverage, multiply, periodicity, power, ramp, rangefilter, reduce, round, sin, sinh, sort, split, subrange, subtract, tan, tanh, threshold, timer]
    attributes:
      - name: sleep
        type: float
        default: 0.0
        summary: >-
          Minimum seconds between the end of one run of the block and the
          start of the next.
        description: >-
          The minimum time in seconds before the whole analysis block is
          executed again after the last execution has finished. Decimal
          values are allowed. Independently of this attribute (and of
          dynamicSleep), both apps pause at least about 10 ms between
          runs, so the analysis never runs faster than roughly 100 Hz -
          the default of 0 simply means as fast as that limit allows.
        agreement: agreed
        note: >-
          The 10 ms floor was verified 2026-08-20: Android's analysis
          thread sleeps a fixed 10 ms between loop iterations
          (Experiment.java, updateData runnable, Thread.sleep(10));
          iOS clamps the inter-cycle delay with max(1/100.0, sleep)
          (ExperimentAnalysis.swift). The docs used to claim sleep=0
          re-runs immediately. iOS skips the delay entirely for the
          first cycle after start; the floor applies from then on.
      - name: dynamicSleep
        type: string
        since: "1.5"
        summary: >-
          Data container supplying the sleep time, so the analysis can set
          its own rate. Falls back to sleep when empty.
        description: >-
          Name of a data container supplying the minimum time in seconds
          before the whole analysis block is executed again, so the sleep
          time can be set by the analysis result itself. If the container
          is empty, the value from sleep is used instead.
        agreement: agreed
      - name: onUserInput
        type: boolean
        default: false
        summary: >-
          Run the block only when the user changes an input view, rather
          than continuously.
        description: >-
          If true, the analysis block is not executed again unless the
          user changes the content of an input view.
        agreement: agreed
      - name: requireFill
        type: string
        since: "1.16"
        summary: >-
          Data container that must hold enough values before the block runs
          at all.
        description: >-
          Name of a data container that needs to be filled before the
          block runs. requireFillThreshold or requireFillDynamic defines
          the required number of elements (default 1); if the container
          holds fewer, the analysis block is skipped.
        agreement: agreed
      - name: requireFillThreshold
        type: integer
        default: 1
        since: "1.16"
        summary: >-
          How many values requireFill needs.
        description: >-
          A static integer setting the number of elements the container
          named by requireFill must hold.
        agreement: agreed
      - name: requireFillDynamic
        type: string
        since: "1.16"
        summary: >-
          Data container supplying that count. Falls back to
          requireFillThreshold when empty.
        description: >-
          Name of a data container supplying the required number of
          elements for requireFill dynamically. If it is empty, the value
          from requireFillThreshold is used instead.
        agreement: agreed
      - name: timedRun
        type: boolean
        default: false
        since: "1.10"
        summary: >-
          Preset for the timed-run setting. The user can still change it.
        description: >-
          Enable the timed-run setting by default. This acts only as a
          preset; the user can still deactivate it from the main menu.
        agreement: agreed
      - name: timedRunStartDelay
        type: float
        default: 3.0
        since: "1.10"
        summary: >-
          Preset start delay in seconds for timed runs.
        description: >-
          Start delay in seconds for the timed-run setting. This acts only
          as a preset, and does not enable the function by itself - see
          timedRun.
        agreement: agreed
      - name: timedRunStopDelay
        type: float
        default: 10.0
        since: "1.10"
        summary: >-
          Preset stop delay in seconds for timed runs.
        description: >-
          Stop delay in seconds for the timed-run setting. This acts only
          as a preset, and does not enable the function by itself - see
          timedRun.
        agreement: agreed

  - name: abs
    parent: analysis
    summary: >-
      Calculates the absolute value of a single input element-wise and
      writes it to a single output buffer.
    children: [input, output]
    attributes: []
    inputs:
      - name: value
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: abs
        as_required: false
        min: 1
        max: 1

  - name: acos
    parent: analysis
    summary: >-
      Calculates the inverse cosine of a single input element-wise and
      writes the resulting angle to a single output buffer.
    children: [input, output]
    attributes:
      - name: deg
        type: boolean
        since: "1.2"
        default: false
        summary: Return the angle in degrees instead of radians.
        agreement: agreed
    inputs:
      - name: value
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: acos
        as_required: false
        min: 1
        max: 1

  - name: add
    parent: analysis
    summary: >-
      Calculates the sum of all inputs element-wise and writes it to a
      single output buffer.
    children: [input, output]
    attributes: []
    inputs:
      - name: summand
        as_required: false
        min: 1
        max: unlimited
        allows_value: true
        allows_empty: false
        repeat_offset: 0
    outputs:
      - name: sum
        as_required: false
        min: 1
        max: 1

  - name: append
    parent: analysis
    summary: >-
      This module appends all the values of the input buffers to a single
      output buffer.
    children: [input, output]
    attributes: []
    inputs:
      - name: in
        as_required: false
        min: 1
        max: unlimited
        allows_value: true
        allows_empty: true
        repeat_offset: 0
    outputs:
      - name: out
        as_required: false
        min: 1
        max: 1

  - name: asin
    parent: analysis
    summary: >-
      Calculates the inverse sine of a single input element-wise and
      writes the resulting angle to a single output buffer.
    children: [input, output]
    attributes:
      - name: deg
        type: boolean
        since: "1.2"
        default: false
        summary: Return the angle in degrees instead of radians.
        agreement: agreed
    inputs:
      - name: value
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: asin
        as_required: false
        min: 1
        max: 1

  - name: atan
    parent: analysis
    summary: >-
      Calculates the inverse tangent of a single input element-wise and
      writes the resulting angle to a single output buffer.
    children: [input, output]
    attributes:
      - name: deg
        type: boolean
        since: "1.2"
        default: false
        summary: Return the angle in degrees instead of radians.
        agreement: agreed
    inputs:
      - name: value
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: atan
        as_required: false
        min: 1
        max: 1

  - name: atan2
    parent: analysis
    summary: >-
      Calculates the two-argument variant of the inverse tangent
      (corresponding to atan(y/x), see
      [Wikipedia](https://en.wikipedia.org/wiki/Atan2) for an explanation).
    children: [input, output]
    attributes:
      - name: deg
        type: boolean
        since: "1.2"
        default: false
        summary: Return the angle in degrees instead of radians.
        agreement: agreed
    inputs:
      - name: y
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
      - name: x
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: atan2
        as_required: false
        min: 1
        max: 1

  - name: autocorrelation
    parent: analysis
    summary: >-
      This module will calculate the autocorrelation.
    children: [input, output]
    attributes: []
    inputs:
      - name: x
        as_required: true
        min: 0
        max: 1
        allows_value: false
        allows_empty: false
      - name: y
        as_required: true
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
      - name: minX
        default: "no lower bound"
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
      - name: maxX
        default: "no upper bound"
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: y
        as_required: true
        min: 0
        max: 1
      - name: x
        as_required: true
        min: 0
        max: 1

  - name: average
    parent: analysis
    since: "1.2"
    summary: >-
      This module calculates the average of all values in the input buffer.
    children: [input, output]
    attributes: []
    inputs:
      - name: buffer
        as_required: false
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
    outputs:
      - name: average
        as_required: false
        min: 0
        max: 1
      - name: stddev
        as_required: true
        min: 0
        max: 1
        agreement: agreed

  - name: binning
    parent: analysis
    since: "1.2"
    summary: >-
      The binning module distributes the values from its input in into
      ranges (bins) and outputs a mapping of these ranges and the number of
      values in each
    children: [input, output]
    attributes: []
    inputs:
      - name: in
        as_required: false
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
      - name: x0
        default: 0
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
      - name: dx
        default: 1
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: binStarts
        as_required: false
        min: 1
        max: 1
      - name: binCounts
        as_required: false
        min: 1
        max: 1

  - name: butterworth
    parent: analysis
    since: "1.20"
    summary: >-
      This module represents the transfer function of a Butterworth filter.
    children: [input, output]
    attributes: []
    inputs:
      - name: y
        as_required: true
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
      - name: x
        as_required: true
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
      - name: n
        as_required: true
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
      - name: cutoff
        as_required: true
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
      - name: cutoffLow
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: filtered
        as_required: false
        min: 1
        max: 1

  - name: const
    parent: analysis
    summary: >-
      This module will initialize a buffer to a constant value.
    children: [input, output]
    attributes: []
    inputs:
      - name: value
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
      - name: length
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: out
        as_required: false
        min: 1
        max: 1

  - name: cos
    parent: analysis
    summary: >-
      Calculates the cosine of a single input (in radians) element-wise and
      writes it to a single output buffer.
    children: [input, output]
    attributes:
      - name: deg
        type: boolean
        since: "1.2"
        default: false
        summary: Interpret the input in degrees instead of radians.
        agreement: agreed
    inputs:
      - name: value
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: cos
        as_required: false
        min: 1
        max: 1

  - name: cosh
    parent: analysis
    summary: >-
      Calculates the hyperbolic cosine of a single input
      element-wise and writes it to a single output buffer.
    children: [input, output]
    attributes: []
    inputs:
      - name: value
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: cosh
        as_required: false
        min: 1
        max: 1

  - name: count
    parent: analysis
    since: "1.2"
    summary: >-
      Returns the number of values in the input buffer
    children: [input, output]
    attributes: []
    inputs:
      - name: buffer
        as_required: false
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
    outputs:
      - name: count
        as_required: false
        min: 1
        max: 1

  - name: crosscorrelation
    parent: analysis
    summary: >-
      This module will calculate a crosscorrelation of two inputs.
    children: [input, output]
    attributes: []
    inputs:
      - name: in
        as_required: false
        min: 2
        max: 2
        allows_value: false
        allows_empty: false
        repeat_offset: 0
    outputs:
      - name: out
        as_required: false
        min: 1
        max: 1

  - name: differentiate
    parent: analysis
    summary: >-
      Performs a simple differentiation of a single input by calculating the
      difference of consecutive elements.
    children: [input, output]
    attributes: []
    inputs:
      - name: in
        as_required: false
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
    outputs:
      - name: out
        as_required: false
        min: 1
        max: 1

  - name: divide
    parent: analysis
    summary: >-
      Calculates the quotient of multiple divisors from a single dividend
      element-wise and writes it to a single output buffer.
    children: [input, output]
    attributes: []
    inputs:
      - name: dividend
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
      - name: divisor
        as_required: false
        min: 1
        max: unlimited
        allows_value: true
        allows_empty: false
        repeat_offset: 0
    outputs:
      - name: quotient
        as_required: false
        min: 1
        max: 1

  - name: eventstream
    parent: analysis
    since: "1.18"
    summary: >-
      This is a convenient and faster substitute for stopwatch
      implementations like the one used in the acoustic stopwatch.
    children: [input, output]
    attributes:
      - name: mode
        type: enum
        values: [above, below, aboveAbsolute, belowAbsolute, aboveDerivative, belowDerivative, aboveDerivativeAbsolute, belowDerivativeAbsolute]
        default: above
        summary: See the module description.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
    inputs:
      - name: data
        as_required: true
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
      - name: threshold
        default: 0
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
      - name: distance
        default: 0
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
      - name: index
        default: 0
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
      - name: skip
        default: 0
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
      - name: last
        default: "NaN"
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: events
        as_required: true
        min: 0
        max: 1
      - name: index
        as_required: true
        min: 0
        max: 1
      - name: skip
        as_required: true
        min: 0
        max: 1
      - name: last
        as_required: true
        min: 0
        max: 1

  - name: fft
    parent: analysis
    summary: >-
      This module will perform a fast Fourier transform of a complex input
      and will write the complex result to the output buffers.
    children: [input, output]
    attributes: []
    inputs:
      - name: re
        as_required: false
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
      - name: im
        as_required: true
        min: 0
        max: 1
        allows_value: false
        allows_empty: false
    outputs:
      - name: re
        as_required: false
        min: 0
        max: 1
      - name: im
        as_required: true
        min: 0
        max: 1

  - name: first
    parent: analysis
    summary: >-
      Retrieves the first entry of each buffer and appends it to each output
      buffer.
    children: [input, output]
    attributes: []
    inputs:
      - name: value
        as_required: false
        min: 1
        max: unlimited
        allows_value: false
        allows_empty: false
        repeat_offset: 0
    outputs:
      - name: first
        as_required: false
        min: 1
        max: unlimited
        repeat_offset: 0

  - name: formula
    parent: analysis
    since: "1.7"
    summary: >-
      Evaluates a mathematical expression, given in the formula attribute,
      over the values of its input buffers.
    children: [input, output]
    attributes:
      - name: formula
        type: string
        summary: See the module description.
        agreement: agreed
    inputs:
      - name: in
        as_required: false
        min: 0
        max: unlimited
        allows_value: false
        allows_empty: false
        repeat_offset: 0
    outputs:
      - name: out
        as_required: false
        min: 1
        max: 1

  - name: gausssmooth
    parent: analysis
    summary: >-
      This module will smooth the data provided by the only input.
    children: [input, output]
    attributes:
      - name: sigma
        description: >-
          Width of the Gaussian distribution used to smooth the
          data, in terms of value indices.
        default: 3.0
        type: float
        summary: >-
          See the module description. A present value of zero or less rejects
          the file; the default applies only when the attribute is absent.
        agreement: agreed
    inputs:
      - name: in
        as_required: false
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
    outputs:
      - name: out
        as_required: false
        min: 1
        max: 1

  - name: gcd
    parent: analysis
    summary: >-
      Calculates the greatest common divisor of two inputs element-wise and
      writes it to a single output buffer.
    children: [input, output]
    attributes: []
    inputs:
      - name: value
        as_required: false
        min: 2
        max: 2
        allows_value: true
        allows_empty: false
        repeat_offset: 0
    outputs:
      - name: gcd
        as_required: false
        min: 1
        max: 1

  - name: if
    parent: analysis
    since: "1.3"
    summary: >-
      The if module is the phyphox equivalent to the if-statement of a
      programming language.
    children: [input, output]
    attributes:
      - name: equal
        type: boolean
        default: false
        summary: Take the true branch when a equals b.
        agreement: agreed
        note: >-
          Was modeled as type float with no default; both platforms parse a
          strict boolean defaulting to false (PhyphoxFile.java
          getBooleanAttribute, IfAnalysis.swift optionalValue ?? false).
          Corrected 2026-08-19 during the analysis-module audit.
      - name: greater
        type: boolean
        default: false
        summary: Take the true branch when a is greater than b.
        agreement: agreed
      - name: less
        type: boolean
        default: false
        summary: Take the true branch when a is less than b.
        agreement: agreed
    inputs:
      - name: a
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
      - name: b
        as_required: false
        min: 1
        max: 1
        allows_value: true
        allows_empty: false
      - name: "true"
        as_required: false
        min: 0
        max: 1
        allows_value: true
        allows_empty: true
      - name: "false"
        as_required: false
        min: 0
        max: 1
        allows_value: true
        allows_empty: true
    outputs:
      - name: result
        as_required: false
        min: 1
        max: 1

  - name: imagedecode
    parent: analysis
    since: "1.20"
    summary: >-
      This module takes the input data as a stream of bytes encoded by the
      values 0 to 255.
    children: [input, output]
    attributes: []
    inputs:
      - name: in
        as_required: false
        min: 1
