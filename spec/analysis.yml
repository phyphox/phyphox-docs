          width previous elements are available. With dropIncomplete
          set to true the module outputs n-width values for an
          input of n data values; with it set to false it outputs
          exactly n values.
        default: false
        type: boolean
        summary: See the module description.
        agreement: agreed
        note: >-
          The count used to be given as n-width+1, an off-by-one also present
          in a comment in Analysis.java. Verified 2026-08-19 on both
          platforms: the loop starts at index width (Analysis.java
          movingaverageAM, MovingAverageAnalysis.swift), so n-width values
          are emitted, each averaging width+1 elements.
    inputs:
      - name: data
        as_required: true
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
      - name: width
        default: 10
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
