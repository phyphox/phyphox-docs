  - name: split
    parent: analysis
    since: "1.18"
    summary: >-
      Takes data as input and splits it into two buffers at the given index.
    description: >-
      Takes data as input and splits it into two buffers at the given
      index: the value at index is the first one that goes to the second
      output instead of the first. index defaults to the number of values
      in the data buffer, so without it the entire input is returned as
      the first output. overlap (default 0) sends that many elements from
      before index to the second output as well, without changing the
      first output - for example to retain a number of values as the
      starting point for the next iteration.
      (Verified in both implementations: Analysis.java splitAM and
      SplitAnalysis.swift both default index to the input length.)
    children: [input, output]
    attributes: []
    inputs:
      - name: data
        as_required: true
        min: 1
        max: 1
        allows_value: false
        allows_empty: false
      - name: index
        default: "the number of values in the data buffer"
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
      - name: overlap
        default: 0
        as_required: true
        min: 0
        max: 1
        allows_value: true
        allows_empty: false
    outputs:
      - name: out1
        as_required: false
        min: 0
        max: 1
      - name: out2
        as_required: false
        min: 0
        max: 1

