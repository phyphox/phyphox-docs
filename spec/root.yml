# The root <phyphox> element and the blocks that describe the experiment itself
# rather than its behaviour: translations, data containers, export and events.
#
# Sources compared for every entry below:
#   Android  PhyphoxFile.java: phyphoxBlockParser, translationsBlockParser,
#            translationBlockParser, dataContainersBlockParser,
#            exportBlockParser, setBlockParser, eventsBlockParser  (b4564695)
#   iOS      Serialization/Handlers/PhyphoxElementHandler.swift and the
#            DataContainers, Translations, Export and Events handlers (a0643729)
#   docs     docs/file-format/index.md
#
# `agreement:` records what that comparison found. See README.md.

block: root
since: "1.0"
summary: >-
  What the experiment is, as opposed to what it does: its title and category,
  the icon and description shown in the collection, its translations, the data
  containers everything else refers to, and how data is exported.

elements:

  - name: phyphox
    since: "1.0"
    summary: The root element. Everything else lives inside it.
    children: [title, state-title, category, icon, color, description, link,
               translations, data-containers, input, output, analysis, views,
               export, network, events]
    attributes:
      - name: version
        type: string
        required: true
        summary: >-
          File format version as major.minor. An app refuses a file declaring a
          version newer than it supports, which is what gates every feature
          added to the format.
        agreement: agreed
      - name: locale
        type: string
        summary: >-
          Language the strings outside the translations block are written in.
          Without it they are assumed to be English.
        agreement: agreed
      - name: isLink
        type: boolean
        default: false
        since: "1.13"
        summary: >-
          Marks a collection entry that is not a runnable experiment but a
          redirect: selecting it sends the user to the page named by its link
          rather than opening an experiment.
        agreement: agreed
        note: >-
          Absent from Android's main parser by design, and this is worth knowing
          before reading anything into it. iOS uses one parser for both the
          collection and a running experiment, so it handles the attribute
          there. Android has two: the full parser in PhyphoxFile.java and a
          minimal one that only builds the experiment list. Because isLink means
          the file is never opened as an experiment, the full parser never sees
          it, and only the list parser
          (ExperimentList/datasource/AssetExperimentLoader.java) implements it.
          Searching PhyphoxFile.java alone therefore suggests it is iOS-only,
          which it is not.
      - name: appleBan
        type: boolean
        default: false
        summary: Hides the experiment from the collection on Apple platforms.
        agreement: platform
        platforms: [ios]
        undocumented: intentionally
        note: >-
          Exists because an App Store review once required a particular
          experiment to be disabled, on the grounds that it was dangerous to the
          hardware. Years later an Apple representative agreed in conversation
          that the objection had been unfounded and suggested quietly re-enabling
          it to see whether anyone objected; nobody did. So the attribute is
          currently unused, and is kept for the next time something similar
          happens. Deliberately left out of the documentation, and Android has no
          reason to read it.

  - name: title
    parent: phyphox
    since: "1.0"
    summary: Title of the experiment, in the base language.
    text: The title. Keep it short.
    attributes: []

  - name: state-title
    parent: phyphox
    since: "1.5"
    summary: >-
      Title the user gave when saving the state of an experiment. Present only
      in saved states, not in distributed experiments.
    text: The saved-state title.
    attributes: []

  - name: category
    parent: phyphox
    since: "1.0"
    summary: >-
      Category the experiment is grouped under. Should be translated, since the
      app groups by the localised value.
    text: The category name.
    attributes: []

  - name: icon
    parent: phyphox
    since: "1.0"
    summary: Icon shown in the collection.
    text: Up to three characters, or a base64-encoded image.
    attributes:
      - name: format
        description: >-
          Controls whether the element's text is interpreted as a
          string or as a base64-encoded image. From a string phyphox
          takes the first three characters - fewer is fine - and
          draws a simple icon with them. A base64 image is decoded
          and displayed; a small PNG with few colours works best.
        type: enum
        values: [string, base64]
        default: string
        summary: Whether the text is characters or an encoded image.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  - name: color
    parent: phyphox
    since: "1.0"
    summary: >-
      Base colour of the experiment, used behind the icon and for the category
      label.
    text: A six-digit hex value or a named colour.
    attributes: []

  - name: description
    parent: phyphox
    since: "1.0"
    summary: >-
      Description shown in the collection. The first line appears in the list,
      so it should say what the experiment measures.
    text: The description. Leading and trailing whitespace is stripped per line.
    attributes: []

  - name: link
    parent: phyphox
    since: "1.0"
    summary: >-
      A link shown as a button under the description. Several may be given.
    text: The URL.
    attributes:
      - name: label
        description: >-
          The text on the button offered under the experiment
          description. The label also identifies the link: a link element
          inside a translation block replaces the URL of the base link
          carrying the same label. How the label itself is localised
          differs between the platforms.
        type: string
        translatable: true
        summary: Text on the button.
        agreement: divergent
        inconsistency: translation-link-matching
        note: >-
          iOS passes the base label through the string-translation mechanism
          when displaying it (Experiment.swift localizedLinks ->
          localizeString); Android shows the raw map key everywhere
          (Experiment.java btn.setText(label), link.setTitle(entry.getKey()))
          and applies string translations to link labels nowhere. The
          translatable flag above is therefore iOS behaviour only until the
          entry is decided.
      - name: highlight
        description: >-
          If set to true, the link is also featured in the
          experiment menu. This is meant for especially relevant
          links such as instructions for the experiment; how a link
          is "highlighted" may change in later versions.
        type: boolean
        default: false
        summary: >-
          Also show the link in the experiment menu, for something as important
          as instructions.
        agreement: agreed

  - name: translations
    parent: phyphox
    since: "1.0"
    summary: Container for the translations of everything shown to the user.
    attributes: []
    children: [translation]

  - name: translation
    parent: translations
    since: "1.0"
    summary: All translations for one language.
    children: [title, category, description, link, string]
    attributes:
      - name: locale
        type: string
        required: true
        summary: Two-character ISO language code.
        agreement: agreed

  - name: string
    parent: translation
    since: "1.0"
    summary: Translation of one string used elsewhere in the experiment.
    text: The translated text.
    attributes:
      - name: original
        type: string
        required: true
        summary: The string to replace, exactly as written elsewhere in the file.
        agreement: agreed

  # The localised counterparts of the elements above. Same names, same meaning,
  # inside a translation rather than at the root.
  - name: title
    parent: translation
    since: "1.0"
    summary: Localised title, replacing the one in the base language.
    text: The translated title.
    attributes: []

  - name: category
    parent: translation
    since: "1.0"
    summary: >-
      Localised category. The app groups experiments by this value, so an
      untranslated category puts the experiment in a separate group.
    text: The translated category.
    attributes: []

  - name: description
    parent: translation
    since: "1.0"
    summary: Localised description.
    text: The translated description.
    attributes: []

  - name: link
    parent: translation
    since: "1.0"
    summary: Localised link, replacing the one with the same label.
    description: >-
      Replaces the URL of the base link that carries exactly the same label,
      so only the links whose URL changes with the language have to be
      declared. What happens to a link whose label matches no base link, and
      how the button text itself is localised, currently differ between the
      platforms.
    text: The URL.
    attributes:
      - name: label
        type: string
        summary: The label of the base link whose URL is replaced.
        agreement: divergent
        inconsistency: translation-link-matching
        note: >-
          Matching by label is agreed (Android experiment.links.put(label, ...)
          in both parsers; iOS localizeLink looks up translatedLinks by the
          base label). Divergent is the rest: an unmatched label adds a button
          on Android and is dropped on iOS, and the label doubles as display
          text on Android while iOS displays the string-translated base label.
      - name: highlight
        type: boolean
        default: false
        summary: >-
          Meant to feature the link in the experiment menu; its effect on a
          translated link differs between the platforms.
        agreement: divergent
        inconsistency: translation-link-matching
        note: >-
          Android honours it but into a separate map (highlightedLinks), so a
          translated link that omits it leaves a highlighted base link's menu
          entry at the old URL. iOS ignores it on translated links entirely -
          highlighting comes from the base link (Experiment.swift
          localizedLinks copies $0.highlighted).

  - name: data-containers
    parent: phyphox
    since: "1.0"
    summary: Declares the buffers every other block reads from and writes to.
    attributes: []
    children: [container]

  - name: container
    parent: data-containers
    since: "1.0"
    summary: One named buffer.
    text: The buffer name, as referred to everywhere else.
    attributes:
      - name: size
        description: >-
          The size of the data container. For the buffer type this
          is the number of values the buffer can hold. A buffer is a
          queue of fixed length: new data is appended until it is
          full, and then old data is removed from the other end.
          Setting the size to zero makes the buffer infinite, which
          needs care - never keep filling an infinite buffer that is
          the base for complex analysis, as the load grows without
          bound as the experiment runs. An infinite buffer is also
          not allowed to hold the recording from an audio input.
        type: integer
        default: 1
        summary: >-
          Capacity in values. A full buffer discards its oldest value. 0 means
          it grows without limit.
        agreement: agreed
      - name: init
        description: >-
          If set, the buffer is initialized with the given value
          when the experiment is loaded and whenever the data is
          cleared. If not set, the buffer starts empty. Since file
          format 1.5 several values may be given, separated by
          commas, to initialize a buffer with more than one value.
        type: string
        summary: >-
          Values the buffer starts with, comma-separated. Also what it returns
          to when cleared.
        agreement: agreed
      - name: static
        description: >-
          If set to true, the content of this buffer should only be
          written once. Analysis modules writing to this buffer will
          not execute if all their output buffers are static, which
          improves performance. Set it when the content does not
          depend on measured data.
        type: boolean
        default: false
        summary: Keeps the buffer's contents when the user clears data.
        agreement: agreed
      - name: type
        description: >-
          The only type supported right now is buffer. This
          attribute can be ignored for now, but other container
          types may be added in the future.
        type: enum
        values: [buffer]
        default: buffer
        summary: >-
          Reserved for future container types. Only "buffer" is valid.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: clearGroup
        description: >-
          If set, the buffer is not cleared automatically when the
          user presses the trash symbol. Instead the string assigned
          to clearGroup is offered as an option the user can select.
          This is particularly useful for settings or calibration
          data that should survive deleting the measurement. Several
          data containers can share a clearGroup, and the string can
          be translated - take care that translated names stay
          distinct, since it is the translated name that addresses
          the group. Assigning the special clearGroup "_" (a single
          underscore) means the buffer is never offered for clearing
          at all.
        type: string
        translatable: true
        since: "1.20"
        summary: >-
          Exempts the buffer from the trash button and offers this name as a
          group the user may clear instead, so settings and calibration data
          survive clearing measurements. Several containers may share a group.
          The special value "_" is never offered, making the buffer unclearable.
          Since the name is translatable, translated group names must stay
          distinct from one another.
        agreement: agreed

  - name: export
    parent: phyphox
    since: "1.0"
    summary: >-
      Groups data containers into the sets offered when the user exports data.
    attributes: []
    children: [set]

  - name: set
    parent: export
    since: "1.0"
    summary: One sheet or file of the export.
    children: [data]
    attributes:
      - name: name
        description: >-
          Shown to the user when they pick which sets to export, and
          often represented in the exported file - a CSV export
          produces a ZIP with one file per set, an Excel export one
          sheet per set.
        type: string
        translatable: true
        required: true
        summary: Name of the set, used as the sheet or file name.
        agreement: agreed

  - name: data
    parent: set
    since: "1.0"
    summary: One column of the set.
    text: Name of the data container to export.
    attributes:
      - name: name
        description: >-
          A name describing the data. This is usually the column
          title corresponding to the data in the exported file.
        type: string
        translatable: true
        required: true
        summary: Column title in the exported file.
        agreement: agreed

  - name: events
    parent: phyphox
    since: "1.12"
    summary: >-
      Start and pause events recorded with a saved experiment state, so that
      timestamps can be related to the real world. Written by the app rather
      than by hand, and intended to be replaced by a proper state format.
    attributes: []
    children: [start, pause]
    note: >-
      iOS accepts any child whose name matches a TimeMappingEvent, which includes
      <clear> as well as <start> and <pause>; Android switches on the two the
      documentation names. No file should contain a clear event - the event list
      is emptied when data is cleared, so it never survives to be written - so
      this is latitude on the iOS side rather than a divergence in the format.

  - name: start
    parent: events
    since: "1.12"
    summary: The experiment was started.
    attributes: &event_attributes
      - name: experimentTime
        type: float
        default: -1.0
        summary: Seconds since the measurement first started, excluding pauses.
        agreement: agreed
      - name: systemTime
        type: string
        summary: Milliseconds since the Unix epoch.
        agreement: agreed

  - name: pause
    parent: events
    since: "1.12"
    summary: The experiment was paused.
    attributes: *event_attributes

# The named colours every attribute of type color accepts, matched
# case-insensitively; the alternative is exactly six hex digits, optionally
# prefixed with '#' (rules.yml, color-invalid-value). The names and values are
# duplicated per implementation; tools/hooks.py checks the table on the Colors
# documentation page against this list.
#
# Sources compared 2026-08-13: RGB.java with res/values/colors.xml (Android),
# Constants.swift namedColors (iOS), PhyphoxColor.ts (Blockly editor). All
# fourteen names and values agree everywhere (weakorange diverged on Android
# until it was corrected the same day).

colors:
  agreement: agreed
  names:
    - {name: orange,      hex: ff7e22}
    - {name: red,         hex: fe005d}
    - {name: magenta,     hex: eb46f4}
    - {name: blue,        hex: 39a2ff}
    - {name: green,       hex: 2bfb4c}
    - {name: yellow,      hex: edf668}
    - {name: white,       hex: ffffff}
    - {name: weakorange,  hex: ffc399}
    - {name: weakred,     hex: ff7cac}
    - {name: weakmagenta, hex: f6aafa}
    - {name: weakblue,    hex: 9dd1ff}
    - {name: weakgreen,   hex: a1fdaf}
    - {name: weakyellow,  hex: e7e09b}
    - {name: weakwhite,   hex: c4c4c4}
