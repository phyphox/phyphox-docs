# The <views> block, modeled completely.
#
# Sources compared for every entry below:
#   Android  PhyphoxFile.java, viewsBlockParser / viewBlockParser (b4564695)
#   iOS      Serialization/Handlers/ViewsElementHandler.swift and
#            Serialization/Handlers/ViewHandlers/*.swift            (a0643729)
#   docs     docs/file-format/views/ (index, basics, graph, user-input, preview)
#
# `agreement:` records what that comparison found. See README.md. Where an entry
# has since been decided, `rules:` names the rule in rules.yml that settles it.
#
# Two structural notes that apply throughout and are not repeated per element:
#
#  * label and visibility are accepted on every view element by both apps.
#    Android reads them once before dispatching on the tag; iOS declares them in
#    each handler. Same surface, different mechanics.
#  * Several child elements carry their meaning in their TEXT, not in an
#    attribute - an <output> names a buffer, a <trigger> names an id, a
#    <map> carries the label to show. Those are recorded with `text:`.
#  * Android additionally reads `unit` and `factor` before dispatching, so they
#    are accepted syntactically on every element, but only `value` and `edit` do
#    anything with them - which is also where iOS declares them. Modeled here as
#    belonging to those two elements.

block: views
since: "1.0"
summary: >-
  How the experiment presents itself. The block holds one or more `view`
  elements, each a page the user can switch between, and each view holds the
  elements that display or collect data.

common:
  # Declared by <view> and by every view group through `child_attributes:`
  # (see README.md), so a group nested in a group gets them too.
  view_element_attributes:
    - name: label
      type: string
      translatable: true
      summary: >-
        Caption of the element, shown alongside it.
      description: >-
        The caption of the element, shown alongside it - next to a value or
        edit field, on a button, above a graph. It is translatable via the
        translations block. Two exceptions: the info element has no separate
        caption - there, label is the displayed text itself (see info) - and
        separator and image display no label at all; both parsers accept the
        attribute there like everywhere, but it has no effect. Since file
        format 1.21 the label may be left out (absent or empty) on value,
        edit, toggle, dropdown, slider, graph, camera-gui and depth-gui: the
        caption and the space it would take are then omitted and the element
        takes the full row (camera-gui shows its label only in the remote
        interface; the apps' preview carries none). On info and button the label is the content:
        without it an info keeps the height of one line of text and a
        button keeps its size with an empty caption. On the view groups it
        is ignored.
      agreement: agreed
    - name: visibility
      type: string
      since: "1.20"
      summary: >-
        Data container whose last value decides whether the element is shown.
      description: >-
        Points to a data container that decides whether this element is
        shown. If the container is empty or its last value is NaN, zero or
        negative, the element is hidden; if the last value is greater than
        zero, it is visible. The element observes the container, so the
        state can change while the experiment runs - analysis results or
        user inputs like a toggle can show and hide elements dynamically.
        On a view group it hides the whole group; a hidden child of a
        horizontal or grid group gives up its space to its siblings.
      agreement: agreed

  # Declared by <horizontal> only: accepted on each of its direct children.
  # Elsewhere the attribute is unknown and ignored (unknown-attribute-ignored).
  horizontal_child_attributes:
    - name: weight
      type: float
      default: 1
      since: "1.21"
      summary: >-
        Share of the row's width this child gets, relative to its siblings.
      description: >-
        The children of a horizontal group share the row in proportion to
        their weights: with weights 3 and 1 the first child gets three
        quarters of the width. The default 1 on every child gives equal
        widths. Only read on a direct child of horizontal; anywhere else the
        attribute is unknown and ignored.
      agreement: agreed

elements:

  # ------------------------------------------------------------------ views --
  - name: views
    parent: phyphox
    since: "1.0"
    summary: Container for the views of the experiment. At least one is required.
    attributes: []
    children: [view]

  # ------------------------------------------------------------------- view --
  - name: view
    parent: views
    since: "1.0"
    summary: One page of the experiment, listed in the view selector.
    children: [info, separator, value, graph, edit, button, toggle, slider,
               dropdown, image, camera-gui, depth-gui,
               vertical, horizontal, grid, stack]
    child_attributes: [view_element_attributes]
    attributes:
      - name: label
        description: >-
          The name identifying this view. Will be translated if a
          matching translation string is defined.
        type: string
        translatable: true
        summary: Name shown in the view selector.
        agreement: agreed
      # A visibility attribute for whole views (hiding pages from the view
      # selector) is an idea that was never implemented: Android does not
      # read it (PhyphoxFile.java, case "view", label only) and iOS parses
      # it into ViewCollectionDescriptor and drops it when building the
      # experiment (PhyphoxElementHandler.swift). Removed from the docs
      # 2026-08-20 per maintainer ruling; the dead iOS parse is harmless
      # (the value is dropped, never applied) and was left in place.

  # ------------------------------------------------------------------- info --
  - name: info
    parent: [view, vertical, horizontal, grid, stack, transform]
    since: "1.0"
    summary: Static text.
    attributes:
      - name: label
        description: >-
          The text to be displayed to the user. Without a label the element
          shows nothing but keeps the height of a single line of text, so it
          can serve as a spacer that follows the text size.
        type: string
        translatable: true
        summary: The text to display.
        agreement: agreed
      - name: color
        description: >-
          The text color as six-digit RGB hex value (eight digits
          with an alpha byte, since 1.21) or a named
          choice from the phyphox [Colors](../colors.md)
        since: "1.7"
        type: color
        rules: [color-invalid-value]
        summary: Text color.
        agreement: agreed
      - name: size
        description: >-
          Sets the font size of the info element as a factor to the
          default size. Hence, the default is 1.
        since: "1.8"
        type: float
        default: 1.0
        summary: Font size, relative to the default.
        agreement: agreed
      - name: align
        description: >-
          Can be set to left (default), center or right. The
          alignment of the text. (Note that phyphox does not yet
          support RTL languages, but this attribute is designed to
          be reversed in such cases.)
        since: "1.8"
        type: enum
        values: [left, right, center]
        default: left
        summary: Horizontal alignment.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: bold
        description: >-
          If set to true, the text will be displayed using a bold
          font. (We cannot guarantee that the combination of bold
          and italic is available on every device.)
        since: "1.8"
        type: boolean
        default: false
        summary: Bold text.
        agreement: agreed
      - name: italic
        description: >-
          If set to true, the text will be displayed using an italic
          font. (We cannot guarantee that the combination of bold
          and italic is available on every device.)
        since: "1.8"
        type: boolean
        default: false
        summary: Italic text.
        agreement: agreed

  # -------------------------------------------------------------- separator --
  - name: separator
    parent: [view, vertical, horizontal, grid, stack, transform]
    since: "1.0"
    summary: Blank space, optionally colored, to group elements visually.
    attributes:
      - name: height
        description: >-
          The height of the separator in text line heights
        type: float
        default: 0.1
        summary: Height relative to the default element height.
        agreement: agreed
      - name: color
        description: >-
          The color of the whole (rectangular) element as six-digit
          RGB hex value (eight digits with an alpha byte, since 1.21)
          or a named choice from the phyphox
          [Colors](../colors.md)
        type: color
        rules: [color-invalid-value]
        summary: Fill color. Defaults to the background, making it invisible.
        agreement: agreed

  # ------------------------------------------------------------------ value --
  - name: value
    parent: [view, vertical, horizontal, grid, stack, transform]
    since: "1.0"
    summary: A single number from a data container, formatted for display.
    children: [input, map]
    attributes:
      - name: verticalLayout
        type: boolean
        default: false
        since: "1.21"
        summary: >-
          Place the label above the element instead of to its left, both
          taking the full width.
        description: >-
          By default the label sits in the left half of the row and the
          element in the right half. With verticalLayout the label is shown
          on its own line above the element and both take the full width,
          left-aligned - the layout for a narrow column of a horizontal or
          grid group. Without a label the attribute has no effect.
        agreement: agreed
      - name: align
        type: enum
        values: [left, right, center]
        default: left
        since: "1.21"
        summary: >-
          Horizontal alignment of the label and the value with its unit when they
          take the full width.
        description: >-
          Applies when the element is laid out at full width, i.e. with
          verticalLayout="true" or without a label: the label line and
          the value with its unit are then aligned left, centred or right within the
          element's width. A control that spans the whole width anyway keeps
          its width, and only its text content follows the alignment. In the
          default layout, label in the left half and value with its unit in the right half,
          the attribute has no effect. The values are those of the info
          element's align attribute.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: color
        description: >-
          The text color as six-digit RGB hex value (eight digits
          with an alpha byte, since 1.21) or a named
          choice from the phyphox [Colors](../colors.md)
        since: "1.7"
        type: color
        rules: [color-invalid-value]
        summary: Text color.
        agreement: agreed
      - name: size
        description: >-
          The size of the displayed value relative to the default
          font size. Label and unit will stay at their original
          size.
        since: "1.2"
        type: float
        default: 1.0
        summary: Font size, relative to the default.
        agreement: agreed
      - name: precision
        description: >-
          The number of digits after the decimal point.
        type: integer
        default: 2
        summary: Digits after the decimal point.
        agreement: agreed
      - name: scientific
        description: >-
          If set to true, the value will be displayed in scientific
          notation (1.0e-3 instead of 0.001)
        type: boolean
        default: false
        summary: Use scientific notation.
        agreement: agreed
      - name: unit
        description: >-
          A unit to be displayed after the value
        type: string
        translatable: true
        summary: Unit appended to the value.
        agreement: agreed
      - name: factor
        description: >-
          A factor to be applied to the value before displaying it.
          This is usually used for unit conversion. Example: The
          data is in meters, but should be displayed in cm. The
          factor would be 100
        type: float
        default: 1.0
        summary: The value is multiplied by this before display.
        agreement: agreed
      - name: positiveUnit
        description: >-
          Replace the regular unit with this if the value is
          positive.
        since: "1.19"
        type: string
        translatable: true
        summary: Unit used when the value is positive, overriding unit.
        agreement: agreed
      - name: negativeUnit
        description: >-
          Replace the regular unit with this if the value is
          negative.
        since: "1.19"
        type: string
        translatable: true
        summary: >-
          Unit used when the value is negative, overriding unit. The value is
          displayed without its sign.
        agreement: agreed
      - name: format
        value_notes:
          float: >-
            Show a simple decimal value, with significant digits,
            scientific notation and so on as defined by the other
            attributes.
          degree-minutes: >-
            Split the decimal part of the value off and show it
            separately in minutes (parts of 60). The output is
            formatted as degrees and minutes, and the attribute
            precision affects the minutes part in this format.
            Example: 42.385 becomes 42° 23.1'
          degree-minutes-seconds: >-
            Split the decimal part of the value off and show it
            separately in minutes (parts of 60) and seconds (parts
            of 3600). The output is formatted as degrees, minutes
            and seconds, and the attribute precision affects the
            seconds part in this format. Example: 42.385 becomes
            42° 23' 6"
          ascii: >-
            Convert all values in the data container to their
            ASCII character representation and show them as text.
            Non-integer values and those outside the range
            [32,125] will be skipped.
        description: >-
          Choose alternative formats to show the value.
        type: enum
        values: [float, degree-minutes, degree-minutes-seconds, ascii]
        default: float
        summary: Format specifier for the displayed number.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  - name: input
    parent: value
    since: "1.0"
    summary: The data container whose last value is displayed. Exactly one required.
    text: Name of the data container.
    attributes: []

  - name: map
    parent: value
    since: "1.0"
    summary: >-
      Replaces a range of values with a fixed text, so a number can be shown as
      a word.
    text: The text to show when the value falls in this range.
    attributes:
      - name: min
        type: float
        default: -Infinity
        summary: Lower bound of the range, inclusive.
        agreement: agreed
      - name: max
        type: float
        default: Infinity
        summary: Upper bound of the range, inclusive.
        agreement: agreed

  # ------------------------------------------------------------------ graph --
  - name: graph
    parent: [view, vertical, horizontal, grid, stack, transform]
    since: "1.0"
    summary: A plot of one or more data containers.
    children: [input, output]
    attributes:
      - name: labelX
        description: >-
          The label of the x axis
        since: "1.7"
        type: string
        translatable: true
        summary: Label of the x axis.
        agreement: agreed
      - name: labelY
        description: >-
          The label of the y axis
        since: "1.7"
        type: string
        translatable: true
        summary: Label of the y axis.
        agreement: agreed
      - name: labelZ
        description: >-
          The label of the z axis
        type: string
        translatable: true
        summary: Label of the z axis, for map styles.
        agreement: agreed
      - name: unitX
        description: >-
          The unit of the x axis
        since: "1.7"
        type: string
        translatable: true
        summary: Unit of the x axis.
        agreement: agreed
      - name: unitY
        description: >-
          The unit of the y axis
        since: "1.7"
        type: string
        translatable: true
        summary: Unit of the y axis.
        agreement: agreed
      - name: unitZ
        type: string
        translatable: true
        summary: Unit of the z axis.
        agreement: agreed
      - name: unitYperX
        description: >-
          An explicit unit for slopes. If not set, phyphox will use
          "unitY / unitX".
        since: "1.10"
        type: string
        translatable: true
        summary: Unit shown for the slope when the user measures on the graph.
        agreement: agreed
      - name: timeOnX
        description: >-
          If set to true, the x data needs to be time data in
          seconds relative to the first start of the experiment.
          This allows marking start/pause events and switching to a
          system time scale (i.e. absolute date and time) on the x
          axis.
        since: "1.12"
        type: boolean
        default: false
        summary: Treat x values as timestamps and label the axis as a clock.
        agreement: agreed
      - name: timeOnY
        description: >-
          If set to true, the y data needs to be time data in
          seconds relative to the first start of the experiment.
          This allows marking start/pause events and switching to a
          system time scale (i.e. absolute date and time) on the y
          axis.
        since: "1.12"
        type: boolean
        default: false
        summary: Treat y values as timestamps.
        agreement: agreed
      - name: systemTime
        description: >-
          If set to true, time axes will start as a system time
          scale (they can always be switched by the user).
        since: "1.12"
        type: boolean
        default: false
        summary: Show absolute system time rather than time since the start.
        agreement: agreed
      - name: linearTime
        description: >-
          If set to true, the time on each axis is interpreted as
          "linear" time, which is identical to "experiment" time
          with the difference that the time stamp increases even
          when phyphox is paused. This especially allows plotting
          data from external sources that have their own internal
          clock. In these cases you can use the timer module to get
          a reference time to shift data from an external clock
          appropriately. If the graph is shown with system time on
          the axis, all data is shown, but if the axis is set to
          experiment time, the data points with linear time
          corresponding to times during which phyphox was paused
          will be hidden. If linearTime is set to false, experiment
          time (the default) is expected.
        since: "1.12"
        type: boolean
        default: false
        summary: Ignore pauses when converting experiment time to a clock.
        agreement: agreed
      - name: hideTimeMarkers
        description: >-
          If set to true, no red markers are shown to indicate times
          at which the experiment was stopped.
        since: "1.14"
        type: boolean
        default: false
        summary: Do not mark starts and pauses on a time axis.
        agreement: agreed
      - name: aspectRatio
        description: >-
          The ratio of the total width of this element to its total
          height in the view, including labels and axes.
        type: float
        default: 2.5
        summary: Width divided by height.
        agreement: agreed
      - name: style
        description: >-
          If set to *dots*, the graph will not connect the values
          with lines. See below for additional styles introduced
          with file format 1.7 (phyphox 1.1.0).
        since: "1.7"
        type: enum
        values: [lines, dots, hbars, vbars, map]
        default: lines
        summary: How the data is drawn.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
        note: >-
          iOS's GraphStyle also has a `mapZ` case, which is not a value the file
          format accepts - it exists only so the remote interface can identify
          the third buffer of a map. Not part of the format.
      - name: partialUpdate
        description: >-
          If set to true, this allows optimizations which only work
          if the data is appended with increasing x values. A
          typical example is sensor data: Only few new values are
          added and each data point has a greater timestamp than the
          previous one. In such cases this should be set to true as
          it allows the web interface to only transfer these new
          datapoints.
        type: boolean
        default: false
        summary: Send only new data to the remote interface rather than the whole buffer.
        agreement: agreed
      - name: history
        description: >-
          **Deprecation warning**: This feature has been marked as
          deprecated and will be removed soon. Please implement it
          in phyphox analysis logic by using additional
          data-containers and copying the shown graph into these on
          each update. This has several advantages like being able
          to export the history data and better control over its
          style. Original description: The number of graphs to be
          shown. 1 means, that the current data is shown. n means,
          that n graphs are shown, with n-1 graphs containing the
          data from the previous update. This attribute only makes
          sense, when the whole graph is replaced on each analysis
          cycle and can be used to compare the previous n results
          within a single graph. **Deprecated since phyphox file
          format 1.15 (phyphox 1.1.12)**
        type: integer
        default: 1
        deprecated: true
        summary: >-
          Deprecated in file format 1.15 (phyphox 1.1.12). The number of past
          datasets kept on screen; do it in analysis instead, by copying the
          shown data into additional containers on each update.
        agreement: agreed
      - name: lineWidth
        description: >-
          Width of the graph line relative to the default width
        type: float
        default: 1.0
        summary: Line or dot size, relative to the default.
        agreement: agreed
      - name: color
        description: >-
          Color of the graph line as six-digit RGB hex value (eight
          digits with an alpha byte, since 1.21) or a
          named choice from the phyphox [Colors](../colors.md)
        type: color
        rules: [color-invalid-value]
        summary: Color of the first dataset.
        agreement: agreed
      - name: logX
        description: >-
          If set to true, the x axis will be on a logarithmic scale
        type: boolean
        default: false
        summary: Logarithmic x axis.
        agreement: agreed
      - name: logY
        description: >-
          If set to true, the y axis will be on a logarithmic scale
        type: boolean
        default: false
        summary: Logarithmic y axis.
        agreement: agreed
      - name: logZ
        description: >-
          If set to true, the z axis will be on a logarithmic scale
        type: boolean
        default: false
        summary: Logarithmic z axis.
        agreement: agreed
      - name: xPrecision
        description: >-
          The number of significant digits on the x axis.
        since: "1.2"
        type: integer
        default: -1
        summary: Digits on the x axis. -1 picks automatically.
        agreement: agreed
      - name: yPrecision
        description: >-
          The number of significant digits on the y axis.
        since: "1.2"
        type: integer
        default: -1
        summary: Digits on the y axis.
        agreement: agreed
      - name: zPrecision
        description: >-
          The number of significant digits on the z axis.
        type: integer
        default: -1
        summary: Digits on the z axis.
        agreement: agreed
      - name: suppressScientificNotation
        description: >-
          If set to true, phyphox will never use scientific notation
          like 2e-5 instead of 0.00002. This also changes the
          behavior of xPrecision and yPrecision to refer to decimal
          digits instead of significant digits. Please make sure
          that this works well with your measured data as forcing
          non-scientific notation can lead to extreme numbers in
          some edge cases.
        since: "1.19"
        type: boolean
        default: false
        summary: Never label axes in scientific notation.
        agreement: agreed
      - name: scaleMinX
        description: >-
          Method to scale the minimum of the x axis. auto always
          scales this value to the minimum of the data set. extend
          scales to the historic minimum. fixed sets the minimum to
          minX.
        type: enum
        values: [auto, extend, fixed]
        default: auto
        summary: How the lower x bound is chosen.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: scaleMaxX
        description: >-
          Method to scale the maximum of the x axis. auto always
          scales this value to the maximum of the data set. extend
          scales to the historic maximum. fixed sets the maximum to
          maxX.
        type: enum
        values: [auto, extend, fixed]
        default: auto
        summary: How the upper x bound is chosen.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: scaleMinY
        description: >-
          Method to scale the minimum of the y axis. auto always
          scales this value to the minimum of the data set. extend
          scales to the historic minimum. fixed sets the minimum to
          minY.
        type: enum
        values: [auto, extend, fixed]
        default: auto
        summary: How the lower y bound is chosen.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: scaleMaxY
        description: >-
          Method to scale the maximum of the y axis. auto always
          scales this value to the maximum of the data set. extend
          scales to the historic maximum. fixed sets the maximum to
          maxY.
        type: enum
        values: [auto, extend, fixed]
        default: auto
        summary: How the upper y bound is chosen.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: scaleMinZ
        description: >-
          Method to scale the minimum of the z axis. auto always
          scales this value to the minimum of the data set. extend
          scales to the historic minimum. fixed sets the minimum to
          minZ.
        type: enum
        values: [auto, extend, fixed]
        default: auto
        summary: How the lower z bound is chosen.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: scaleMaxZ
        description: >-
          Method to scale the maximum of the z axis. auto always
          scales this value to the maximum of the data set. extend
          scales to the historic maximum. fixed sets the maximum to
          maxZ.
        type: enum
        values: [auto, extend, fixed]
        default: auto
        summary: How the upper z bound is chosen.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: minX
        description: >-
          Lowest value on the x axis. Only applied if scaleMinX =
          fixed
        type: float
        default: 0.0
        summary: Lower x bound, used when scaleMinX is fixed or extend.
        agreement: agreed
      - name: maxX
        description: >-
          Highest value on the x axis. Only applied if scaleMaxX =
          fixed
        type: float
        default: 0.0
        summary: Upper x bound.
        agreement: agreed
      - name: minY
        description: >-
          Lowest value on the y axis. Only applied if scaleMinY =
          fixed
        type: float
        default: 0.0
        summary: Lower y bound.
        agreement: agreed
      - name: maxY
        description: >-
          Highest value on the y axis. Only applied if scaleMaxY =
          fixed
        type: float
        default: 0.0
        summary: Upper y bound.
        agreement: agreed
      - name: minZ
        description: >-
          Lowest value on the z axis. Only applied if scaleMinZ =
          fixed
        type: float
        default: 0.0
        summary: Lower z bound.
        agreement: agreed
      - name: maxZ
        description: >-
          Highest value on the z axis. Only applied if scaleMaxZ =
          fixed
        type: float
        default: 0.0
        summary: Upper z bound.
        agreement: agreed
      - name: followX
        description: >-
          If set to true, the graph follows new data with a fixed x
          axis scale. This is the same as selecting "follow new"
          data from the zoom dialog. The width of the x axis has to
          be defined by setting minX and maxX. Setting followX
          overrides scaleMinX and scaleMaxX and also forces
          partialUpdate to true.
        since: "1.15"
        type: boolean
        default: false
        summary: Keep the newest data in view by scrolling the x axis.
        agreement: agreed
      - name: plotLeft
        type: float
        since: "1.21"
        summary: >-
          Left edge of the plot area, as a fraction of the graph element's
          width measured from its left edge.
        description: >-
          Fixes the plot area - the rectangle the data is drawn in, without
          axes, tics and labels - as fractions of the graph element's box:
          plotLeft and plotRight are measured from the element's left edge,
          plotTop and plotBottom from its top edge, all between 0 and 1.
          Without these attributes the plot area is laid out automatically
          around the labels, and shifts as tic labels grow. Set them to align
          a plot with an image below it in a stack. Setting any of the four
          fixes the layout; an unset one defaults to the corresponding edge of
          the element (0 for plotLeft and plotTop, 1 for plotRight and
          plotBottom). The labels, tics and the graph's own label are then
          drawn in whatever space remains outside the plot area, and dropped
          where they do not fit.
        agreement: agreed
      - name: plotTop
        type: float
        since: "1.21"
        summary: >-
          Top edge of the plot area, as a fraction of the graph element's
          height measured from its top edge. See plotLeft.
        agreement: agreed
      - name: plotRight
        type: float
        since: "1.21"
        summary: >-
          Right edge of the plot area, as a fraction of the graph element's
          width measured from its left edge. See plotLeft.
        agreement: agreed
      - name: plotBottom
        type: float
        since: "1.21"
        summary: >-
          Bottom edge of the plot area, as a fraction of the graph element's
          height measured from its top edge. See plotLeft.
        agreement: agreed
      - name: mapWidth
        description: >-
          Number of data points per line.
        type: integer
        default: 0
        summary: Width in points of the lattice built for a map style.
        agreement: agreed
      - name: showColorScale
        description: >-
          Show or hide the color scale above the color plot
        since: "1.19"
        type: boolean
        default: true
        summary: Show the color scale beside a map.
        agreement: agreed
      - name: "mapColor[N]"
        name_pattern: "mapColor[1-9][0-9]*"
        type: color
        rules: [color-invalid-value]
        summary: >-
          The n-th stop of the color scale for a map style, for any n from 1
          upward (mapColor1, mapColor2, ...). The stops are read in order and
          the scale ends at the first number that is absent, so they must be
          numbered without gaps.
        agreement: agreed
        note: >-
          Both parsers construct the name dynamically - Android as
          "mapColor" + index in a loop (GraphView setup via PhyphoxFile),
          iOS via dynamic attribute keys in a while loop
          (GraphViewElementHandler.swift, whose enum cases mapColor1-9 are
          vestigial). The count is unbounded on both. name_pattern makes the
          validators accept every matching name.
      - name: interpolateMapColors
        description: >-
          Interpolate area between data points. If disabled, phyphox
          expects the datapoints to be aligned on an evenly spaced
          rectangular grid and will show each datapoint as a
          rectangular "pixel" centered on the data point's x/y
          coordinate. Default behavior is to assign colors to the
          data point coordinates and interpolate colors in between.
        type: boolean
        default: true
        summary: >-
          Interpolate the colors between the data points. If disabled, each data
          point shows as a homogeneously colored rectangular "pixel" instead -
          suited for displaying image data.
        since: "1.20"
        agreement: agreed
      - name: pickLabel
        description: >-
          Rename the "Pick data" button to show the user the
          purpose of the data picker (see data picker feature
          below).
        type: string
        translatable: true
        since: "1.20"
        summary: >-
          Renames the "Pick data" button, to say what picking is for. Part of the
          data picker, configured by the graph's output tags.
        agreement: agreed

  - name: input
    parent: graph
    since: "1.0"
    summary: One dataset axis of a graph, naming the data container to plot.
    text: Name of the data container to plot on this axis.
    remark: >-
      Several datasets are defined by several inputs: every y input is one
      dataset. When the file provides exactly as many x inputs as y inputs
      (z inputs do not count), they are matched 1-on-1 in order of
      appearance, regardless of interleaving - but write new files with
      each x before its y: the other orders are only supported for
      backwards compatibility and re-pair silently when an input is
      removed. With fewer x than y inputs,
      each y is plotted against the most recent preceding x input - so
      several datasets share one x by naming it once - or against its
      element index if no x input preceded it; any x input that no y input
      uses - trailing or shadowed - is an error. The per-dataset attributes
      color, lineWidth and style may sit on either input of a dataset; an
      attribute on the y input wins over one on its x input, a z input
      overrides both, and the graph-level attributes are the defaults for
      every dataset.
    attributes:
      - name: axis
        type: enum
        required: true
        values: [x, y, z]
        summary: Which axis this container supplies.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: color
        type: color
        rules: [color-invalid-value]
        summary: Color of this dataset, overriding the graph's color.
        agreement: agreed
      - name: lineWidth
        type: float
        summary: Line width of this dataset, overriding the graph's.
        agreement: agreed
      - name: style
        type: enum
        values: [lines, dots, hbars, vbars, map]
        summary: Style of this dataset, overriding the graph's.
        agreement: agreed
      # mapWidth is a graph-level attribute only (ruled 2026-08-20):
      # map plots cannot be combined with other graph types and multiple
      # map plots make no sense.

  - name: output
    parent: graph
    since: "1.20"
    summary: >-
      Configures the data picker: one button offered to the user when they pick a
      point on the maximized graph, writing a coordinate of that point into a
      data container. Any number may be given.
    text: Name of the data container receiving the picked coordinate.
    attributes:
      - name: axis
        type: enum
        required: true
        values: [x, xcal, y, ycal, z, zcal]
        summary: >-
          Which coordinate of the picked point to write. The `cal` variants
          modify the preceding output of the same axis: instead of writing
          immediately, the user is prompted for a value, the point's coordinate
          goes to the plain output and the entered value to the `cal` one. That
          is how two points are mapped to reference values for a calibration.
        agreement: agreed
      - name: label
        type: string
        translatable: true
        summary: Text of the button offered for this output once a point is picked.
        agreement: agreed

  # ------------------------------------------------------------------- edit --
  - name: edit
    parent: [view, vertical, horizontal, grid]
    since: "1.0"
    summary: A field for the user to type a value into a data container.
    children: [output]
    attributes:
      - name: verticalLayout
        type: boolean
        default: false
        since: "1.21"
        summary: >-
          Place the label above the element instead of to its left, both
          taking the full width.
        description: >-
          By default the label sits in the left half of the row and the
          element in the right half. With verticalLayout the label is shown
          on its own line above the element and both take the full width,
          left-aligned - the layout for a narrow column of a horizontal or
          grid group. Without a label the attribute has no effect.
        agreement: agreed
      - name: align
        type: enum
        values: [left, right, center]
        default: left
        since: "1.21"
        summary: >-
          Horizontal alignment of the label and the edit field with its unit when they
          take the full width.
        description: >-
          Applies when the element is laid out at full width, i.e. with
          verticalLayout="true" or without a label: the label line and
          the edit field with its unit are then aligned left, centred or right within the
          element's width. A control that spans the whole width anyway keeps
          its width, and only its text content follows the alignment. In the
          default layout, label in the left half and edit field with its unit in the right half,
          the attribute has no effect. The values are those of the info
          element's align attribute.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: signed
        description: >-
          If set to *false* the user may not enter negative numbers.
        type: boolean
        default: true
        summary: Allow negative values.
        agreement: agreed
      - name: decimal
        description: >-
          If set to *false* the user may not enter decimal (i.e.
          non-integer) numbers.
        type: boolean
        default: true
        summary: Allow a decimal point.
        agreement: agreed
      - name: min
        description: >-
          The minimum value allowed. Disable by not setting this
          attribute. **Available from phyphox file format 1.1
          (phyphox 1.0.2)**.
        since: "1.1"
        type: float
        default: -Infinity
        summary: Smallest value accepted.
        agreement: agreed
      - name: max
        description: >-
          The maximum value allowed. Disable by not setting this
          attribute. **Available from phyphox file format 1.1
          (phyphox 1.0.2)**.
        since: "1.1"
        type: float
        default: Infinity
        summary: Largest value accepted.
        agreement: agreed
      - name: unit
        description: >-
          A unit to be displayed after the value
        type: string
        translatable: true
        summary: Unit shown after the field.
        agreement: agreed
      - name: factor
        description: >-
          A factor to be applied to the value before displaying it.
          This is usually used for unit conversion. Example: The
          data is in meters, but should be displayed in cm. The
          factor would be 100
        type: float
        default: 1.0
        summary: >-
          The buffer value is multiplied by this for display; an entered
          value is divided by it before being stored.
        agreement: agreed
      - name: default
        description: >-
          The default value of the edit box. The experiment will
          start with this value.
        type: float
        remark: >-
          Applied whenever the buffer is EMPTY, not only once at load: when the
          experiment is opened, after the data is cleared, and at the start of
          each analysis cycle. Without the last two an experiment loses the
          setting the moment anything empties the buffer - a clear, or an
          analysis input without keep - and only gets it back if that element's
          own view happens to be on screen. A value the user has set is not
          overwritten while it is in the buffer; CLEARING IT RESTORES THE
          DEFAULT, even though the control was showing something else, because
          clearing is how a user deliberately returns an experiment to its
          starting state. An author who wants a setting to survive that says so
          with clearGroup on the data container, which is what it is for.
          A NaN at the end of the buffer is replaced by the default as well: an
          input control cannot show NaN and the user could never enter it, so
          the buffer would hold something the control does not. The default is
          written as it stands, never clamped to the element's range - a
          default is deliberate. Replacing a NaN is not user input: it came from
          an analysis write, and an analysis with onUserInput must not re-run on
          its own output.
        default: 0.0
        summary: Value the field starts with.
        agreement: agreed
  - name: output
    parent: edit
    since: "1.0"
    summary: The data container the entered value is written to.
    text: Name of the data container.
    attributes: []

  # ----------------------------------------------------------------- button --
  - name: button
    parent: [view, vertical, horizontal, grid]
    since: "1.3"
    summary: A button that copies values or triggers a network connection.
    description: >-
      A button that copies values or triggers a network connection. On
      press, each input/output pair is applied INDEPENDENTLY: the output
      container is cleared and the input written to it. Two pairs naming
      the same output container therefore leave only the second value -
      the pairs do not accumulate. Verified identical on both platforms
      2026-08-25 (iOS replaceValues per pair, Android clear-then-append
      per pair); to place several values into one container, use several
      containers and an analysis append module instead.
    children: [input, output, map, trigger]
    attributes:
      - name: label
        description: >-
          The text on the button, and the fallback when dynamicLabel is
          set but no map matches. Without a label (and no matching map) the
          button is shown with an empty caption and keeps its size.
        type: string
        translatable: true
        summary: The button text.
        agreement: agreed
      - name: dynamicLabel
        description: >-
          A buffer (data-container) that controls the label of the
          button. The last value in this buffer is compared to the
          map tags in the button element and the first matching map
          tag determines the button's label.
        type: string
        summary: Data container supplying the button text at runtime.
        agreement: agreed

  - name: input
    parent: button
    since: "1.0"
    summary: >-
      A source copied when the button is pressed. Pair each input with the
      output at the same position.
    text: Name of a data container, or a literal number when type is value.
    attributes:
      - name: type
        type: enum
        values: [buffer, value, empty]
        default: buffer
        summary: >-
          Whether the text names a data container, is a literal value, or stands
          for an empty buffer.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  - name: output
    parent: button
    since: "1.0"
    summary: Where the input at the same position is copied to.
    text: Name of the data container.
    attributes: []

  - name: map
    parent: button
    since: "1.0"
    summary: >-
      Changes the button's label depending on the value of the container named
      by dynamicLabel, the same mechanism the value element uses.
    text: The label to show when the value falls in this range.
    attributes:
      - name: min
        type: float
        default: -Infinity
        summary: Lower bound of the range, inclusive.
        agreement: agreed
      - name: max
        type: float
        default: Infinity
        summary: Upper bound of the range, inclusive.
        agreement: agreed

  - name: trigger
    parent: button
    since: "1.8"
    summary: >-
      Fires the process carrying this id when the button is pressed. This
      triggers network connections whose id matches and, since 1.20, bluetooth
      output inputs whose triggerId matches.
    text: The id to trigger.
    attributes: []

  # ----------------------------------------------------------------- toggle --
  - name: toggle
    parent: [view, vertical, horizontal, grid]
    since: "1.19"
    summary: An on/off switch writing 0 or 1 to a data container.
    children: [output]
    attributes:
      - name: verticalLayout
        type: boolean
        default: false
        since: "1.21"
        summary: >-
          Place the label above the element instead of to its left, both
          taking the full width.
        description: >-
          By default the label sits in the left half of the row and the
          element in the right half. With verticalLayout the label is shown
          on its own line above the element and both take the full width,
          left-aligned - the layout for a narrow column of a horizontal or
          grid group. Without a label the attribute has no effect.
        agreement: agreed
      - name: align
        type: enum
        values: [left, right, center]
        default: left
        since: "1.21"
        summary: >-
          Horizontal alignment of the label and the switch when they
          take the full width.
        description: >-
          Applies when the element is laid out at full width, i.e. with
          verticalLayout="true" or without a label: the label line and
          the switch are then aligned left, centred or right within the
          element's width. A control that spans the whole width anyway keeps
          its width, and only its text content follows the alignment. In the
          default layout, label in the left half and switch in the right half,
          the attribute has no effect. The values are those of the info
          element's align attribute.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: default
        description: >-
          The value with which the associated buffer should start.
        type: float
        remark: >-
          Applied whenever the buffer is EMPTY, not only once at load: when the
          experiment is opened, after the data is cleared, and at the start of
          each analysis cycle. Without the last two an experiment loses the
          setting the moment anything empties the buffer - a clear, or an
          analysis input without keep - and only gets it back if that element's
          own view happens to be on screen. A value the user has set is not
          overwritten while it is in the buffer; CLEARING IT RESTORES THE
          DEFAULT, even though the control was showing something else, because
          clearing is how a user deliberately returns an experiment to its
          starting state. An author who wants a setting to survive that says so
          with clearGroup on the data container, which is what it is for.
          A NaN at the end of the buffer is replaced by the default as well: an
          input control cannot show NaN and the user could never enter it, so
          the buffer would hold something the control does not. The default is
          written as it stands, never clamped to the element's range - a
          default is deliberate. Replacing a NaN is not user input: it came from
          an analysis write, and an analysis with onUserInput must not re-run on
          its own output.
        default: 0.0
        summary: State the switch starts in.
        agreement: agreed

  - name: output
    parent: toggle
    since: "1.19"
    summary: The data container receiving 0 or 1 as the switch is toggled.
    text: Name of the data container.
    attributes: []

  # ----------------------------------------------------------------- slider --
  - name: slider
    parent: [view, vertical, horizontal, grid]
    since: "1.19"
    summary: A slider for choosing a value, or a range with two handles.
    children: [output]
    attributes:
      - name: verticalLayout
        type: boolean
        default: false
        since: "1.21"
        summary: >-
          Place the label above the element instead of to its left, both
          taking the full width.
        description: >-
          By default the label sits in the left half of the row and the
          element in the right half. With verticalLayout the label is shown
          on its own line above the element and both take the full width,
          left-aligned - the layout for a narrow column of a horizontal or
          grid group. On a slider this only applies with showValue: the
          label, the current value and the slider then take three rows.
          Without a label the attribute has no effect.
        agreement: agreed
      - name: align
        type: enum
        values: [left, right, center]
        default: left
        since: "1.21"
        summary: >-
          Horizontal alignment of the label and the current value when they
          take the full width.
        description: >-
          Applies when the element is laid out at full width, i.e. with
          verticalLayout="true" or without a label (on a slider, only with showValue, where the label and the current value take rows of their own; the slider bar keeps its row): the label line and
          the current value are then aligned left, centred or right within the
          element's width. A control that spans the whole width anyway keeps
          its width, and only its text content follows the alignment. In the
          default layout, label in the left half and current value in the right half,
          the attribute has no effect. The values are those of the info
          element's align attribute.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: minValue
        description: >-
          Value for a handle at the lower end of the slider.
        type: float
        default: 0.0
        summary: Value at the left end.
        agreement: agreed
      - name: maxValue
        description: >-
          Value for a handle at the upper end of the slider.
        type: float
        default: 1.0
        summary: Value at the right end.
        agreement: agreed
      - name: stepSize
        description: >-
          Determines the minimum distance between two values that can
          be selected with the slider. This is always relative to
          minValue, so a stepSize of 0.2 and a minValue of 0.1 will
          force the user to pick 0.1, 0.3, 0.5, etc.
        type: float
        default: 1.0
        summary: Granularity of the slider.
        agreement: agreed
      - name: default
        description: >-
          The value with which the associated buffer should start.
          (Does not work in range slider mode. Use the init property
          of the data containers instead.)
        type: float
        default: 0.0
        remark: >-
          Applied whenever the buffer is empty, as for the other input
          elements, and likewise when the buffer ends in NaN (see the remark on
          the edit element's default). In RANGE mode this attribute has no
          effect and the two buffers start from the containers' init property;
          where that is not given they start at the slider's own min and max,
          which is what the handles show - a slider displaying a range its
          buffers do not contain would leave any analysis reading them with no
          values at all.
        summary: Value the slider starts at.
        agreement: agreed
      - name: precision
        description: >-
          The number of decimal places shown in the field with the
          current value
        type: integer
        default: 2
        summary: Digits shown for the current value.
        agreement: agreed
      - name: type
        description: >-
          Can either be "normal" or "range". Normal is a slider
          representing a single value, while "range" is a range
          slider with two handles that allow picking a lower and an
          upper value.
        type: enum
        values: [normal, range]
        default: normal
        summary: A single handle, or two defining a range.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: showValue
        description: >-
          Show a title and the current value above the slider. If
          turned off, the title is also hidden, making the slider
          very thin and compact.
        type: boolean
        default: true
        summary: Display the current value beside the slider.
        agreement: agreed
      - name: color
        type: color
        rules: [color-invalid-value]
        summary: Color of the slider.
        agreement: agreed

  - name: output
    parent: slider
    since: "1.19"
    summary: >-
      The data container receiving the slider's value. A normal slider takes one
      output with no value attribute; a range slider takes two, one for each
      handle.
    text: Name of the data container.
    attributes:
      - name: value
        type: enum
        values: [lowerValue, upperValue]
        summary: >-
          Which handle of a range slider this output follows. Omitted for a
          normal slider.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  # --------------------------------------------------------------- dropdown --
  - name: dropdown
    parent: [view, vertical, horizontal, grid]
    since: "1.19"
    summary: A menu of predefined values.
    children: [output, map]
    attributes:
      - name: verticalLayout
        type: boolean
        default: false
        since: "1.21"
        summary: >-
          Place the label above the element instead of to its left, both
          taking the full width.
        description: >-
          By default the label sits in the left half of the row and the
          element in the right half. With verticalLayout the label is shown
          on its own line above the element and both take the full width,
          left-aligned - the layout for a narrow column of a horizontal or
          grid group. Without a label the attribute has no effect.
        agreement: agreed
      - name: align
        type: enum
        values: [left, right, center]
        default: left
        since: "1.21"
        summary: >-
          Horizontal alignment of the label and the dropdown when they
          take the full width.
        description: >-
          Applies when the element is laid out at full width, i.e. with
          verticalLayout="true" or without a label: the label line and
          the dropdown are then aligned left, centred or right within the
          element's width. A control that spans the whole width anyway keeps
          its width, and only its text content follows the alignment. In the
          default layout, label in the left half and dropdown in the right half,
          the attribute has no effect. The values are those of the info
          element's align attribute.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: default
        description: >-
          The value with which the associated buffer should start.
        type: float
        remark: >-
          Applied whenever the buffer is EMPTY, not only once at load: when the
          experiment is opened, after the data is cleared, and at the start of
          each analysis cycle. Without the last two an experiment loses the
          setting the moment anything empties the buffer - a clear, or an
          analysis input without keep - and only gets it back if that element's
          own view happens to be on screen. A value the user has set is not
          overwritten while it is in the buffer; CLEARING IT RESTORES THE
          DEFAULT, even though the control was showing something else, because
          clearing is how a user deliberately returns an experiment to its
          starting state. An author who wants a setting to survive that says so
          with clearGroup on the data container, which is what it is for.
          A NaN at the end of the buffer is replaced by the default as well: an
          input control cannot show NaN and the user could never enter it, so
          the buffer would hold something the control does not. The default is
          written as it stands, never clamped to the element's range - a
          default is deliberate. Replacing a NaN is not user input: it came from
          an analysis write, and an analysis with onUserInput must not re-run on
          its own output.
        default: 0.0
        summary: Value selected initially.
        agreement: agreed
      - name: color
        type: color
        rules: [color-invalid-value]
        summary: Color of the menu.
        agreement: agreed

  - name: output
    parent: dropdown
    since: "1.19"
    summary: The data container receiving the value of the chosen entry.
    text: Name of the data container.
    attributes: []

  - name: map
    parent: dropdown
    since: "1.19"
    summary: One entry of the menu, mapping a value to the text shown for it.
    text: The option text shown to the user. Translatable.
    attributes:
      - name: value
        type: float
        default: 0.0
        summary: Value written to the data container when this entry is chosen.
        agreement: agreed
    note: >-
      iOS's handler declares a `replacement` attribute alongside `value`, but
      never reads it - the option text comes from the element's text on both
      platforms, which is also what the documentation shows. Not a divergence,
      just a dead declaration; worth removing so it is not mistaken for part of
      the format.

  # ------------------------------------------------------------------ image --
  - name: image
    parent: [view, vertical, horizontal, grid, stack, transform]
    since: "1.18"
    summary: A picture shipped with the experiment.
    attributes:
      - name: src
        description: >-
          The file name of the image that should be displayed,
          relative to the experiment's resource folder. Images are
          delivered in a `res` folder inside the zip the experiment
          comes in, and the app copies them into a per-experiment folder
          when the experiment is saved - see "Bundling images" in
          transferring experiments.
        type: string
        required: true
        summary: >-
          File name of the image, resolved against the experiment's resources.
          There is no <resource> element - both apps derive the resource list
          from the view elements naming a file.
        agreement: agreed
      - name: scale
        description: >-
          Scales the size of the image. By default (scale="1.0") the
          image is shown in full width. The factor is relative to
          this, so scale="0.5" sets it to half the width of the
          view. The element's box shrinks with the image (the height
          follows the image's aspect ratio) and the image is centred;
          no blank space is reserved for the full-width size.
        type: float
        default: 1.0
        summary: Size relative to the available width.
        agreement: agreed
      - name: darkFilter
        description: >-
          A filter that should be applied to the image if the
          interface of phyphox is in dark mode. Currently, there are
          two options: **none** leaves the image as is. **invert**
          inverts the colors of the image.
        type: enum
        values: [none, invert]
        default: none
        summary: Filter applied when the app is in dark mode.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: lightFilter
        description: >-
          A filter that should be applied to the image if the
          interface of phyphox is in light mode. Currently, there
          are two options: **none** leaves the image as is.
          **invert** inverts the colors of the image.
        type: enum
        values: [none, invert]
        default: none
        summary: Filter applied when the app is in light mode.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  # ------------------------------------------------------------- camera-gui --
  - name: camera-gui
    parent: [view, vertical, horizontal, grid]
    since: "1.19"
    summary: Live camera preview with the selected region and exposure controls.
    attributes:
      - name: exposure_adjustment_level
        description: >-
          This determines which controls are available to the user
          in three different levels of how much control over the
          exposure is possible: Level 1 only allows for changing the
          camera and zoom, but no control over exposure settings.
          Level 2 is a simplified exposure control, allowing the
          same as level 1 and adding a toggle to turn auto exposure
          on or off as well as a simple exposure value control,
          adjusting for a slight over or underexposure from the auto
          exposure result. Level 3 finally offers all controls,
          replacing the exposure value control from level 2 with
          shutter speed (exposure time), ISO and aperture and also
          showing the white balance control.
        type: integer
        default: 1
        summary: >-
          How many exposure controls to offer: 1 basic, 2 intermediate,
          3 advanced.
        agreement: agreed
        note: >-
          The literal defaults differ - Android 1, iOS 0 - but iOS maps anything
          outside 1..3 to the basic level, so both start at basic. Modeled as 1
          because that is the value that means what the default does.
      - name: grayscale
        description: >-
          Show a grayscale image instead of colors
        type: boolean
        default: false
        summary: Show the preview without color.
        agreement: agreed
      - name: markOverexposure
        description: >-
          Overexposed parts of the image are replaced by the given
          color
        type: color
        rules: [color-invalid-value]
        summary: Color used to highlight overexposed pixels. Unset disables it.
        agreement: agreed
      - name: markUnderexposure
        description: >-
          Underexposed parts of the image are replaced by the given
          color.
        type: color
        rules: [color-invalid-value]
        summary: Color used to highlight underexposed pixels. Unset disables it.
        agreement: agreed
      - name: show_controls
        value_notes:
          never: >-
            Controls are never shown; the element is only a
            preview, with the option to select the measurement
            area.
          full_view_only: >-
            Controls are only shown after the preview has been
            tapped and maximized.
          always: >-
            Controls are available even when only a small preview
            is shown.
        description: >-
          Determines when the camera controls are shown.
        type: enum
        values: [always, full_view_only, never]
        default: full_view_only
        summary: When the exposure controls are offered.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  # -------------------------------------------------------------- depth-gui --
  - name: depth-gui
    parent: [view, vertical, horizontal, grid]
    since: "1.14"
    summary: Live preview of the depth camera and the selected region.
    attributes:
      - name: aspectRatio
        type: float
        default: 2.5
        summary: Width divided by height.
        agreement: agreed

  # ------------------------------------------------------------ view groups --
  # Containers that arrange other view elements. File format 1.21, specified
  # 2026-09-25 ahead of the implementations (docs/file-format/views/groups.md
  # is the design) and implemented on both apps' development branches, in
  # the web interface and in the editor on 2026-09-26. The leaf elements list
  # every group they may sit in under `parent:`; each group declares what its
  # children accept under `child_attributes:`.
  #
  # Nesting: vertical, horizontal and grid nest freely into each other and
  # into view; stack sits in any of those but takes only leaf elements and
  # transform; transform exists only directly inside stack.

  - name: vertical
    parent: [view, vertical, horizontal, grid]
    since: "1.21"
    summary: >-
      Arranges its children top to bottom, each taking the full width - the
      layout of a view, as an element that can be nested.
    remark: >-
      Useful inside a horizontal group to put several elements into one
      column. label has no effect on a group; visibility hides the whole
      group.
    children: [info, separator, value, graph, edit, button, toggle, slider,
               dropdown, image, camera-gui, depth-gui,
               vertical, horizontal, grid, stack]
    child_attributes: [view_element_attributes]
    attributes:
      - name: spacing
        type: float
        default: 0
        since: "1.21"
        summary: >-
          Gap between adjacent children, in text line heights.
        description: >-
          Empty space inserted between adjacent children, in text line heights -
          the unit of the separator's height and of the grid's default
          maxWidth unit, so it follows density and the user's text size.
          There is no gap at the outer edges of the group, and a child hidden
          through visibility takes no gap. Negative values are treated
          as 0.
        agreement: agreed

  - name: horizontal
    parent: [view, vertical, horizontal, grid]
    since: "1.21"
    summary: >-
      Arranges its children side by side in one row, sharing the full width.
    remark: >-
      The children share the width in proportion to their weight attribute
      (default 1, so equal widths); a child hidden through visibility takes
      no space and its siblings share the row. Each child keeps the height
      it would have on its own at that width; the row is as tall as its
      tallest child and shorter children are centred vertically. label has
      no effect on a group; visibility hides the whole group.
    children: [info, separator, value, graph, edit, button, toggle, slider,
               dropdown, image, camera-gui, depth-gui,
               vertical, horizontal, grid, stack]
    child_attributes: [view_element_attributes, horizontal_child_attributes]
    attributes:
      - name: spacing
        type: float
        default: 0
        since: "1.21"
        summary: >-
          Gap between adjacent children, in text line heights.
        description: >-
          Empty space inserted between adjacent children, in text line heights -
          the unit of the separator's height and of the grid's default
          maxWidth unit, so it follows density and the user's text size.
          There is no gap at the outer edges of the group, and a child hidden
          through visibility takes no gap. The gaps are taken from the width first and the remainder is shared by weight. Negative values are treated
          as 0.
        agreement: agreed

  - name: grid
    parent: [view, vertical, horizontal, grid]
    since: "1.21"
    summary: >-
      Arranges its children in rows of equal-width columns, using as many
      columns as needed to keep each child at or below maxWidth.
    remark: >-
      The number of columns is the smallest count that brings the column
      width to maxWidth or below: one column while the available width is at
      most maxWidth, two up to twice maxWidth, and so on - so a phone in
      portrait shows the usual single column and a tablet or a landscape
      screen fills the width with several elements instead of stretching
      each. The children fill the rows in document order; a child hidden
      through visibility takes no cell. Rows are as tall as their tallest
      child. label has no effect on a group; visibility hides the whole
      group.
    children: [info, separator, value, graph, edit, button, toggle, slider,
               dropdown, image, camera-gui, depth-gui,
               vertical, horizontal, grid, stack]
    child_attributes: [view_element_attributes]
    attributes:
      - name: maxWidth
        type: float
        required: true
        summary: >-
          Largest width a child may get, in the unit named by maxWidthUnit
          (text line heights by default).
        description: >-
          The width above which the group adds a column. By default given in
          text line heights, the unit the separator's height already uses:
          it follows the screen density and the user's text size on every
          platform, so one value means the same on Android, iOS and in the
          web interface, and larger text gives fewer columns. With
          maxWidthUnit="screen" it is given in multiples of the shorter side
          of the app's window instead, which makes the column count follow
          the orientation: maxWidth="1" is one column in portrait and two in
          landscape, on phones and tablets alike.
        agreement: agreed
      - name: maxWidthUnit
        type: enum
        values: [text, screen]
        default: text
        since: "1.21"
        value_notes:
          text: >-
            Text line heights, the unit of the separator's height; follows
            density and the user's text size.
          screen: >-
            Multiples of the shorter side of the app's window - the window,
            not the display, so a split-screen or Slide Over window counts
            with its own size; in the remote interface, the browser
            viewport. Independent of the text size.
        summary: The unit of maxWidth.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: fillLastRow
        type: boolean
        default: false
        summary: >-
          Whether the children of an incomplete last row stretch to fill the
          row (true) or keep the column width of the other rows, leaving the
          rest of the row empty (false).
        agreement: agreed
      - name: spacing
        type: float
        default: 0
        since: "1.21"
        summary: >-
          Gap between adjacent columns and between rows, in text line heights.
        description: >-
          Empty space inserted between adjacent columns and between rows, in text line heights -
          the unit of the separator's height and of the grid's default
          maxWidth unit, so it follows density and the user's text size.
          There is no gap at the outer edges of the group, and a child hidden
          through visibility takes no gap. The same gap is used horizontally and vertically. The column count counts the gaps: it is the smallest number n for which (available width - (n-1) · spacing) / n is at most maxWidth, and the columns share the width left after the gaps; with fillLastRow, the children of an incomplete last row share the width left after their own gaps. Negative values are treated
          as 0.
        agreement: agreed

  - name: stack
    parent: [view, vertical, horizontal, grid]
    since: "1.21"
    summary: >-
      Draws its children on top of each other in one rectangle, later
      children above earlier ones.
    remark: >-
      All children take the full width. The tallest child sets the height of
      the stack, and the others are centred vertically in it; for a
      transform child the untransformed size counts. Later children are
      drawn over earlier ones, so a background image comes first and the
      needle, marker or plot drawn on it comes after. Transparent parts of
      a child show what lies below - images keep their alpha channel, a
      graph's plot area is transparent, and colours with an alpha byte are
      blended. A stack is not interactive: its graphs cannot be maximized,
      zoomed or used for picking, and it takes no user-input, camera or
      depth elements. label has no effect on a group; visibility hides the
      whole group.
    children: [info, separator, value, graph, image, transform]
    child_attributes: [view_element_attributes]
    attributes: []

  - name: transform
    parent: stack
    since: "1.21"
    summary: >-
      Wraps one element of a stack and scales, rotates, moves or fades it
      under the control of data containers.
    remark: >-
      Exactly one view element is wrapped. Each property - scale, scaleX,
      scaleY, translateX, translateY, rotate and opacity - is bound by an
      input child naming a data container or a constant; a property without
      an input keeps its neutral value (1 for the scales, 0 for the shifts
      and the rotation, 1 for the opacity). The properties compose as scale,
      then rotation, then translation, all about the origin given by originX
      and originY. A positive rotation turns clockwise on screen. Lengths are
      fractions of the wrapped element's own untransformed size, which is
      also what the stack's layout uses. The wrapped element receives no
      touches. label has no effect; visibility hides the wrapped element.
    children: [input, info, separator, value, graph, image]
    child_attributes: [view_element_attributes]
    attributes:
      - name: originX
        type: float
        default: 0.5
        summary: >-
          Horizontal position of the origin of scaling and rotation, as a
          fraction of the wrapped element's width (0 is the left edge, 1 the
          right edge).
        agreement: agreed
      - name: originY
        type: float
        default: 0.5
        summary: >-
          Vertical position of the origin of scaling and rotation, as a
          fraction of the wrapped element's height (0 is the top edge, 1 the
          bottom edge).
        agreement: agreed

  - name: input
    parent: transform
    since: "1.21"
    summary: >-
      Binds one transform property to a data container or a constant,
      optionally through a linear range map.
    text: >-
      Name of the data container whose last value drives the property, or
      the constant itself with type="value".
    remark: >-
      The property becomes mapMin + (v - min) * (mapMax - mapMin) / (max - min)
      for the value v; the defaults make this the identity, so a plain
      binding passes the value through. With clamp the result is limited to
      the range between mapMin and mapMax. An empty container, a value that
      is not finite, or min equal to max leaves the property at its neutral
      value. Degrees to radians, for example, is min="0" max="360" mapMin="0"
      mapMax="6.2832".
    attributes:
      - name: as
        type: enum
        required: true
        values: [scale, scaleX, scaleY, translateX, translateY, rotate,
                 opacity]
        value_notes:
          scale: >-
            Uniform scale factor about the origin; 1 is neutral. Multiplies
            with scaleX and scaleY.
          scaleX: Horizontal scale factor about the origin; 1 is neutral.
          scaleY: Vertical scale factor about the origin; 1 is neutral.
          translateX: >-
            Horizontal shift as a fraction of the wrapped element's width; 0
            is neutral, 1 moves it by its full width to the right.
          translateY: >-
            Vertical shift as a fraction of the wrapped element's height; 0
            is neutral, positive values move it down.
          rotate: >-
            Rotation about the origin in radians, clockwise on screen; 0 is
            neutral.
          opacity: >-
            Opacity from 0 (invisible) to 1 (neutral); values outside that
            range are clamped.
        summary: The property this input drives.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: type
        type: enum
        values: [buffer, value]
        default: buffer
        summary: Whether the text names a data container or is a constant.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: min
        type: float
        default: 0
        summary: Lower end of the value range that is mapped.
        agreement: agreed
      - name: max
        type: float
        default: 1
        summary: Upper end of the value range that is mapped.
        agreement: agreed
      - name: mapMin
        type: float
        default: 0
        summary: Property value at min.
        agreement: agreed
      - name: mapMax
        type: float
        default: 1
        summary: Property value at max.
        agreement: agreed
      - name: clamp
        type: boolean
        default: false
        summary: >-
          Limit the result to the range between mapMin and mapMax, so the
          property stops at the ends of the map instead of following values
          outside min and max.
        agreement: agreed
