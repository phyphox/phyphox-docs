# Rules that hold across the whole file format.
#
# The probe on the input block found that most questions raised while modelling
# it were not about that block at all - they were about how parsers should behave
# in general. Answering them once settles the same question wherever it appears,
# which is why they live here rather than being repeated per attribute.
#
# Each rule names the inconsistency entry that recorded the divergence, so the
# rule and the to-do list cannot drift apart.

rules:

  - id: enum-invalid-value
    decided: 2026-08-02
    inconsistency: input-invalid-enum-handling
    summary: An enumerated attribute whose value is not allowed is an error.
    rule: >-
      A parser must reject the experiment file when an enumerated attribute
      carries a value outside its allowed set. Silently substituting the default
      is not permitted: it produces an experiment that differs from what its
      author wrote, with nothing to indicate it, and the file will fail to load
      for users on the other platform anyway.
    applies_to: "every attribute with type: enum"
    state:
      android: >-
        Conforms across the whole format as of the development branch
        (2026-08-11). The six residual gaps found during the iOS sweep are
        closed: slider type, tone waveform, value format and the element-level
        graph style throw on an unknown value, getBooleanAttribute rejects
        anything but true/false, and the send datatype is validated (and
        normalized to lowercase) at parse time.
      ios: >-
        Conforms as of the development branch (2026-08-10). The central attribute
        readers throw on a failed decode; the silently-swallowing wrappers
        (rateStrategy `try?`, aeStrategy and waveform `(try? ...) ?? default`,
        CameraFeature's always-succeeding init, the slider type fallback, the
        value format fallback, the graph style fallbacks and the ignored unknown
        network discovery) were all removed; invalid send datatypes and boolean
        values other than true/false are rejected as well.

  - id: enum-case-insensitive
    decided: 2026-08-02
    inconsistency: input-enum-case-sensitivity
    summary: Enumerated values are matched without regard to case.
    rule: >-
      A parser folds case before matching an enumerated value, so `Closest` and
      `closest` are the same value. This holds as long as no allowed set contains
      two values differing only in case; none does today, and none may be
      introduced. New enumerations should be all-lowercase by preference.
    rationale: >-
      Configurations in circulation already rely on this, because Android folds
      case for depth/mode and camera/feature. Matching case-sensitively would
      break files that work today, which is the opposite of what the strictness
      in enum-invalid-value is for.
    ordering: >-
      Case folding happens BEFORE the rejection rule. A parser that rejects first
      and folds second would refuse `mode="Closest"`, which is exactly the file
      this rule exists to keep working.
    applies_to: "every attribute with type: enum"
    state:
      android: >-
        Conforms across the whole format as of the development branch
        (2026-08-11), with no known residual gaps. The five found during the iOS
        sweep are closed: the slider type folds (and rejects), the metadata
        identifiers resolve through case-insensitive scans of the enum values,
        the camera locked setting names are lowercased when the map is built,
        the send datatype is folded and normalized at parse time, and the root
        element check is an equalsIgnoreCase. Beyond the list, the send type
        values meta/time (buffer already folded), the experiment-list scanner's
        tag switches and the bluetooth transfer's bare-XML sniffer
        ("<phyphox...") now fold too. Everything else already folded
        (input/output type, sensor type and rateStrategy, camera aeStrategy and
        show_controls, graph style and scale modes, image filters, audio waveform
        and parameter names, flashlight parameter names, bluetooth mode and extra,
        network discovery/service/conversion, map zMode, interpolate method,
        eventstream mode, the output component / input as / axis mapping names,
        and the bluetooth conversion-function names via an explicit
        case-insensitive dispatch). The released app folds only depth/mode and
        camera/feature.
      ios: >-
        Conforms as of the development branch (2026-08-10): one central fold for
        all String-raw-value enums decoded from attributes
        (DocumentParser+Extensions.swift), lowercased switches for the explicit
        matches, a folded component lookup (SensorDescriptor.buffer(for:)), a
        used(as:) helper for the analysis as-slot names, folded metadata
        identifiers, camera locked setting names and send datatype (normalized to
        lowercase at parse time), folding Bool readers, and folded element names
        including the root and the import file-type sniffer. The
        released app matches the raw string everywhere.
    check: >-
      Before adding an enumeration to the spec, verify its values do not collide
      once case-folded. Checked for the input block: 7 enumerated attributes, no
      collisions, and only camera/aeStrategy uses values that are not already
      all-lowercase.

  - id: color-invalid-value
    decided: 2026-08-12
    inconsistency: views-map-color-unparseable
    summary: A colour attribute whose value is not parseable is an error.
    rule: >-
      A colour value must be a named phyphox colour (matched case-insensitively,
      like enumerated values) or a hexadecimal RGB value of exactly six hex
      digits, optionally prefixed with '#'. Anything else rejects the
      experiment file, exactly as an invalid enumerated value does. For the
      numbered mapColorN attributes of a map graph the scale still ends at the
      first stop that is ABSENT, but a stop that is present and unparseable is
      an error, not the end of the scale.
    history: >-
      Supersedes the first decision on views-map-color-unparseable (2026-08-10,
      "an unparseable colour ends the scale like a missing one"), which was
      made on the incorrect record that Android substituted its default colour
      and read on. In fact Android has always rejected the file - via an
      accidental unhandled NumberFormatException with an unhelpful message -
      and iOS silently substitutes its defaults for every colour attribute, not
      just the map scale. Given the corrected facts the maintainer decided
      (2026-08-12) to extend the strictness of enum-invalid-value to colours.
    applies_to: >-
      every attribute with type: color, and the numbered mapColorN attributes
      of the graph element.
    state:
      android: >-
        Conforms as of the development branch (2026-08-12): a present but
        unparseable colour anywhere throws ("Could not parse color \"...\" of
        attribute \"...\"."), via a strict parser accepting exactly the named
        colours and six-digit hex (RGB.fromPhyphoxStringStrict). Previously it
        rejected most garbage by accident (unhandled NumberFormatException,
        "Unhandled RuntimeException ... For input string: ...") while quietly
        accepting some (any parseable hex number of other lengths, e.g. "abc"
        as 0x000abc). The experiment-list scanner stays lenient on purpose - a
        bad colour there falls back to the default instead of breaking the
        list, which previously crashed it.
      ios: >-
        Conforms as of the development branch (2026-08-12): mapColorString
        accepts exactly the named colours and six-digit hex with an optional
        '#' (the lenient NSScanner hex path is no longer reachable from the
        file format), and a present but unparseable value throws Android's
        message at every colour site, including the per-set graph colour and
        the numbered mapColorN stops (KeyedAttributeContainer.optionalColor,
        GraphViewElementHandler.swift). The released app silently substitutes
        its defaults.

  - id: output-component-validation
    decided: 2026-08-02
    inconsistency: input-output-component-validation
    summary: Component names and counts on outputs are validated, and a mismatch rejects the file.
    rule: >-
      A parser checks the `component` attribute of each output against the list
      allowed for the element it belongs to, enforces the minimum and maximum
      number of outputs per component, and rejects the file when either fails.
      An output whose component the element does not define is an error, not
      something to drop.
    applies_to: >-
      outputs of every input element, and by extension the same mapping mechanism
      wherever it appears in the format.
    state:
      android: >-
        Already conforms, both for the component attribute of input-module
        outputs and for the per-slot tables of every analysis module, all via the
        ioMapping tables passed to ioBlockParser.
      ios: >-
        Conforms as of the development branch (2026-08-10). A port of Android's
        ioBlockParser algorithm (IOMappingValidation.swift) validates the
        component tables of the five input elements, the slider outputs, and -
        via slot tables each module declares itself, initially generated from
        spec/analysis.yml - all 54 analysis
        modules, with Android's exact error messages. average maps its stddev
        output by the documented name (the "std" lookup is gone) and loess maps
        yi0/yi1/yi2 by name instead of document order. The released app does not
        validate anywhere.
    migration: >-
      Making iOS strict can stop a file loading that loads there today. The
      exposure is limited: any file Android accepts is already valid by this
      rule, so only experiments written and tested on iOS alone are at risk, and
      those are already misbehaving - a misspelled component gives them an empty
      buffer. Worth a pass over the bundled experiment collection with the
      stricter parser before the release that carries it.

# The "one-sided attributes" question, which the input probe expected to be a
# growing case-by-case list, did not survive scrutiny. Of the six attributes it
# started with, one was never one-sided at all (bluetooth/id, read by both), two
# are deliberate platform differences (bluetooth/mtu, depth/smooth), one is a
# platform difference needing a clearer failure mode (bluetooth/address), one is
# not part of the format (camera/threshold), and the last is simply a file format
# 1.20 feature iOS has not implemented yet (camera/aeFPSTarget).
#
# The lesson for the remaining blocks: an attribute that appears one-sided is
# more often a misreading, a documented platform limit, or ordinary parity work
# than a question anyone needs to decide. Check those three before recording it.
open_questions: []
