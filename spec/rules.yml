# Rules that hold across the whole file format.
#
# The probe on the input block found that most questions raised while modeling
# it were not about that block at all - they were about how parsers should behave
# in general. Answering them once settles the same question wherever it appears,
# which is why they live here rather than being repeated per attribute.
#
# While the divergence that raised a rule is still being fixed, the rule names
# its inconsistencies.yml entry, so the rule and the to-do list cannot drift
# apart. Once every implementation conforms, that entry is deleted and the
# reference here goes with it - the rule itself stays, as settled format
# behavior. `decided:` records when the behavior was chosen.

rules:

  - id: enum-invalid-value
    decided: 2026-08-02
    summary: An enumerated attribute whose value is not allowed is an error.
    rule: >-
      A parser must reject the experiment file when an enumerated attribute
      carries a value outside its allowed set. Silently substituting the default
      is not permitted: it produces an experiment that differs from what its
      author wrote, with nothing to indicate it, and the file will fail to load
      for users on the other platform anyway.
    applies_to: "every attribute with type: enum"
    state:
      android: >-
        Conforms across the whole format as of the development branch
        (2026-08-11). The six residual gaps found during the iOS sweep are
        closed: slider type, tone waveform, value format and the element-level
        graph style throw on an unknown value, getBooleanAttribute rejects
        anything but true/false, and the send datatype is validated (and
        normalized to lowercase) at parse time.
      ios: >-
        Conforms as of the development branch (2026-08-10). The central attribute
        readers throw on a failed decode; the silently-swallowing wrappers
        (rateStrategy `try?`, aeStrategy and waveform `(try? ...) ?? default`,
        CameraFeature's always-succeeding init, the slider type fallback, the
        value format fallback, the graph style fallbacks and the ignored unknown
        network discovery) were all removed; invalid send datatypes and boolean
        values other than true/false are rejected as well.

  - id: enum-case-insensitive
    decided: 2026-08-02
    summary: Enumerated values are matched without regard to case.
    rule: >-
      A parser folds case before matching an enumerated value, so `Closest` and
      `closest` are the same value. This holds as long as no allowed set contains
      two values differing only in case; none does today, and none may be
      introduced. New enumerations should be all-lowercase by preference.
      The same folding applies to metadata identifiers - the element text of a
      network send tag with type="meta", including the composite
      sensor-prefixed forms such as accelerometerName (decided 2026-08-13;
      identifiers are element text rather than attribute values, so they were
      not automatically covered by the attribute wording above).
    rationale: >-
      Configurations in circulation already rely on this, because Android folds
      case for depth/mode and camera/feature. Matching case-sensitively would
      break files that work today, which is the opposite of what the strictness
      in enum-invalid-value is for.
    ordering: >-
      Case folding happens BEFORE the rejection rule. A parser that rejects first
      and folds second would refuse `mode="Closest"`, which is exactly the file
      this rule exists to keep working.
    applies_to: >-
      every attribute with type: enum, and the metadata identifiers a network
      send tag carries as element text when type="meta"
    state:
      android: >-
        Conforms across the whole format as of the development branch
        (2026-08-11), with no known residual gaps. The five found during the iOS
        sweep are closed: the slider type folds (and rejects), the metadata
        identifiers resolve through case-insensitive scans of the enum values,
        the camera locked setting names are lowercased when the map is built,
        the send datatype is folded and normalized at parse time, and the root
        element check is an equalsIgnoreCase. Beyond the list, the send type
        values meta/time (buffer already folded), the experiment-list scanner's
        tag switches and the bluetooth transfer's bare-XML sniffer
        ("<phyphox...") now fold too. Everything else already folded
        (input/output type, sensor type and rateStrategy, camera aeStrategy and
        show_controls, graph style and scale modes, image filters, audio waveform
        and parameter names, flashlight parameter names, bluetooth mode and extra,
        network discovery/service/conversion, map zMode, interpolate method,
        eventstream mode, the output component / input as / axis mapping names,
        and the bluetooth conversion-function names via an explicit
        case-insensitive dispatch). The released app folds only depth/mode and
        camera/feature.
      ios: >-
        Conforms as of the development branch (2026-08-10): one central fold for
        all String-raw-value enums decoded from attributes
        (DocumentParser+Extensions.swift), lowercased switches for the explicit
        matches, a folded component lookup (SensorDescriptor.buffer(for:)), a
        used(as:) helper for the analysis as-slot names, folded metadata
        identifiers, camera locked setting names and send datatype (normalized to
        lowercase at parse time), folding Bool readers, and folded element names
        including the root and the import file-type sniffer. The
        released app matches the raw string everywhere.
    check: >-
      Before adding an enumeration to the spec, verify its values do not collide
      once case-folded. Checked for the input block: 7 enumerated attributes, no
      collisions, and only camera/aeStrategy uses values that are not already
      all-lowercase.

  - id: color-invalid-value
    decided: 2026-08-12
    summary: A color attribute whose value is not parseable is an error.
    rule: >-
      A color value must be a named phyphox color (matched case-insensitively,
      like enumerated values) or a hexadecimal RGB value of exactly six hex
      digits, optionally prefixed with '#'. Anything else rejects the
      experiment file, exactly as an invalid enumerated value does. For the
      numbered mapColorN attributes of a map graph the scale still ends at the
      first stop that is ABSENT, but a stop that is present and unparseable is
      an error, not the end of the scale.
    history: >-
      Supersedes the first decision on views-map-color-unparseable (2026-08-10,
      "an unparseable color ends the scale like a missing one"), which was
      made on the incorrect record that Android substituted its default color
      and read on. In fact Android has always rejected the file - via an
      accidental unhandled NumberFormatException with an unhelpful message -
      and iOS silently substitutes its defaults for every color attribute, not
      just the map scale. Given the corrected facts the maintainer decided
      (2026-08-12) to extend the strictness of enum-invalid-value to colors.
    applies_to: >-
      every attribute with type: color, and the numbered mapColorN attributes
      of the graph element.
    state:
      android: >-
        Conforms as of the development branch (2026-08-12): a present but
        unparseable color anywhere throws ("Could not parse color \"...\" of
        attribute \"...\"."), via a strict parser accepting exactly the named
        colors and six-digit hex (RGB.fromPhyphoxStringStrict). Previously it
        rejected most garbage by accident (unhandled NumberFormatException,
        "Unhandled RuntimeException ... For input string: ...") while quietly
        accepting some (any parseable hex number of other lengths, e.g. "abc"
        as 0x000abc). The experiment-list scanner stays lenient on purpose - a
        bad color there falls back to the default instead of breaking the
        list, which previously crashed it.
      ios: >-
        Conforms as of the development branch (2026-08-12): mapColorString
        accepts exactly the named colors and six-digit hex with an optional
        '#' (the lenient NSScanner hex path is no longer reachable from the
        file format), and a present but unparseable value throws Android's
        message at every color site, including the per-set graph color and
        the numbered mapColorN stops (KeyedAttributeContainer.optionalColor,
        GraphViewElementHandler.swift). The released app silently substitutes
        its defaults.

  - id: unknown-attribute-ignored
    decided: 2026-08-24
    summary: An attribute the parser does not recognize is silently ignored.
    rule: >-
      A parser ignores attributes it does not know - in the file's own
      namespace or none, exactly like the documented handling of foreign
      namespaces. This is the deliberate counterpart to the strictness rules
      above: unknown ELEMENT names reject the file, invalid VALUES of known
      attributes reject the file, but an unknown attribute NAME loads as if
      it were absent. The published validators (RELAX NG and
      tools/validate_experiments.py) still flag unknown attributes as
      authoring errors - catching the cycle=-for-cycles= typo is their job,
      at authoring time, not the app's job at load time.
    rationale: >-
      Compatibility reality, surfaced when the Android corpus runner showed
      11 of 16 invalid fixtures loading fine (2026-08-24): both apps have
      accepted unknown attributes since the beginning, so files relying on
      that - including formerly shipped experiments with stale attributes
      like precisionX on graphs - exist in numbers. Enforcing strictness
      now would break working experiments, the exact opposite of what the
      enum strictness protects (there, silence CHANGED meaning; here,
      rejection would remove function).
    applies_to: >-
      every attribute name a parser does not model, on any element
    state:
      android: >-
        Conforms by long-standing behavior everywhere, the camera element
        included. The two camera fixtures that seemed to contradict this in
        the first corpus run (2026-08-24) turned out to reject for other,
        correct reasons: unknown output COMPONENTS (the settled
        output-component-validation rule; camera-input-controls) and a
        stray XML declaration version="1.18" that strict XML parsers refuse
        as not well-formed (camera-threshold; the corpus fixture is fixed).
        No parser has attribute-name strictness anywhere.
      ios: >-
        Expected to conform (the typed attribute readers do not reject
        unknown keys); confirmed when the iOS corpus runner lands.

  - id: number-invalid-value
  - id: number-invalid-value
    decided: 2026-08-24
    summary: A numeric value that does not parse as a number is an error.
    rule: >-
      A parser must reject the experiment file when an attribute typed as an
      integer or float - or an entry of a comma-separated numeric list, i.e.
      a data container's init attribute - does not parse as a number. A
      float is plain decimal notation - an optional sign, digits with an
      optional decimal point ("1", "-0.5", ".5", "5."), an optional decimal
      exponent ("1e-3", "2E5") - or one of the special values NaN, Infinity
      and -Infinity, matched case-insensitively like enumerated values.
      These special values are real values, not errors: an init="NaN" entry
      is the documented way to put a gap marker into a buffer, and corpus
      files use both "NaN" and "nan" (graph-nan-test.phyphox, if.phyphox).
      An integer is sign and digits only. Localized forms (decimal commas),
      hexadecimal or suffixed programming-language forms ("0x1p3", "1f")
      and abbreviations like "inf" are not numbers - the platforms' library
      parsers disagree on all of them, so no experiment can carry them
      portably. Note the case folding is on the parsers, not their
      libraries: Java's Double.parseDouble accepts exactly "NaN", so
      Android has to fold (or special-case) before handing the value to
      its library parser, or init="nan" files would stop loading. Absent
      optional attributes still take their default - this rule is about
      present values only.
    rationale: >-
      Same reasoning as enum-invalid-value: silently substituting the
      default produces an experiment that differs from what its author
      wrote, with nothing to indicate it. For init lists the pre-rule
      behavior was worse than a wrong value: Android turned a malformed
      entry into NaN while iOS dropped it and shifted every later entry
      one position forward, so the same file yielded different buffer
      contents on the two platforms.
    applies_to: >-
      every attribute with type: integer or float, and each entry of every
      attribute with type: float-list (container init)
    state:
      android: >-
        Conforms across the whole format as of the development branch
        (2026-08-24): getIntAttribute and getDoubleAttribute validate
        against the format's lexical space via the parseNumber helper and
        reject the file otherwise, a malformed init entry rejects the file
        instead of becoming NaN, and the residual sites found during
        verification - the value and button map min/max and the graph
        input lineWidth, previously on raw Double.valueOf - go through
        parseNumber as well (PhyphoxFile.java, closed the same day). The
        released app silently substitutes defaults for malformed numeric
        attributes and turns malformed init entries into NaN.
      ios: >-
        Conforms across the whole format as of the development branch
        (2026-08-24): the central readers throw on a failed decode and
        restrict the Double, CGFloat and Float decode paths to the
        format's lexical space via the shared parseExperimentNumber helper
        (DocumentParser.swift) - closing the residual acceptance of
        Swift-only forms like "inf" and hex floats found during
        verification - and a malformed init entry rejects the file
        through the same helper instead of being dropped
        (DataContainersElementHandler.swift). Integer decodes were
        sign-and-digits only to begin with; DeserializerTests covers the
        accepted and rejected forms on the Double and CGFloat paths and
        the init list. The released app drops malformed init entries and
        accepts every Swift-parseable attribute spelling.

  - id: output-component-validation
    decided: 2026-08-02
    summary: Component names and counts on outputs are validated, and a mismatch rejects the file.
    rule: >-
      A parser checks the `component` attribute of each output against the list
      allowed for the element it belongs to, enforces the minimum and maximum
      number of outputs per component, and rejects the file when either fails.
      An output whose component the element does not define is an error, not
      something to drop.
    applies_to: >-
      outputs of every input element, and by extension the same mapping mechanism
      wherever it appears in the format.
    state:
      android: >-
        Already conforms, both for the component attribute of input-module
        outputs and for the per-slot tables of every analysis module, all via the
        ioMapping tables passed to ioBlockParser.
      ios: >-
        Conforms as of the development branch (2026-08-10). A port of Android's
        ioBlockParser algorithm (IOMappingValidation.swift) validates the
        component tables of the five input elements, the slider outputs, and -
        via slot tables each module declares itself, initially generated from
        spec/analysis.yml - all 54 analysis
        modules, with Android's exact error messages. average maps its stddev
        output by the documented name (the "std" lookup is gone) and loess maps
        yi0/yi1/yi2 by name instead of document order. The released app does not
        validate anywhere.
    migration: >-
      Making iOS strict can stop a file loading that loads there today. The
      exposure is limited: any file Android accepts is already valid by this
      rule, so only experiments written and tested on iOS alone are at risk, and
      those are already misbehaving - a misspelled component gives them an empty
      buffer. Worth a pass over the bundled experiment collection with the
      stricter parser before the release that carries it.

  - id: tag-case-insensitive
    decided: 2026-08-20
    summary: Element (tag) names are matched without regard to case.
    rule: >-
      A parser folds case before dispatching on an element name, so <Graph>
      and <graph> are the same element. This holds as long as no two element
      names differ only in case; none do today - every name is lowercase or
      lowercase-with-hyphens - and none may be introduced. This rule covers
      element names only: attribute NAMES are matched exactly everywhere
      (decided 2026-08-20 while settling the graph input tags, whose
      lowercased attribute matching on Android was the single exception and
      was removed).
    rationale: >-
      Android's main parser has dispatched on lowercased tag names since the
      beginning, so configurations with off-case tags load there and always
      have. Matching case-sensitively would break those files; folding on
      iOS as well unifies the platforms in the direction that keeps
      existing files working, consistent with enum-case-insensitive.
    applies_to: every element name in the format
    state:
      android: >-
        The main parser has always folded (PhyphoxFile.java, the
        "switch (tag.toLowerCase())" dispatch in every block parser); the
        experiment-list scanner's tag switches were brought in line during
        the 2026-08 parsing unification. Shipped in 1.2.1-beta4.
      ios: >-
        Conforms as of the development branch: child handlers are looked up
        with a lowercased element name
        (DocumentParser+Extensions.swift, "childHandlers[
        elementName.lowercased()]"). The released app before 1.2.1 matched
        exactly. Shipped in the 1.2.1 beta of 2026-08-20.
    check: >-
      Before adding an element to the spec, verify its name does not collide
      with an existing one once case-folded, and prefer all-lowercase names
      (hyphenated where needed, like camera-gui).


# The "one-sided attributes" question, which the input probe expected to be a
# growing case-by-case list, did not survive scrutiny. Of the six attributes it
# started with, one was never one-sided at all (bluetooth/id, read by both), two
# are deliberate platform differences (bluetooth/mtu, depth/smooth), one is a
# platform difference needing a clearer failure mode (bluetooth/address), one is
# not part of the format (camera/threshold), and the last is simply a file format
# 1.20 feature iOS has not implemented yet (camera/aeFPSTarget).
#
# The lesson for the remaining blocks: an attribute that appears one-sided is
# more often a misreading, a documented platform limit, or ordinary parity work
# than a question anyone needs to decide. Check those three before recording it.
open_questions: []
