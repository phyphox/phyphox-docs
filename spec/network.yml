# The <network> block, modeled completely.
#
# Sources compared for every entry below:
#   Android  PhyphoxFile.java: networkBlockParser, networkConnectionBlockParser
#                                                              (b4564695)
#   iOS      Serialization/Handlers/NetworkElementHandler.swift (a0643729)
#   docs     docs/file-format/network-connections.md
#
# `agreement:` records what that comparison found. See README.md.

block: network
since: "1.11"
summary: >-
  Connections to a service on the local network or the internet, sending values
  from data containers and writing responses back into others.

elements:

  - name: network
    parent: phyphox
    since: "1.11"
    summary: Container for the experiment's network connections.
    attributes: []
    children: [connection]

  - name: connection
    parent: network
    since: "1.11"
    summary: One service the experiment talks to.
    children: [send, receive]
    attributes:
      - name: id
        description: >-
          This id is not required, but it can be used to identify
          the connection from other elements. For example, a button
          view element can use this id in a trigger block to trigger
          the connection.
        type: string
        summary: >-
          Identifies the connection so a button's trigger tag can fire it.
        agreement: agreed
      - name: privacy
        description: >-
          A URL to a privacy policy for your experiment.
        type: string
        summary: >-
          URL of a privacy policy for the service. Shown to the user before any
          data leaves the device.
        agreement: agreed
      - name: address
        description: >-
          An address for the service. This is typically a fixed IP
          address or URL, but its meaning may vary depending on the
          service and it might work differently in combination with
          different discovery methods. For the MQTT services, an
          address that does not name a port uses the standard port:
          1883 for mqtt/csv and mqtt/json, 8883 for the TLS variants
          mqtts/csv and mqtts/json.
        note: >-
          Port defaults verified 2026-08-13 in both implementations:
          MqttService.java (port = tls ? 8883 : 1883) and
          NetworkService.swift (defaultPort = tls ? 8883 : 1883).
        type: string
        required: true
        summary: Address of the service.
        agreement: agreed
      - name: service
        description: >-
          A name from the list of network services below, defining
          the service (protocol) for the connection.
        type: enum
        values: [http/get, http/post, mqtt/csv, mqtt/json, mqtts/csv, mqtts/json]
        summary: Which protocol to speak.
        agreement: agreed
      - name: conversion
        description: >-
          A name from the list of response conversions below. This
          defines how the data stream from the network service is
          interpreted and converted into numbers that can be used in
          phyphox.
        type: enum
        values: [none, csv, json]
        summary: How to interpret the response before writing it to containers.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: discovery
        description: >-
          A stub of a planned service-discovery feature that was
          never completed - there is little point in using it at the
          moment. Real discovery methods (such as mDNS) and letting
          the user pick from the discovered services do not exist;
          the only accepted value, http, is merely a simple
          availability probe.
        value_notes:
          http: >-
            A simple availability probe: phyphox sends an HTTP GET
            request to discoveryAddress and, if the response status
            is in the 200 range, connects to that same address.
            Nothing is discovered beyond the reachability of the one
            address given.
        type: enum
        values: [http]
        summary: >-
          Stub of a never-completed discovery feature; http merely probes
          discoveryAddress for availability.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
        note: >-
          Verified 2026-08-20: both parsers accept exactly "http"
          (PhyphoxFile.java networkBlockParser; NetworkElementHandler.swift,
          which additionally requires a non-empty discoveryAddress). Both
          runtimes probe discoveryAddress with a GET and connect to it on a
          2xx (NetworkDiscovery.java Http, NetworkConnection.java connect();
          NetworkDiscovery.swift HttpNetworkDiscovery,
          NetworkConnection.swift). The discovered item's display name is
          computed and never shown anywhere - Android even has a
          Math.max-for-Math.min typo in the truncation, harmless because the
          name is dead. Maintainer ruling 2026-08-20: document reality
          rather than retire the attribute.
      - name: discoveryAddress
        description: >-
          The address probed by the http discovery method. With no
          real discovery methods implemented, there is little point
          in using this at the moment.
        type: string
        summary: Address probed by the http discovery method.
        agreement: agreed
      - name: autoConnect
        description: >-
          Meant to control whether phyphox connects to the first
          viable service on its own (true) or presents the
          discovered options to the user (false). Currently without
          effect: the selection dialog of the never-completed
          discovery feature does not exist, and both apps behave as
          if autoConnect were true, connecting to the first result.
        type: boolean
        default: false
        summary: >-
          Currently without effect - both apps always behave as if it were
          true, connecting to the first result.
        agreement: agreed
        note: >-
          Verified 2026-08-20: parsed and stored but never read on either
          platform (NetworkConnection.java, NetworkConnection.swift - whose
          own TODO comments name the missing scan dialog). Not a divergence:
          both platforms ignore it identically.
      - name: interval
        description: >-
          If set to a value larger than 0, this defines an interval
          in seconds at which the connection is triggered
          periodically.
        type: float
        default: 0.0
        unit: s
        summary: >-
          How often to contact the service. 0 means only when triggered by a
          button.
        agreement: agreed
      - name: receiveTopic
        type: string
        summary: MQTT topic subscribed to. For the mqtt and mqtts services.
        agreement: agreed
      - name: sendTopic
        type: string
        summary: >-
          MQTT topic published to. Required by mqtt/json and mqtts/json; use
          mqtt/csv if nothing is to be sent.
        agreement: agreed
      - name: username
        type: string
        summary: >-
          User name for the MQTT broker connection. Required by the mqtts (TLS)
          services, where it is also used as the MQTT client id; optional for the
          plain mqtt services, whose brokers may require authentication too.
        agreement: agreed
      - name: password
        type: string
        summary: >-
          Password for the MQTT broker connection. Required by the mqtts (TLS)
          services; optional for the plain mqtt services.
        agreement: agreed
      - name: persistence
        type: boolean
        default: false
        summary: >-
          For mqtt/json and mqtts/json: publish with MQTT QoS 1 (at-least-once)
          instead of QoS 0. (Formerly selected QoS 2, which has been dropped.)
        agreement: agreed
      - name: certificate
        type: string
        summary: >-
          For the mqtts services: the file name of a custom CA certificate (PEM or
          DER) to trust for the TLS connection, delivered as an experiment resource
          in the res directory. Optional; without it the system trust store is used.
        agreement: agreed

  - name: send
    parent: connection
    since: "1.11"
    summary: One value or set of values sent to the service.
    text: >-
      Name of a data container, a metadata identifier, or empty for time,
      depending on type.
    attributes:
      - name: id
        description: >-
          The meaning of the id depends on the network service. It
          is usually used as a label attached to the data for the
          remote server.
        type: string
        required: true
        summary: Key under which the value appears in the request.
        agreement: agreed
      - name: type
        value_notes:
          buffer: >-
            The text names a data container. Whether only the last
            value or the whole array is submitted depends on the
            network service.
          meta: >-
            The text is a metadata identifier rather than a data
            container. See the list of identifiers below.
          time: >-
            Sends the current system time in seconds since 1970.
            The tag needs no content, so <send id="x" type="time"
            /> is sufficient. Compact data formats such as HTTP
            GET parameters send only the current timestamp, while
            richer ones such as JSON can also include the list of
            start and pause events with matching experiment time
            and system time, for precise time conversion.
            Available since file format 1.12.
        description: >-
          Whether the tag sends the contents of a data container, a
          piece of metadata, or the current time.
        type: enum
        values: [buffer, meta, time]
        default: buffer
        summary: >-
          Whether the text names a data container, a metadata identifier (see
          the network-connections page for the vocabulary), or the element sends
          the current time.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: datatype
        type: enum
        values: [number, array]
        default: array
        summary: >-
          How a buffer is encoded in the request, where the service allows a
          choice: number sends only the last value as a single number, array the
          whole buffer.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: keep
        type: boolean
        default: true
        summary: >-
          Whether the data container keeps its contents after being sent.
        description: >-
          Whether the data container keeps its contents after being sent. Set
          it to false to clear the container once the data has gone out, which
          is the easy way to stream data without duplicates. Note that the
          default is the opposite of the one in analysis modules, where a value
          is consumed unless you ask to keep it.
        agreement: agreed
      - name: clear
        type: boolean
        default: false
        deprecated: true
        superseded_by: keep
        summary: Deprecated in file format 1.17. clear=true corresponds to keep=false.
        agreement: agreed

  - name: receive
    parent: connection
    since: "1.11"
    summary: One value taken from the response and written to a data container.
    text: Name of the data container to write to.
    attributes:
      - name: id
        description: >-
          The id is interpreted by the response conversion function
          and determines which part of the converted response is
          used.
        type: string
        required: true
        summary: Key to read from the response.
        agreement: agreed
      - name: append
        type: boolean
        default: true
        summary: Append to the container rather than replacing its contents.
        description: >-
          Whether received data is appended to the data container. Set it to
          false to have the container cleared before the response is written to
          it. Note that the default is the opposite of the one in analysis
          modules.
        agreement: agreed
      - name: clear
        type: boolean
        default: false
        deprecated: true
        superseded_by: append
        summary: Deprecated in file format 1.17. clear=true corresponds to append=false.
        agreement: agreed

# The identifiers a send tag accepts as element text when type="meta". Like the
# bluetooth conversion vocabulary in output.yml, this is element-text
# vocabulary rather than an enumerated attribute, so it is recorded here as
# its own section. Identifiers are matched case-insensitively (rules.yml,
# enum-case-insensitive, extended to metadata identifiers 2026-08-13), and an
# unknown identifier rejects the experiment file.
#
# Sources compared 2026-08-13: Metadata.java (DeviceMetadata and the
# SensorName x SensorMetadata composites, matched by case-insensitive scans)
# and PhyphoxElementHandler.swift (lowercased switch plus the matchSensor
# cascade). The two agree on everything except the "custom" sensor prefix,
# which only Android accepts - see the inconsistency entry.

metadata:
  agreement: agreed
  identifiers:
    - uniqueID
    - version
    - build
    - fileFormat
    - deviceModel
    - deviceBrand
    - deviceBoard
    - deviceManufacturer
    - deviceBaseOS
    - deviceCodename
    - deviceRelease
    - depthFrontSensor
    - depthFrontResolution
    - depthFrontRate
    - depthBackSensor
    - depthBackResolution
    - depthBackRate
    - camera2api
    - camera2apiFull
  # Composite identifiers: a sensor prefix directly followed by a suffix,
  # e.g. accelerometerName or linear_accelerationMinDelay.
  sensor_prefixes:
    - accelerometer
    - linear_acceleration
    - gravity
    - gyroscope
    - magnetic_field
    - pressure
    - light
    - proximity
    - temperature
    - humidity
    - attitude
    # custom is deliberately NOT part of the vocabulary (decided 2026-08-13):
    # custom sensors are selected by nameFilter, so per-sensor metadata for
    # "custom" is ambiguous.
  sensor_suffixes:
    - Name
    - Vendor
    - Range
    - Resolution
    - MinDelay
    - MaxDelay
    - Power
    - Version
