# The <output> block, modeled completely.
#
# Sources compared for every entry below:
#   Android  PhyphoxFile.java: outputBlockParser, AudioOutputPluginBlockParser,
#            FlashlightBlockParser, and the bluetooth io parser        (b4564695)
#            Bluetooth/ConversionsOutput.java, ConversionsConfig.java
#   iOS      Serialization/Handlers/OutputElementHandler.swift         (a0643729)
#   docs     docs/file-format/output.md, bluetooth-low-energy.md
#
# `agreement:` records what that comparison found. See README.md.
#
# Note on <bluetooth>: the element appears in BOTH the input and the output
# block and they are different elements. The one here writes buffer values to a
# device; the one in input.yml reads from it. They share the device-matching
# attributes and the config child, and differ in everything else - this one has
# no mode, rate or subscribeOnStart, and its data child is <input> rather than
# <output>.

block: output
since: "1.0"
summary: >-
  Hardware the experiment drives: the speaker, the flashlight, and Bluetooth
  devices written to rather than read from.

elements:

  - name: output
    parent: phyphox
    since: "1.0"
    summary: Container for all hardware outputs.
    attributes: []
    children: [audio, bluetooth, flashlight]

  # ------------------------------------------------------------------ audio --
  - name: audio
    parent: output
    since: "1.0"
    summary: The speaker.
    children: [input, tone, noise]
    attributes:
      - name: rate
        type: integer
        default: 48000
        unit: Hz
        summary: Sample rate of the generated signal.
        agreement: agreed
      - name: loop
        type: boolean
        default: false
        summary: Repeat the buffer instead of playing it once.
        agreement: agreed
      - name: normalize
        type: boolean
        default: false
        since: "1.10"
        summary: Normalize the amplitude of all inputs.
        agreement: agreed

  # <input> appears at two levels and means different things. Directly under
  # <audio> it is the waveform itself; inside <tone> or <noise> it drives one
  # parameter of that generator. Android handles all three with the same code,
  # distinguishing them by whether `parameter` is set and whether a generator is
  # open; iOS registers a separate handler under each.
  - name: input
    parent: audio
    since: "1.0"
    summary: >-
      The waveform, written to the speaker at the end of each analysis pass.
      Values run from -1 to +1 and the buffer's length sets the duration. The
      mono signal plays identically on both stereo channels and the element
      takes no parameter inputs. Only one direct source is supported.
    text: Name of the data container holding the waveform.
    agreement: agreed
    attributes: []
    # The type attribute was removed from the direct input on 2026-08-19:
    # type="value" never makes sense for a waveform. Android used to honor it
    # (fixed 2026-08-20); iOS never read it.

  - name: tone
    parent: audio
    since: "1.10"
    summary: >-
      A parametric tone generator, driven by the input elements inside it. Each
      tone tracks the phase of its wave so that changing the frequency does not
      click. Several are allowed.
    children: [input]
    attributes:
      - name: waveform
        type: enum
        values: [sine, square, sawtooth]
        default: sine
        since: "1.19"
        summary: Shape of the generated wave.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  - name: input
    parent: tone
    since: "1.10"
    summary: Drives one parameter of the tone generator.
    text: Name of a data container, or a literal number when type is value.
    attributes:
      - name: parameter
        type: enum
        values: [pan, amplitude, duration, frequency]
        summary: Which parameter of the generator this input drives.
        value_notes:
          pan: >-
            Stereo position, from -1 (left) through 0 (center) to +1 (right).
            A centered signal plays at full amplitude on both channels, and
            panning reduces the opposite channel rather than boosting the near
            one. Available from file format 1.20.
          amplitude: >-
            Amplitude, from 0.0 (silent) to 1.0 (the loudest without clipping).
          duration: Duration of the generated signal, in seconds.
          frequency: >-
            Frequency of the tone, in Hz.
        agreement: agreed
      - name: type
        type: enum
        values: [buffer, value]
        default: buffer
        summary: Whether the text names a data container or is a literal value.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  - name: noise
    parent: audio
    since: "1.10"
    summary: >-
      A white-noise generator, driven by the input elements inside it. Only one
      is supported.
    children: [input]
    attributes: []

  - name: input
    parent: noise
    since: "1.10"
    summary: >-
      Drives one parameter of the noise generator.
    text: Name of a data container, or a literal number when type is value.
    attributes:
      - name: parameter
        type: enum
        values: [pan, amplitude, duration]
        summary: Which parameter of the generator this input drives.
        value_notes:
          pan: >-
            Stereo position, from -1 (left) through 0 (center) to +1 (right),
            like on the tone generator. Available from file format 1.20.
          amplitude: >-
            Amplitude, from 0.0 (silent) to 1.0 (the loudest without clipping).
          duration: Duration of the generated signal, in seconds.
        agreement: agreed
        note: >-
          frequency was listed here until 2026-08-19 with a "does not apply"
          remark, but both parsers have always rejected it at load - Android
          via AudioOutputPluginNoise.setParameter returning false, iOS via the
          explicit throw in PhyphoxElementHandler's noise mapping. Removed per
          maintainer ruling; the parsers already conform.
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: type
        type: enum
        values: [buffer, value]
        default: buffer
        summary: Whether the text names a data container or is a literal value.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  # -------------------------------------------------------------- flashlight --
  - name: flashlight
    parent: output
    since: "1.20"
    summary: >-
      The camera flash, usable as a lamp or a stroboscope. Most phones cannot
      switch faster than about 25 ms, so high frequencies or duty cycles far from
      0.5 may not be reproduced accurately.
    children: [input]
    attributes: []
    agreement: agreed

  - name: input
    parent: flashlight
    since: "1.20"
    summary: Drives one parameter of the flashlight.
    text: Name of a data container, or a literal number when type is value.
    attributes:
      - name: parameter
        type: enum
        required: true
        values: [intensity, frequency, dutycycle]
        summary: Which parameter of the flashlight this input drives.
        value_notes:
          intensity: >-
            Brightness, from 0 (off) to 1 (maximum). How many levels a phone
            supports varies and older models may only manage on and off.
            Defaults to 1.
          frequency: >-
            Strobe frequency. At 0 the light stays on constantly. Defaults to 0.
          dutycycle: >-
            Fraction of each strobe period the light is on, from 0 (always off)
            to 1 (always on). Defaults to 0.5.
        agreement: agreed
      - name: type
        type: enum
        values: [buffer, value]
        default: buffer
        summary: Whether the text names a data container or is a literal value.
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

  # -------------------------------------------------------------- bluetooth --
  - name: bluetooth
    parent: output
    since: "1.7"
    summary: >-
      A Bluetooth Low Energy device written to. Distinct from the bluetooth
      element of the input block, which reads from one.
    children: [input, config]
    attributes:
      - name: id
        group: matching
        type: string
        translatable: true
        summary: >-
          Names the device for the user during scanning, and groups entries:
          bluetooth elements sharing an id describe one physical device, across
          input and output blocks alike - resolved once, connected once, with
          every block working over that one connection. A block without an id is
          its own device even if it names the same one.
        agreement: agreed
      - name: name
        group: matching
        type: string
        summary: Connect only to a device whose name contains this text.
        agreement: agreed
      - name: uuid
        group: matching
        type: string
        summary: Connect only to a device advertising this service UUID.
        agreement: agreed
      - name: autoConnect
        group: matching
        type: boolean
        default: false
        summary: Connect to the first match without showing a scan dialog.
        agreement: agreed
      - name: address
        group: matching
        type: string
        summary: >-
          Connect only to the device with this hardware address. **Using this
          attribute makes the experiment Android-only**, exactly as in the input
          block.
        agreement: platform
        platforms: [android]
      - name: mtu
        group: matching
        type: integer
        default: 0
        since: "1.9"
        summary: Requests a specific MTU. Fails on Android before 5.0.
        agreement: platform
        platforms: [android]
        remark: >-
          iOS gives no control over the MTU and always requests the maximum, so
          the attribute is accepted and ignored there.
        note: >-
          iOS has no way to control the MTU and always requests the maximum.

  - name: input
    parent: bluetooth
    since: "1.7"
    summary: >-
      Writes the values of a data container to a characteristic, converting them
      to bytes.
    text: Name of the data container.
    attributes:
      - name: char
        type: string
        required: true
        summary: UUID of the characteristic to write.
        agreement: agreed
      - name: conversion
        type: enum
        values:
          - uInt8
          - int8
          - uInt16LittleEndian
          - uInt16BigEndian
          - int16LittleEndian
          - int16BigEndian
          - uInt24LittleEndian
          - uInt24BigEndian
          - int24LittleEndian
          - int24BigEndian
          - uInt32LittleEndian
          - uInt32BigEndian
          - int32LittleEndian
          - int32BigEndian
          - float32LittleEndian
          - float32BigEndian
          - float64LittleEndian
          - float64BigEndian
          - singleByte
          - string
          - byteArray
        required: true
        summary: >-
          Name of the conversion turning numbers into bytes. See the conversion
          vocabulary at the end of this file.
        note: >-
          The values inline the output list of the conversions section below
          (kept in step by a build check).
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]
      - name: offset
        type: integer
        default: 0
        summary: Byte offset within the characteristic to write at.
        agreement: agreed
      - name: keep
        type: boolean
        default: true
        since: "1.19"
        summary: >-
          Whether the data container keeps its contents after being written.
          False clears it, so each value is sent once.
        agreement: agreed
      - name: triggerId
        type: string
        since: "1.20"
        summary: >-
          Send this characteristic's data only when a button whose trigger tag
          carries the same id has been pressed, rather than after every
          analysis pass. Other inputs of the same device keep sending
          periodically.
        agreement: agreed

  - name: config
    parent: bluetooth
    since: "1.7"
    summary: >-
      A constant written to a characteristic once after connecting, typically to
      enable a sensor or set an acquisition rate.
    text: The value to write, interpreted by the conversion.
    attributes:
      - name: char
        type: string
        required: true
        summary: UUID of the characteristic to write.
        agreement: agreed
      - name: conversion
        type: enum
        values:
          - uInt8
          - int8
          - uInt16LittleEndian
          - uInt16BigEndian
          - int16LittleEndian
          - int16BigEndian
          - uInt24LittleEndian
          - uInt24BigEndian
          - int24LittleEndian
          - int24BigEndian
          - uInt32LittleEndian
          - uInt32BigEndian
          - int32LittleEndian
          - int32BigEndian
          - float32LittleEndian
          - float32BigEndian
          - float64LittleEndian
          - float64BigEndian
          - singleByte
          - string
          - hexadecimal
        required: true
        summary: Conversion turning the element's text into bytes.
        note: >-
          The values inline the config list of the conversions section below
          (kept in step by a build check).
        agreement: agreed
        rules: [enum-invalid-value, enum-case-insensitive]

# The conversion vocabulary, shared by the bluetooth elements of both blocks.
#
# Worth recording how this was established, because the obvious method fails.
# Android resolves a conversion by REFLECTION: it looks for a declared class of
# that name taking an XmlPullParser - which then reads its own attributes - and
# falls back to a declared static method of the same name. So the vocabulary is
# the set of declared classes and methods of ConversionsInput/Output/Config, and
# an attribute like decimalPoint appears nowhere in the block parser at all.
# iOS uses a ConversionFunction enum plus a switch for the three names that are
# not simple numeric conversions.
#
# Compared name by name, all three vocabularies agree exactly.

conversions:
  numeric: &numeric
    - uInt8
    - int8
    - uInt16LittleEndian
    - uInt16BigEndian
    - int16LittleEndian
    - int16BigEndian
    - uInt24LittleEndian
    - uInt24BigEndian
    - int24LittleEndian
    - int24BigEndian
    - uInt32LittleEndian
    - uInt32BigEndian
    - int32LittleEndian
    - int32BigEndian
    - float32LittleEndian
    - float32BigEndian
    - float64LittleEndian
    - float64BigEndian

  input:
    summary: Bytes from a characteristic to numbers, for a bluetooth input.
    agreement: agreed
    functions: *numeric
    extra:
      - name: singleByte
        summary: Synonym for uInt8.
      - name: string
        summary: >-
          Parses the bytes as text. Takes decimalPoint, offset, repeating and
          length.
      - name: formattedString
        summary: >-
          Parses the bytes as text and selects one field. Takes separator, label
          and index.

  output:
    summary: Numbers to bytes, for a bluetooth output.
    agreement: agreed
    functions: *numeric
    extra:
      - name: singleByte
        summary: Synonym for uInt8.
      - name: string
        summary: Formats the value as text.
      - name: byteArray
        summary: Writes the buffer contents as raw bytes.

  config:
    summary: The text of a config element to bytes.
    agreement: agreed
    functions: *numeric
    extra:
      - name: singleByte
        summary: Synonym for uInt8.
      - name: string
        summary: Writes the text as-is.
      - name: hexadecimal
        summary: >-
          Parses the text as hexadecimal byte pairs. Spaces are stripped first,
          any other non-hexadecimal character makes the result empty, and a
          dangling digit of an odd-length text is ignored.
