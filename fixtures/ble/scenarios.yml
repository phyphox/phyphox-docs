# BLE compatibility scenarios (test-matrix rows ble-compat-arduino and
# ble-compat-micropython, tier T2, release-gated).
#
# What is under test is the PHYPHOX APP, not the libraries: a release must
# not break Arduino or MicroPython projects that worked with the previous
# release. The sketches are stimulus and are flashed as they are - a
# rewritten sketch would no longer represent a real project - so anything
# odd about what they emit (the library sends XML with no xmlns and
# declares format 1.15) is the compatibility surface to preserve, not a
# defect to report.
#
# ONE edit is made, on the maintainer's instruction (2026-08-28): the
# start() call is rewritten so the board advertises a BENCH TAG after its
# name - "phyphox device L3", where L is the host and 3 is the flash
# number within the current run (it restarts at 1 every run).
# It buys three things: progress readable from across the room, a board
# left over from an earlier run that can no longer be mistaken for this
# one, and the two hosts running the suite at the same time with an ESP32
# each. The name is the one thing about a sketch that identifies a
# device rather than exercising the app, so changing it cannot hide an
# app defect; the one real risk is an over-long name, which is why the
# tag is short and why rename_source() refuses anything past 26
# characters. The edit is made on a COPY - the library checkouts are
# never touched - and the tag is stripped back out of captured XML
# before it becomes a corpus fixture.
#
# Per scenario:
#   example      the example's directory name in the library repository
#   device_name  what it advertises BEFORE the bench tag is appended
#                (from its start() call; the library default is
#                "phyphox-Arduino"). Where an example names itself, this
#                must match the literal in its source - the renamer
#                refuses to flash a board when the two disagree, because
#                nothing measured against either would mean anything.
#                When a second board is on
#                the bench the suite keeps it advertising a DIFFERENT
#                name as a DISTRACTOR, so the scan has to discriminate -
#                a room with one BLE device in it is not the room these
#                run in. With the single-board bench below that cannot
#                happen and every run says so in its warnings.
#   boards       which lab boards it is flashed to
#   phones       all | newest - the four scenarios that exercise
#                different parts of the BLE implementation run on every
#                phone (Android's BLE behaviour varies by version and by
#                manufacturer, which is the point of the lab); the rest
#                only prove they still work, on the newest phone of each
#                platform
#   expect.kind  structure | range_rate | connection | board_serial
#                - structure:    the experiment must still look like what
#                                the reference release received - same
#                                title, same buffers, data still arriving
#                                in the same ones. NOT the same values:
#                                every scenario in this class emits random
#                                or time-derived data, so recorded values
#                                could never repeat (CreateExperiment
#                                writes random(0,100) and its square,
#                                multigraph millis()-derived sine and
#                                cosine)
#                - range_rate:   the stimulus is random, so only its
#                                range and cadence can be asserted
#                - connection:   negotiated parameters; assert the link
#                                works and data flows in the right order
#                                of magnitude
#                - board_serial: the direction is phone -> board, so the
#                                assertion channel is the board's own
#                                serial output
#
# MicroPython names come with a caveat found during bring-up: the library
# puts NO name in the advertising payload (only the service UUID) and
# carries the device name in the SCAN RESPONSE instead, so what a phone
# displays depends on whether it reads that response. A Pixel 3 on Android
# 12 does, and showed exactly the name start() was given ("phyphox",
# 2026-08-27) - but that is one phone, and the lab exists because BLE
# behaviour varies by version and manufacturer. If a phone shows something
# else the connect test should record what it saw rather than assume; that
# discrepancy is the library's business, not ours to fix.
#
# Buffer names and recorded values live in baselines/, captured once from
# the CURRENT STORE RELEASE so that "the previous version worked" is a
# measured fact. Re-recording is deliberate and reviewed.
#
# That release predates every seam the driver steers a phone with, so the
# recording is operator-assisted by necessity, not by choice:
# `run.py --record-ble-baseline` flashes and measures, a human does the
# connect and switches remote access on. See tools/lab/README.md.
#
# --- Scope: one board, many phones (maintainer, 2026-08-28) -------------
#
# Every scenario here runs on the ESP32 alone. The bench Nano 33 BLE
# stopped accepting uploads entirely that day - not from this driver, not
# from the Arduino IDE, not from a second PC - and is presumed dead.
#
# It is not being replaced, because the split it forced is the right one
# anyway: a RELEASE test asks "does the app still talk to boards", which
# one board answers, across every phone in the lab; a LIBRARY test asks
# "does the library still work on its boards", which needs many boards
# and only one phone. The second belongs with phyphox-arduino and will be
# built when that library is next worked on; this file is the first.
#
# So the driver keeps its per-board machinery (it is what the library
# test will need, and it degrades to one board correctly) while the
# scenarios name one. Two things are genuinely lost meanwhile and are
# recorded rather than papered over: the scan runs with no distractor,
# and NRF52 coverage is gone - the library emits different XML per board
# (fixtures/ble/captured/README.md), so the ESP32's output is not
# evidence about the Nano's.

libraries:
  arduino:
    repository: ../phyphox-arduino
    examples: examples
    declares_format_version: "1.15"
    flash:
      tool: arduino-cli
      fqbn:
        # PartitionScheme=huge_app, not the default 1.2 MB app partition:
        # three of these examples overflow it ("Textbereich ueberschreitet
        # den verfuegbaren Platz auf der Platine"). The bench board is a
        # 4 MB ESP32-D0WDQ6, so 3 MB of app is available; nothing here uses
        # OTA or a filesystem.
        esp32: esp32:esp32:esp32:PartitionScheme=huge_app
        # A board added here is flashed and driven without further changes
        # - the fqbn is all the driver needs. `nano33ble:
        # arduino:mbed_nano:nano33ble` is what the retired Nano used.
  micropython:
    repository: ../phyphox-micropython
    examples: examples
    declares_format_version: "1.10"
    boards: [esp32]        # the library supports the ESP32 only
    flash:
      tool: mpremote       # the library and the example are copied over
      firmware: esptool    # ...but the ESP32 is shared with the Arduino
                           # scenarios, whose uploads overwrite the whole
                           # flash, so the suite reflashes the MicroPython
                           # firmware itself before these run. It probes
                           # the board first (mpremote eval) and only
                           # flashes when it has to, so a rerun that finds
                           # MicroPython already there skips a minute of
                           # erase and write. The image comes from
                           # --micropython-firmware; the run order puts all
                           # Arduino scenarios first so the line is crossed
                           # once.

scenarios:
  # --- Arduino, on every phone -------------------------------------------
  - example: randomNumbers
    library: arduino
    device_name: "phyphox device"
    boards: [esp32]
    phones: all
    expect:
      kind: range_rate
      min: 0
      max: 100
      rate_hz: 20          # write() every 50 ms in the sketch
      rate_tolerance: 0.5
    why: >-
      The plainest case: no experiment is defined in the sketch, so the
      library serves its default one. Proves discovery, transfer of the
      default experiment and the data path.

  - example: connectionParameter
    library: arduino
    device_name: "phyphox-Arduino"
    boards: [esp32]
    phones: all
    expect:
      kind: connection
      min_connection_interval_ms: 7.5
      max_connection_interval_ms: 30
    why: >-
      Sets the BLE connection interval explicitly. Phones and stacks
      handle negotiation differently, which is exactly the kind of
      difference this lab exists to catch.

  - example: getSensorDataFromSmartphone
    library: arduino
    device_name: "phyphox-Arduino"
    boards: [esp32]
    phones: all
    expect:
      kind: board_serial
      # What the sketch actually prints on receiving a value, read off
      # getSensorDataFromSmartphone.ino:51-61 - the first pass asserted
      # invented strings ("Acc") and failed against a board that was
      # working perfectly.
      contains_any: ["x: ", "data:"]
    why: >-
      The phone sends its accelerometer data TO the board over the config
      characteristic. The board prints what it received, so its serial
      output is the assertion channel.

  - example: getSystemAndEventTime
    library: arduino
    device_name: "phyphox-Arduino"
    boards: [esp32]
    phones: all
    expect:
      kind: board_serial
      trigger: start_stop      # the host starts and stops the experiment
      # getSystemAndEventTime.ino:20-27. The board prints its burst AT the
      # event, so the suite opens the serial port before triggering - a
      # reader started afterwards catches the tail of one line and
      # concludes the board said nothing.
      contains_any: ["New experiment event received", "Event type",
                     "Experiment time [ms]", "Unix system time [ms]"]
    why: >-
      Exercises the event characteristic: the board reacts to the
      experiment being started and stopped on the phone. No MicroPython
      counterpart exists.

  # --- Arduino, newest phone of each platform only -----------------------
  - example: CreateExperiment
    library: arduino
    device_name: "create experiment"
    boards: [esp32]
    phones: newest
    expect:
      kind: structure
    why: >-
      A full hand-written experiment definition - the widest XML surface
      the library emits.

  - example: getDataFromSmartphone
    library: arduino
    device_name: "phyphox-Arduino"
    boards: [esp32]
    phones: newest
    build_properties:
      # The sketch blinks LED_BUILTIN, which the generic esp32 board does
      # not define (the variants that do, doit-devkit-v1 and nodemcu-32s,
      # offer no PartitionScheme option, and this sketch needs both). GPIO2
      # is the DevKit's on-board LED. This is board configuration, not an
      # edit to the example - the LED is decoration here, the assertion is
      # the board's serial output.
      esp32:
        compiler.cpp.extra_flags: -DLED_BUILTIN=2
    expect:
      kind: board_serial
      # Nothing reaches this board until a view element changes: it takes
      # its interval from an edit/slider on channel 1 (CB1 in the
      # generated XML), so the host writes one. 300 ms is inside the
      # slider's 50..1000 range.
      trigger:
        set: {buffer: CB1, value: 300}
      # getDataFromSmartphone.ino:107-112.
      contains_any: ["interval: 300", "Mode: ", "LED state: "]
    why: The write direction from a view element rather than a sensor.

  - example: multigraph
    library: arduino
    device_name: "phyphox-Arduino"
    boards: [esp32]
    phones: newest
    expect:
      kind: structure
    why: Several channels at once, which is where channel mapping breaks.

  # --- MicroPython, ESP32 only -------------------------------------------
  - example: randomNumbers
    library: micropython
    device_name: "phyphox"     # the library's start() default
    boards: [esp32]
    phones: all
    expect:
      kind: range_rate
      min: 0
      max: 100
      rate_hz: 2           # sleep_ms(500) in the example, not the
                           # Arduino sketch's 50 ms - measured 2.0 Hz
      rate_tolerance: 0.5
    why: The MicroPython counterpart of the plainest Arduino case.

  - example: createExperiment
    library: micropython
    device_name: "My Device"
    boards: [esp32]
    phones: newest
    expect:
      kind: structure
    why: The MicroPython library's own XML generator, end to end.

  - example: getDataFromSmartphone
    library: micropython
    device_name: "My Device"
    boards: [esp32]
    phones: all
    # Disabled 2026-08-28 by the maintainer. The example's own main loop
    # is `while True:` with no sleep (getDataFromSmartphone.py:40-45), so
    # it never yields to the MicroPython scheduler and BLE degrades until
    # the older phones cannot connect at all - proven on the bench, where
    # mpremote cannot even reach the REPL of a board running it until a
    # sleep_ms(10) is added, and where the same phone drove the Arduino
    # board perfectly in the same pass. That is the example being broken
    # rather than the app, and it is not worth working around from the
    # phyphox side; it is fixed in phyphox-micropython (see
    # MicroPython-TODO.md in the working root) and this key comes out
    # again then.
    #
    # Two traps if you go near it: print() yields to the scheduler, so
    # instrumenting the loop hides the very bug you are looking for; and
    # `mpremote ... eval` soft-resets the board, so probing it mid-test
    # changes what you are measuring.
    disabled: >-
      the example never yields to the MicroPython scheduler, which
      degrades BLE until old phones cannot connect
    expect:
      kind: board_serial
      trigger:
        set: {buffer: CB1, value: 300}
      # examples/getDataFromSmartphone.py:51.
      contains_any: ["New Interval"]
    why: >-
      The write direction on MicroPython. Runs on every phone because the
      config characteristic is where stacks differ most.
