# App language -> store listing locale.
#
# The app ships 23 languages (../languages.yml). Neither store uses the same
# spelling, and neither supports exactly that set, so the mapping has to be
# written down once rather than guessed in two scripts.
#
#   android:  the Play listing locale, and the directory name the capture
#             writes. A LIST where one app language feeds several listings.
#             Play's spelling wins over F-Droid's, which is the more forgiving
#             of the two.
#   ios:      the App Store Connect localization, or `null` where the App Store
#             has none - the listing then falls back to English there, which is
#             not a decision anyone made but a limit of the store. A LIST where
#             one app language feeds several listings, exactly like `android`.
#
# Screenshots are produced for the app languages; store TEXT exists for far
# more (phyphox-translation/store/ has 40 locales). A locale with text but no
# screenshots is normal - both stores fall back to the default listing's
# images - and must not be treated as an error.
#
# STATUS: checked against the store itself on 2026-09-01. The seventeen that
# already have a listing were read back through the API; the three that do not
# (gu, ko-KR, ta-IN) could not be checked that way and were probed by writing a
# listing into a throwaway edit. That caught one error: Play wants bare `gu` for
# Gujarati and rejects `gu-IN`, while Korean and Tamil do take the regional
# form. Every mapping below is now confirmed against the store,
# including the three that had been marked `verify`. Two facts came out of it:
# Portuguese is two listings (see below), and gu-IN, ko-KR and ta-IN have no
# listing yet - they are the languages the app gained since the last store
# update, and creating one needs its text uploaded first.

locales:
  - {app: en,       android: en-US,  ios: en-US}
  - {app: cs,       android: cs-CZ,  ios: cs}
  - {app: de,       android: de-DE,  ios: de-DE}
  - {app: el,       android: el-GR,  ios: el}
  - {app: es,       android: es-ES,  ios: es-ES}
  - {app: fr,       android: fr-FR,  ios: fr-FR}
  - {app: gu,       android: gu,     ios: gu}      # no listing yet; Play wants bare `gu`
  - {app: hi,       android: hi-IN,  ios: hi}
  - {app: it,       android: it-IT,  ios: it}
  - {app: ja,       android: ja-JP,  ios: ja}
  - {app: ka,       android: ka-GE,  ios: null}   # no Georgian on the App Store
  - {app: ko,       android: ko-KR,  ios: ko}      # no listing on the store yet
  - {app: nl,       android: nl-NL,  ios: nl-NL}
  - {app: pl,       android: pl-PL,  ios: pl}
  # The app has one Portuguese; BOTH stores have two listings. The pt
  # translation is knowingly duplicated to both as a compromise (maintainer,
  # 2026-09-01), so the screenshots are too. The App Store's pt-BR was found by
  # reading the live listing back (2026-09-01): leaving it out would have left
  # it on the previous release's text while pt-PT moved on.
  - {app: pt,       android: [pt-PT, pt-BR], ios: [pt-PT, pt-BR]}
  - {app: ru,       android: ru-RU,  ios: ru}
  - {app: sr,       android: sr,     ios: null}   # no Serbian on the App Store
  - {app: sr-Latn,  android: sr,     ios: null}
  - {app: ta,       android: ta-IN,  ios: ta}      # no listing on the store yet
  - {app: tr,       android: tr-TR,  ios: tr}
  - {app: vi,       android: vi,     ios: vi}
  - {app: zh-Hans,  android: zh-CN,  ios: zh-Hans}
  - {app: zh-Hant,  android: zh-TW,  ios: zh-Hant}

# Two entries map to the same Android directory on purpose: Play has one
# Serbian listing locale, and the app has both scripts. Whichever is captured
# last would win, so the capture script must be told which one to use - see
# `serbian_screenshots` below rather than letting it depend on iteration order.
serbian_screenshots: sr
