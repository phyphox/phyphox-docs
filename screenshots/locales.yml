# App language -> store listing locale.
#
# The app ships 23 languages (../languages.yml). Neither store uses the same
# spelling, and neither supports exactly that set, so the mapping has to be
# written down once rather than guessed in two scripts.
#
#   android:  the directory name under fastlane/metadata/android/. It has to be
#             a locale Google Play accepts or `supply` refuses the upload.
#             F-Droid reads the same tree and is the more forgiving of the two,
#             so Play's spelling wins.
#   ios:      the App Store Connect localization, or `null` where the App Store
#             has none - the listing then falls back to English there, which is
#             not a decision anyone made but a limit of the store.
#
# Screenshots are produced for the app languages; store TEXT exists for far
# more (phyphox-translation/store/ has 40 locales). A locale with text but no
# screenshots is normal - both stores fall back to the default listing's
# images - and must not be treated as an error.
#
# STATUS: first cut, needs the maintainer's review (plan decision D2). The
# entries marked `verify: true` are the ones nobody has checked against the
# store's own list of accepted locales.

locales:
  - {app: en,       android: en-US,  ios: en-US}
  - {app: cs,       android: cs-CZ,  ios: cs}
  - {app: de,       android: de-DE,  ios: de-DE}
  - {app: el,       android: el-GR,  ios: el}
  - {app: es,       android: es-ES,  ios: es-ES}
  - {app: fr,       android: fr-FR,  ios: fr-FR}
  - {app: gu,       android: gu-IN,  ios: gu,     verify: true}
  - {app: hi,       android: hi-IN,  ios: hi}
  - {app: it,       android: it-IT,  ios: it}
  - {app: ja,       android: ja-JP,  ios: ja}
  - {app: ka,       android: ka-GE,  ios: null}   # no Georgian on the App Store
  - {app: ko,       android: ko-KR,  ios: ko}
  - {app: nl,       android: nl-NL,  ios: nl-NL}
  - {app: pl,       android: pl-PL,  ios: pl}
  - {app: pt,       android: pt-PT,  ios: pt-PT}
  - {app: ru,       android: ru-RU,  ios: ru}
  - {app: sr,       android: sr,     ios: null}   # no Serbian on the App Store
  - {app: sr-Latn,  android: sr,     ios: null,   verify: true}
  - {app: ta,       android: ta-IN,  ios: ta,     verify: true}
  - {app: tr,       android: tr-TR,  ios: tr}
  - {app: vi,       android: vi,     ios: vi}
  - {app: zh-Hans,  android: zh-CN,  ios: zh-Hans}
  - {app: zh-Hant,  android: zh-TW,  ios: zh-Hant}

# Two entries map to the same Android directory on purpose: Play has one
# Serbian listing locale, and the app has both scripts. Whichever is captured
# last would win, so the capture script must be told which one to use - see
# `serbian_screenshots` below rather than letting it depend on iteration order.
serbian_screenshots: sr
