# The store screenshot scenes - the six pictures both stores show, described once.
#
# Why here and not in an app repo: both platforms must show the same six things
# from the same data, and a scene that quietly exists on one platform only is the
# drift this repository exists to prevent - the same reason test-matrix.yml lives
# here. The platform halves (booting emulators, setting the language, capturing)
# stay in the app repos; this file and screenshots/data/ are the shared part.
#
# See ../STORE-RELEASE-PLAN.md in the working root for the whole system.
#
# Fields:
#   id           the scene's name, and the screenshot's filename stem
#   kind         "collection" for the experiment list, "experiment" otherwise
#   experiment   path within the shipped collection, i.e. what
#                phyphox://asset= would name
#   view         the LABEL of the view to show, as written in the file's root
#                locale. tools/screenshots/compose.py resolves it to the index
#                the app's -phyphoxView / debug.phyphox.view seam takes, and
#                fails loudly if no view carries that label - which is what
#                turns a renamed view into a build error rather than a wrong
#                screenshot.
#   record       the containers tools/screenshots/record.py pulls off a phone.
#                Named explicitly rather than "whatever /get offers": a
#                screenshot needs the few buffers its view reads, and dragging
#                a whole experiment's state along would make the fixture
#                unreviewable and the init strings enormous.
#   data         where that recording is kept, in /get's own shape, written
#                into the named containers as init values
#   theme        "light" for the one scene that shows the app's light mode
#                exists. Everything else uses the app's default, which is
#                permanent dark regardless of the system setting. The capture
#                script has to walk the app's own settings UI to change it and
#                put it back, because the preference is not reachable from the
#                shell on a production build.
#   source       what was actually measured. A recording is a picture as much
#                as a measurement, and the next person to look at a screenshot
#                and wonder "what am I seeing?" should not have to guess.
#   init         literal values for containers that hold settings rather than
#                measurements - no recording needed
#   note         why this scene is in the set

scenes:

  - id: main
    kind: collection
    note: >-
      The experiment collection. Needs no data, but does need every entry to
      look available: on an emulator almost no sensor exists and half the list
      would be greyed out, which is what -phyphoxAssumeSensors /
      debug.phyphox.assumeSensors is for.

  - id: accelerometer
    kind: experiment
    experiment: accelerometer.phyphox
    view: Graph
    record: [acc_time, accX, accY, accZ]
    data: accelerometer.json
    source: >-
      An improvised swing showing a damped oscillation, recorded on a Pixel 9
      Pro at about 400 Hz. Good enough for now (maintainer, 2026-08-31); a
      cleaner swing would be worth re-recording one day.

      Two edits to the raw capture, both the maintainer's call. The tail is cut
      at 31.5 s, where the phone is caught again - 12527 of 13666 samples
      remain. The start is NOT cut: this experiment always begins at t=0, and
      the setup at the beginning is part of what it looks like.

      The times are shifted so the first sample sits at exactly 0 rather than
      at the 0.019 s when it happened to arrive. That is not cosmetic tidying:
      GraphView picks its first tic as ceil(min/step)*step (GraphView.java:1185),
      so an axis starting at 0.019 with a 10 s step puts the first tic at 10 and
      the "0" label disappears from the axis. Nothing to do with screen size.
    note: >-
      The plainest thing phyphox does, and the safest scene to inject into:
      the file has no <analysis> block at all, so the graphs read the sensor
      buffers directly and nothing can recompute over the injected values.

  - id: camera-luminance
    kind: experiment
    experiment: camera-luminance.phyphox
    view: Luminance
    record: [t, luminance, frameRate]
    data: camera-luminance.json
    source: >-
      Nothing special - the phone pointed at various things in turn, on a
      Pixel 9 Pro. Note the recorded frame rate is 60 Hz, and it will read 60 Hz
      in the iOS screenshot too even though iPhones reach 240 Hz. That is
      deliberate: for a promotional picture it does not matter, and this way the
      listing does not promise a number the device in the reader's hand may not
      deliver.
    composite: camera
    note: >-
      The camera experiment. Its camera-gui preview cannot render on a
      simulator or emulator, so the preview rectangle is composited afterwards
      (plan section 6.1). Everything else on the screen is the real app.

  - id: audio-spectrum
    kind: experiment
    experiment: audio_spectrum.phyphox
    view: History
    record: [fmap, tmap, fftmap, t, f0]
    data: audio-spectrum.json
    source: >-
      C major played across several octaves on the xylophone preset of a
      digital piano, recorded on a Pixel 9 Pro. The rising staircase in the
      History plot is the scale; the harmonics of each note are the vertical
      structure in the map.
    note: >-
      The history map plot, which is the most distinctive view phyphox has.
      Its <analysis requireFill="recording"> will not run while `recording` is
      empty, so injected map data is safe from being recomputed away.

  - id: strobe
    kind: experiment
    experiment: strobe.phyphox
    view: Strobe
    init:
      frequency: [12]
      dutycycle: [0.35]
      intensity: [0.9]
    note: >-
      An output experiment rather than a measurement. period, on, off and the
      preview graph are analysis outputs derived from these three, so only the
      settings are set here - the app computes the rest, which is also what
      makes this scene a check that analysis runs at all on a stopped
      experiment (spike S1). Brightness is 0.9 rather than 1: it puts the
      slider somewhere more interesting than its end stop, and it lifts the
      preview's upper plateau off the plot's top edge, where the renderer's
      one-pixel scissor inset swallows it (S9).

  - id: tone-generator
    kind: experiment
    experiment: tone_generator.phyphox
    view: Controls
    theme: light
    init:
      channels: [2]
      advanced: [1]
      f1: [440]
      f2: [660]
    note: >-
      Two channels with the advanced controls shown, on the first tab. c2 and
      c2advanced are derived (`channels > 1`, and c2 * advanced), so setting
      the two settings containers is enough and the file's own analysis does
      the rest.

      This is the scene shot in LIGHT MODE, so the listing shows that the app
      has one (maintainer, 2026-08-31). It is deliberately not one of the first
      screenshots: the audio spectrum has better contrast on a dark background,
      and the stroboscope is new enough that a reader might take the light
      theme for something specific to it rather than an app-wide setting.
