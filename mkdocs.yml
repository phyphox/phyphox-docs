site_name: phyphox documentation
site_description: >-
  Technical documentation for phyphox - the experiment file format, the
  remote-interface API and the experiment editor.
site_url: https://phyphox.org/docs/
repo_url: https://github.com/phyphox/phyphox-docs
edit_uri: edit/main/docs/
copyright: >-
  RWTH Aachen University. "phyphox" and "RWTH Aachen University" as well as the
  RWTH Aachen logo are registered trademarks.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - tools/hooks.py

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys

plugins:
  - search
  - awesome-nav
